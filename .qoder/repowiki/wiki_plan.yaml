version: 1

repowiki:
  notes:
    - text: "本仓是鸣鸣很忙产研域 Harness 文档仓：需求、排期、发布、报告、成本与运维的结构化 Markdown 文档与原型资产，不含可运行服务代码。"
    - text: "功能正文以各三级模块的 references/ 与 assets/ 为真源；AGENTS.md 与各层 SKILL.md 仅作导航与定位，不复述规则细节。"
    - text: "只描述当前生效的规则与流程；排期基线、产能参考等目标值不得写成已验证成果；wiki 正文使用中文。"
  documents:
    - title: "仓库总览"
      goal: "介绍产研 Harness 工程定位、目录分层约定（子域 → 功能模块）、文件用途约定与导航入口。"
      parent: ""
      hints: "AGENTS.md"
    - title: "排期管理"
      goal: "排期管理子域的定位与下辖功能模块总览。"
      parent: ""
      hints: "排期管理/"
    - title: "功能排期"
      goal: "功能排期模块的业务规则、数据口径与页面说明，含项目映射真源。"
      parent: "排期管理"
      hints: "排期管理/功能排期/"
    - title: "需求管理"
      goal: "需求管理模块面向业务、实施与运维的需求流转规则。"
      parent: "排期管理"
      hints: "排期管理/需求管理/"
    - title: "研发报告"
      goal: "研发报告子域的定位、报告体系与生成机制总览。"
      parent: ""
      hints: "研发报告/"
    - title: "人员产出报告"
      goal: "人员产出报告的统计口径、频率与生成规则。"
      parent: "研发报告"
      hints: "研发报告/人员产出报告/"
    - title: "报告配置"
      goal: "报告配置模块的规则，含报告侧项目映射扩展。"
      parent: "研发报告"
      hints: "研发报告/报告配置/"
    - title: "故障报告"
      goal: "故障报告的分级分类口径、频率与生成规则。"
      parent: "研发报告"
      hints: "研发报告/故障报告/"
    - title: "文档一致性报告"
      goal: "文档代码一致性校验的口径与报告生成规则。"
      parent: "研发报告"
      hints: "研发报告/文档一致性报告/"
    - title: "项目进度报告"
      goal: "项目进度报告的口径、频率与生成规则。"
      parent: "研发报告"
      hints: "研发报告/项目进度报告/"
    - title: "成本管理"
      goal: "成本管理子域的定位与下辖功能模块总览。"
      parent: ""
      hints: "成本管理/"
    - title: "Token 管理"
      goal: "Token 用量的模型、时段与用量监控规则。"
      parent: "成本管理"
      hints: "成本管理/Token管理/"
    - title: "功能使用情况管理"
      goal: "基于 log、前端埋点与 db 的功能使用情况观察规则。"
      parent: "成本管理"
      hints: "成本管理/功能使用情况管理/"
    - title: "项目成本管理"
      goal: "项目费用与人员成本（云费用、工资、差旅、Token）的汇总报表规则。"
      parent: "成本管理"
      hints: "成本管理/项目成本管理/"
    - title: "运维管理"
      goal: "运维管理子域的定位与下辖功能模块总览。"
      parent: ""
      hints: "运维管理/"
    - title: "服务器监控"
      goal: "服务器监控规则，含异常快照、节假日快照及与错误日志、黑灯工厂的关联。"
      parent: "运维管理"
      hints: "运维管理/服务器监控/"
    - title: "错误日志管理"
      goal: "错误日志的接入、分级分类与管理规则。"
      parent: "运维管理"
      hints: "运维管理/错误日志管理/"
    - title: "黑灯工厂管理"
      goal: "黑灯工厂的问题分级分类与自动修复边界规则。"
      parent: "运维管理"
      hints: "运维管理/黑灯工厂管理/"

knowledgecard:
  notes:
    - text: "知识卡按目录边界划分：每个二级子域一张总卡，其下每个三级功能模块各一张卡。"
    - text: "报告口径、状态枚举等细节以对应功能 references/ 为真源，卡片只指向真源、不复述枚举值。"

version: 1

repowiki:
  notes:
    - text: "本仓是鸣鸣很忙产研域 Harness 文档仓：需求、排期、发布、报告、成本与运维的结构化 Markdown 文档与原型资产，不含可运行服务代码。"
    - text: "以代码菜单分组与叶子页面划分功能，研发报告与研发管理平级；详情、提交、编辑、抽屉、弹窗与页签不新增菜单层级。目录名称只去除展示性空格。"
    - text: "功能正文以各叶子 references/ 与 assets/ 为真源；需求管理和平台能力的分组 references/ 只承载共享规则与导航，AGENTS.md 与分组 SKILL.md 不复述功能正文。"
    - text: "只描述当前生效的规则与流程；排期基线、产能参考等目标值不得写成已验证成果；wiki 正文使用中文。"
    - text: "补充功能中的成本、监控和发布资料不代表当前 DevHub 已登记菜单；外部 Portal、App 与线上资源树未核验，不得写成已实现或已下线。产品目标与代码实现差距不能用删改目标掩盖。"
  documents:
    - title: "仓库总览"
      goal: "介绍产研 Harness 工程定位、代码菜单对应的目录层级、共享真源、补充功能边界与导航入口。"
      parent: ""
      hints: "AGENTS.md"
    - title: "需求管理"
      goal: "介绍需求管理的五个同级菜单、跨功能业务规则与共享导航。"
      parent: ""
      hints: "需求管理/"
    - title: "需求工单管理"
      goal: "需求列表、详情、提交、审批、排期关联与缺陷分流的功能边界。"
      parent: "需求管理"
      hints: "需求管理/需求工单管理/"
    - title: "需求审批配置"
      goal: "审批链、归属、群通知映射与审批统计的配置规则。"
      parent: "需求管理"
      hints: "需求管理/需求审批配置/"
    - title: "需求外链管理"
      goal: "一次性外链生成、台账、撤销与公开 H5 提交规则。"
      parent: "需求管理"
      hints: "需求管理/需求外链管理/"
    - title: "需求SLA看板"
      goal: "需求审批时效、滞留、预警与统计查询的功能边界。"
      parent: "需求管理"
      hints: "需求管理/需求SLA看板/"
    - title: "SLA规则配置"
      goal: "催办、升级、目标日期预警与去重规则配置。"
      parent: "需求管理"
      hints: "需求管理/SLA规则配置/"
    - title: "研发管理"
      goal: "研发管理下功能排期管理与 Qoder 用量分析的菜单分组与边界。"
      parent: ""
      hints: "研发管理/"
    - title: "功能排期管理"
      goal: "功能排期模块的业务规则、数据口径与页面说明，含项目映射真源。"
      parent: "研发管理"
      hints: "研发管理/功能排期管理/"
    - title: "Qoder 用量分析"
      goal: "Credits 用量的人员、部门、日期和模型分析，不与 MCP 令牌管理混淆。"
      parent: "研发管理"
      hints: "研发管理/Qoder用量分析/"
    - title: "研发报告"
      goal: "独立研发报告分组的定位、六个菜单、共享机制与服务端生成。"
      parent: ""
      hints: "研发报告/"
    - title: "报告配置"
      goal: "单页三个页签的配置规则、项目映射扩展与报告共享真源。"
      parent: "研发报告"
      hints: "研发报告/报告配置/"
    - title: "人员产出报告"
      goal: "人员产出统计、周报与日报同菜单查阅、生成规则与版本回溯。"
      parent: "研发报告"
      hints: "研发报告/人员产出报告/"
    - title: "文档一致性报告"
      goal: "文档代码一致性校验的口径与报告生成规则。"
      parent: "研发报告"
      hints: "研发报告/文档一致性报告/"
    - title: "产品文档健康度报告"
      goal: "产品文档质量全量只读评估、模块与仓库评分、环比及修复建议。"
      parent: "研发报告"
      hints: "研发报告/产品文档健康度报告/"
    - title: "项目进度报告"
      goal: "项目进度与全部项目汇总的统计、归档及查阅规则。"
      parent: "研发报告"
      hints: "研发报告/项目进度报告/"
    - title: "故障报告"
      goal: "人工故障登记、处理、复盘与闭环，区分黑灯巡检工单。"
      parent: "研发报告"
      hints: "研发报告/故障报告/"
    - title: "平台能力"
      goal: "五个同级接入菜单与共享接入、数据、权限规则；不存在 MCP 接入管理中层菜单。"
      parent: ""
      hints: "平台能力/"
    - title: "我的令牌"
      goal: "令牌列表、生成、编辑、续期、吊销、详情与接入配置。"
      parent: "平台能力"
      hints: "平台能力/我的令牌/"
    - title: "权限分配"
      goal: "按人或批量分配工具族和数据库权限及授权变更记录。"
      parent: "平台能力"
      hints: "平台能力/权限分配/"
    - title: "数据源管理"
      goal: "只读数据源登记、详情、库表开放、脱敏与查询上限。"
      parent: "平台能力"
      hints: "平台能力/数据源管理/"
    - title: "研发工具资源"
      goal: "研发工具资源菜单下研发代码仓与云效成员同步的功能边界。"
      parent: "平台能力"
      hints: "平台能力/研发工具资源/"
    - title: "调用审计"
      goal: "调用证据、拒绝原因、汇总明细、详情与导出规则。"
      parent: "平台能力"
      hints: "平台能力/调用审计/"
    - title: "运维管理"
      goal: "当前 DevHub 运维管理分组与黑灯工厂工单菜单。"
      parent: ""
      hints: "运维管理/"
    - title: "黑灯工厂工单"
      goal: "项目巡检建单、认领、处理、复核、关闭及自动修复边界。"
      parent: "运维管理"
      hints: "运维管理/黑灯工厂工单/"
    - title: "补充功能"
      goal: "保留当前 DevHub 菜单无对应入口的需求资料，明确外部代码未核验与目录标记边界。"
      parent: ""
      hints: "补充功能/"
    - title: "成本管理"
      goal: "补充功能中的使用情况分析与研发费用资料，不代表当前 DevHub 成本菜单。"
      parent: ""
      hints: "补充功能/成本管理/"
    - title: "功能使用情况管理"
      goal: "Portal 系统设置下事件流水、使用报表与功能目录的目标规则，外部实现未核验。"
      parent: "成本管理"
      hints: "补充功能/成本管理/功能使用情况管理/"
    - title: "项目成本管理"
      goal: "研发费用与品牌分摊的目标规则，不与门店运费结算混为一谈。"
      parent: "成本管理"
      hints: "补充功能/成本管理/项目成本管理/"
    - title: "服务器监控"
      goal: "服务器异常快照、值守快照与证据关联目标，当前 DevHub 菜单无对应入口。"
      parent: "补充功能"
      hints: "补充功能/运维管理/服务器监控/"
    - title: "错误日志管理"
      goal: "每日异常指纹报表与标记目标，区别于黑灯巡检分诊，当前 DevHub 菜单无对应入口。"
      parent: "补充功能"
      hints: "补充功能/运维管理/错误日志管理/"

knowledgecard:
  notes:
    - text: "按代码菜单的分组与叶子目录划分知识卡；研发报告独立一级，需求与平台各五个叶子，页内详情、弹窗与页签不拆成菜单。分组 SKILL 是索引，不作为独立功能评分。"
    - text: "报告口径、状态、数据与权限规则以各真源为准；分组共享规则不复制到叶子，卡片只指向真源、不复述枚举值。"
    - text: "补充功能资料与当前 DevHub 菜单明确区分；未核验的外部系统及目标与实现差距不得写成已确认实现。"

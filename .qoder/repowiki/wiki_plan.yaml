version: 1

repowiki:
  notes:
    - text: "本仓是鸣鸣很忙产研域 Harness 文档仓：需求、排期、发布、报告、成本与运维的结构化 Markdown 文档与原型资产，不含可运行服务代码。"
    - text: "以需求定义的菜单分组与叶子页面划分功能，研发报告与研发管理平级；详情、提交、编辑、抽屉、弹窗与页签不新增菜单层级。目录名称只去除展示性空格。"
    - text: "功能正文以各叶子 references/ 与 assets/ 为真源；需求管理和平台能力的分组 references/ 只承载共享规则与导航，AGENTS.md 与分组 SKILL.md 不复述功能正文。"
    - text: "只描述当前生效的规则与流程；排期基线、产能参考等目标值不得写成已验证成果；wiki 正文使用中文。"
    - text: "所有功能按目标菜单归属组织，不按实施、建设或核验进度分类，不在产品文档中记录这些状态。单据、令牌和业务流程的状态属于产品规则，保持其真源定义。"
    - text: "Wiki 页面仅使用一层父子版式；研发成本统计和功能使用情况分析的总览页置顶，其源目录均归研发管理，不以 Wiki 版式改变菜单归属。"
  documents:
    - title: "仓库总览"
      goal: "介绍产研 Harness 工程定位、目标菜单对应的目录层级、共享真源与导航入口。"
      parent: ""
      hints: "AGENTS.md"
    - title: "需求管理"
      goal: "介绍需求管理的五个同级菜单、跨功能业务规则与共享导航。"
      parent: ""
      hints: "需求管理/"
    - title: "需求工单管理"
      goal: "需求列表、详情、提交、审批、排期关联与缺陷分流的功能边界。"
      parent: "需求管理"
      hints: "需求管理/需求工单管理/"
    - title: "需求审批配置"
      goal: "审批链、归属、群通知映射与审批统计的配置规则。"
      parent: "需求管理"
      hints: "需求管理/需求审批配置/"
    - title: "需求外链管理"
      goal: "一次性外链生成、台账、撤销与公开 H5 提交规则。"
      parent: "需求管理"
      hints: "需求管理/需求外链管理/"
    - title: "需求SLA看板"
      goal: "需求审批时效、滞留、预警与统计查询的功能边界。"
      parent: "需求管理"
      hints: "需求管理/需求SLA看板/"
    - title: "SLA规则配置"
      goal: "催办、升级、目标日期预警与去重规则配置。"
      parent: "需求管理"
      hints: "需求管理/SLA规则配置/"
    - title: "研发管理"
      goal: "研发管理下功能排期管理、Qoder 用量分析、研发成本统计、功能使用情况分析与发布管理的菜单分组与边界。"
      parent: ""
      hints: "研发管理/"
    - title: "功能排期管理"
      goal: "功能排期模块的业务规则、数据口径与页面说明，含项目映射真源。"
      parent: "研发管理"
      hints: "研发管理/功能排期管理/"
    - title: "Qoder 用量分析"
      goal: "Credits 用量的人员、部门、日期和模型分析，不与 MCP 令牌管理混淆。"
      parent: "研发管理"
      hints: "研发管理/Qoder用量分析/"
    - title: "研发报告"
      goal: "独立研发报告分组的定位、六个菜单、共享机制与服务端生成。"
      parent: ""
      hints: "研发报告/"
    - title: "报告配置"
      goal: "单页三个页签的配置规则、项目映射扩展与报告共享真源。"
      parent: "研发报告"
      hints: "研发报告/报告配置/"
    - title: "人员产出报告"
      goal: "人员产出统计、周报与日报同菜单查阅、生成规则与版本回溯。"
      parent: "研发报告"
      hints: "研发报告/人员产出报告/"
    - title: "文档一致性报告"
      goal: "文档代码一致性校验的口径与报告生成规则。"
      parent: "研发报告"
      hints: "研发报告/文档一致性报告/"
    - title: "产品文档健康度报告"
      goal: "产品文档质量全量只读评估、模块与仓库评分、环比及修复建议。"
      parent: "研发报告"
      hints: "研发报告/产品文档健康度报告/"
    - title: "项目进度报告"
      goal: "项目进度与全部项目汇总的统计、归档及查阅规则。"
      parent: "研发报告"
      hints: "研发报告/项目进度报告/"
    - title: "故障报告"
      goal: "人工故障登记、处理、复盘与闭环，区分黑灯巡检工单。"
      parent: "研发报告"
      hints: "研发报告/故障报告/"
    - title: "平台能力"
      goal: "五个同级接入菜单与共享接入、数据、权限规则；不存在 MCP 接入管理中层菜单。"
      parent: ""
      hints: "平台能力/"
    - title: "我的令牌"
      goal: "令牌列表、生成、编辑、续期、吊销、详情与接入配置。"
      parent: "平台能力"
      hints: "平台能力/我的令牌/"
    - title: "权限分配"
      goal: "按人或批量分配工具族和数据库权限及授权变更记录。"
      parent: "平台能力"
      hints: "平台能力/权限分配/"
    - title: "数据源管理"
      goal: "只读数据源登记、详情、库表开放、脱敏与查询上限。"
      parent: "平台能力"
      hints: "平台能力/数据源管理/"
    - title: "研发工具资源"
      goal: "研发工具资源菜单下研发代码仓与云效成员同步的功能边界。"
      parent: "平台能力"
      hints: "平台能力/研发工具资源/"
    - title: "调用审计"
      goal: "调用证据、拒绝原因、汇总明细、详情与导出规则。"
      parent: "平台能力"
      hints: "平台能力/调用审计/"
    - title: "运维管理"
      goal: "运维管理下黑灯工厂工单、错误日志管理与服务器监控的功能分工及证据关联。"
      parent: ""
      hints: "运维管理/"
    - title: "黑灯工厂工单"
      goal: "项目巡检建单、认领、处理、复核、关闭及自动修复边界。"
      parent: "运维管理"
      hints: "运维管理/黑灯工厂工单/"
    - title: "研发成本统计"
      goal: "研发管理下研发费用、品牌分摊及成本透视的共享规则与两菜单功能边界。"
      parent: ""
      hints: "研发管理/研发成本统计/"
    - title: "费用列表"
      goal: "费用制单、查询、审核、作废与分摊明细；详情、新增和编辑归费用列表功能。"
      parent: "研发成本统计"
      hints: "研发管理/研发成本统计/费用列表/"
    - title: "品牌成本报表"
      goal: "品牌、科目与年月维度的已审核费用分摊透视及统计口径。"
      parent: "研发成本统计"
      hints: "研发管理/研发成本统计/品牌成本报表/"
    - title: "发布管理"
      goal: "研发管理下发布卡片与发版回顾的功能归属。"
      parent: "研发管理"
      hints: "研发管理/发布管理/"
    - title: "功能使用情况分析"
      goal: "研发管理下事件采集、打标、注册共享规则与三个菜单功能分工。"
      parent: ""
      hints: "研发管理/功能使用情况分析/"
    - title: "事务流水明细"
      goal: "事件流水筛选、详情、相邻事件、行为摘要与导出规则。"
      parent: "功能使用情况分析"
      hints: "研发管理/功能使用情况分析/事务流水明细/"
    - title: "使用情况报表"
      goal: "KPI、趋势、角色、路由聚合、功能下钻与报表硬约束。"
      parent: "功能使用情况分析"
      hints: "研发管理/功能使用情况分析/使用情况报表/"
    - title: "功能目录管理"
      goal: "埋点自动注册表的查询、元数据编辑、启停及权限规则。"
      parent: "功能使用情况分析"
      hints: "研发管理/功能使用情况分析/功能目录管理/"
    - title: "服务器监控"
      goal: "运维管理下服务器异常快照、值守快照与证据关联规则。"
      parent: "运维管理"
      hints: "运维管理/服务器监控/"
    - title: "错误日志管理"
      goal: "运维管理下每日异常指纹报表与处理标记，区别于黑灯巡检分诊。"
      parent: "运维管理"
      hints: "运维管理/错误日志管理/"

knowledgecard:
  notes:
    - text: "按目标菜单的分组与叶子目录划分知识卡；研发报告独立一级，研发成本统计归研发管理，功能使用情况分析归研发管理，日志与监控归运维。页内详情、弹窗与页签不拆成菜单，分组 SKILL 只作索引。"
    - text: "报告口径、状态、数据与权限规则以各真源为准；分组共享规则不复制到叶子，卡片只指向真源、不复述枚举值。"
    - text: "只描述当前目标功能、规则与流程，不记录实施、建设或核验进度，不按这些状态建立知识分组；业务状态定义保持真源一致。"

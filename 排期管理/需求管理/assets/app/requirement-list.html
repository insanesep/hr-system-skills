<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>需求管理 · 我的需求 · App 原型</title>
<!--
  需求管理 · 我的需求列表（App 员工端原型）
  页面描述真源：../../references/app-ui.md#我的需求列表 ｜ 页面类型 list
  整页范例：busyming-skills-design/mobile/templates/list.html ｜ DOM 依据：skeletons/app/list-page.tsx.tpl
  结构：ac-nav-bar（返回 + 需求管理 + 提交）→ 顶部 Tab ×3（我提交的 / 待我审批·角标 / 已完成，吸顶）→ 卡片列表（整卡可点击）→ 加载更多
  App 端能力边界：不提供产品线 / 提交来源筛选器与「外部提交」视角；草稿仅查看（编辑须到 Web 端）；外部单不进「我提交的」。
  下拉刷新 / 上滑加载更多：手势在原型中以说明与「加载更多」按钮承载；每页 20 条。
  proto-bar 与「三态演示」仅为原型页间互联与状态演示，不属于 App 真实 UI。
  演示基准日 2026-10-18，数据为虚构样例；当前登录人演示为「陈默」（产品经理）。
-->
<link rel="stylesheet" href="../../../../../busyming-skills-design/mobile/styles/design-system.css" />
</head>
<body>
<div class="app-phone">
  <div class="app-phone__status"><span>09:41</span><span>5G · 100%</span></div>
  <div class="app-screen">
    <header class="ac-nav-bar">
      <span class="ac-nav-bar__side" role="button" tabindex="0" aria-label="返回工作台"><span class="ac-icon" data-icon="back"></span></span>
      <strong class="ac-nav-bar__title">需求管理</strong>
      <span class="ac-nav-bar__side"><a class="ac-link" href="requirement-submit.html">提交</a></span>
    </header>
    <div class="app-screen__content app-screen__content--flush">
      <div class="ac-tabs ac-tabs--underline" id="viewTabs">
        <button class="ac-btn ac-tab" type="button" data-view="mine">我提交的</button>
        <button class="ac-btn ac-tab" type="button" data-view="todo">待我审批<span class="ac-tab__badge">3</span></button>
        <button class="ac-btn ac-tab" type="button" data-view="done">已完成</button>
      </div>
      <div class="app-stack" id="cardHost" style="padding:var(--ac-space-3)"></div>
      <div class="ac-load-more" id="loadMore">加载更多</div>
    </div>
  </div>
</div>

<!-- 原型页间互联与三态演示（非 App 真实 UI） -->
<nav class="proto-bar">
  <b>我的需求</b> ·
  <a class="ac-link" href="requirement-detail.html">需求详情</a> ·
  <a class="ac-link" href="requirement-submit.html">需求提交</a> ·
  <a class="ac-link" href="requirement-public-submit.html">H5 提交</a> ·
  <a class="ac-link" href="requirement-public-result.html">H5 结果</a>
  ｜三态演示：
  <a class="ac-link" href="#" data-demo="normal" onclick="return false">正常</a> ·
  <a class="ac-link" href="#" data-demo="skeleton" onclick="return false">骨架</a> ·
  <a class="ac-link" href="#" data-demo="empty" onclick="return false">空态</a> ·
  <a class="ac-link" href="#" data-demo="error" onclick="return false">错误</a>
</nav>

<script src="../../../../../busyming-skills-design/mobile/styles/runtime.js"></script>
<script>
/* ==================== 基础工具 ==================== */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
function toast(text, type) {
  const layer = document.createElement('div');
  layer.className = 'ac-toast-layer';
  layer.innerHTML = `<div class="ac-toast" data-ac="AcToast" data-type="${type || 'success'}" role="status"><span class="ac-toast__text">${esc(text)}</span></div>`;
  document.body.appendChild(layer);
  setTimeout(() => layer.remove(), 2600);
}

/* ==================== 演示数据（虚构，基准日 2026-10-18） ==================== */
/* 当前登录人：陈默（产品经理）。状态药丸：草稿/待关联=pending，审批中=processing，已关联=completed，已驳回=negative。
   Tag 近似（mobile ac-tag 仅 5 色）：有点推荐=outline（洋红近似）、P2=outline（蓝近似）、业务线=primary/success/warning/outline 轮转近似。 */
const ME = '陈默';
const PILL = { DRAFT: ['pending', '草稿'], SUBMITTED: ['processing', '已提交'], BU_REVIEWING: ['processing', '业务线审批中'], IMPL_REVIEWING: ['processing', '实施确认中'], PM_REVIEWING: ['processing', '产品确认中'], PM_SUBMITTED: ['pending', '待关联排期'], LINKED: ['completed', '已关联排期'], REJECTED: ['negative', '已驳回'] };
const PRI_TAG = { P0: ['danger', 'P0 紧急'], P1: ['warning', 'P1 高'], P2: ['outline', 'P2 中'], P3: ['', 'P3 低'] };
const LINE_TAG = { 运营: 'primary', 财务: 'warning', 供应链: 'success', 数字化: 'outline' };
const ROWS = [
  { no: null, title: '门店夜间补货流程优化（草稿）', product: 'mm', line: '供应链', source: 'in', submitter: '陈默', status: 'DRAFT', priority: 'P2', time: null, view: ['mine'] },
  { no: 'REQ-20261017-004', title: '会员积分兑换页面加载优化', product: 'mm', line: '运营', source: 'in', submitter: '陈默', status: 'SUBMITTED', priority: 'P2', time: '2026-10-17 15:22', view: ['mine'] },
  { no: 'REQ-20261016-009', title: '要货审批增加批量通过', product: 'mm', line: '运营', source: 'in', submitter: '陈默', status: 'BU_REVIEWING', priority: 'P1', time: '2026-10-16 09:12', view: ['mine'] },
  { no: 'REQ-20261015-006', title: '门店报损流程线上化', product: 'mm', line: '运营', source: 'in', submitter: '陈默', status: 'IMPL_REVIEWING', priority: 'P2', time: '2026-10-15 11:05', view: ['mine'] },
  { no: 'REQ-20261014-002', title: '要货历史数据看板', product: 'mm', line: '数字化', source: 'in', submitter: '陈默', status: 'PM_SUBMITTED', priority: 'P2', time: '2026-10-14 14:47', view: ['mine'] },
  { no: 'REQ-20261013-011', title: '要货单导出增加成本列', product: 'mm', line: '财务', source: 'in', submitter: '陈默', status: 'LINKED', priority: 'P3', time: '2026-10-13 10:18', view: ['mine', 'done'] },
  { no: 'REQ-20261016-003', title: '要货单自动合并相同商品', product: 'mm', line: '运营', source: 'in', submitter: '陈默', status: 'REJECTED', priority: 'P3', time: '2026-10-16 10:41', view: ['mine', 'done'] },
  { no: 'REQ-20261016-012', title: '门店要货单支持按周转天数智能建议补货量', product: 'mm', line: '运营', source: 'in', submitter: '张三', status: 'PM_REVIEWING', priority: 'P1', time: '2026-10-16 08:30', view: ['todo'], wait: '已等待 2 天' },
  { no: 'REQ-20261017-001', title: '要货提交偶发重复扣减库存', product: 'mm', line: '供应链', source: 'in', submitter: '张三', status: 'PM_REVIEWING', priority: 'P0', time: '2026-10-17 09:14', view: ['todo'], wait: '已等待 1 天' },
  { no: 'REQ-20261016-014', title: '有点推荐小程序首页加载白屏', product: 'yd', line: null, source: 'out', submitter: '刘洋', dept: '长沙优选便利店', status: 'PM_REVIEWING', priority: 'P1', time: '2026-10-16 15:03', view: ['todo'], wait: '已等待 2 天' },
  { no: 'REQ-20261010-003', title: '要货审批超时自动提醒', product: 'mm', line: '运营', source: 'in', submitter: '张三', status: 'LINKED', priority: 'P1', time: '2026-10-10 09:26', view: ['done'] },
];
let view = 'mine';

function productTag(r) { return r.product === 'mm' ? '<span class="ac-tag ac-tag--primary">鸣鸣很忙</span>' : '<span class="ac-tag ac-tag--outline">有点推荐</span>'; }
function lineTag(r) { return r.line ? `<span class="ac-tag ac-tag--${LINE_TAG[r.line]}">${r.line}</span>` : ''; }
function priTag(r) { const p = PRI_TAG[r.priority]; return `<span class="ac-tag${p[0] ? ' ac-tag--' + p[0] : ''}">${p[1]}</span>`; }
function pill(r) {
  const p = PILL[r.status];
  const label = r.status === 'PM_SUBMITTED' && r.type === '缺陷修复' ? '待转黑灯工厂' : r.status === 'LINKED' && r.type === '缺陷修复' ? '已转黑灯工厂' : p[1];
  return `<span class="ac-status ac-status--${p[0]}">${label}</span>`;
}
function cardHtml(r) {
  const ext = r.source === 'out';
  const row1 = `<div class="tpl-doc-card__head"><span class="tpl-doc-card__no">${ext ? '<span class="ac-tag ac-tag--warning">外部提交</span> ' : ''}${esc(r.title)}</span>${pill(r)}</div>`;
  const row2 = `<div class="tpl-doc-card__body" style="display:none"></div>
    <div class="tpl-doc-card__tags">${productTag(r)}${lineTag(r)}${priTag(r)}</div>`;
  const row3 = `<div class="tpl-doc-card__foot"><span class="mono">${r.no || '未提交'}</span><span>${r.time ? esc(r.time) + ' 提交' : ''}</span></div>`;
  const extra = view === 'todo' ? `<div class="tpl-doc-card__meta"><span>${esc(r.submitter)}${ext ? ` <span class="u-muted">${esc(r.dept)}</span>` : ''}</span><span class="u-muted">${esc(r.wait || '')}</span></div>` : '';
  return `<div class="tpl-doc-card" role="button" tabindex="0" data-go="requirement-detail.html">${row1}${row2}${row3}${extra}</div>`;
}
function emptyHtml() {
  const map = {
    mine: ['你还没有提交过需求', '<a class="ac-btn ac-button ac-button--primary ac-button--sm" href="requirement-submit.html">立即提交</a>'],
    todo: ['暂无待你审批的需求', ''],
    done: ['暂无已完成的需求', ''],
  };
  const m = map[view];
  return `<div class="ac-empty" data-ac="AcEmpty"><div class="ac-empty__visual"></div><div class="ac-empty__title">${m[0]}</div><div class="ac-empty__description">${m[1]}</div></div>`;
}
function skeletonHtml() {
  return Array.from({ length: 3 }).map(() => `<div class="tpl-doc-card"><div class="ac-skeleton"><div class="ac-skeleton--line ac-skeleton--line-sm"></div><div class="ac-skeleton--line"></div><div class="ac-skeleton--line ac-skeleton--line-sm"></div></div></div>`).join('');
}
function render() {
  const host = $('#cardHost');
  const rows = ROWS.filter((r) => r.view.includes(view));
  host.innerHTML = rows.length ? rows.map(cardHtml).join('') : emptyHtml();
  $('#loadMore').textContent = rows.length ? '加载更多' : '';
  /* 待我审批角标（>99 显示 99+，为 0 不展示） */
  const badge = $('.ac-tab__badge', $('#viewTabs'));
  const n = ROWS.filter((r) => r.view.includes('todo')).length;
  if (badge) badge.textContent = n > 99 ? '99+' : String(n);
}

/* ==================== 事件 ==================== */
$('#viewTabs').addEventListener('click', (e) => {
  const tab = e.target.closest('.ac-tab');
  if (!tab) return;
  $$('#viewTabs .ac-tab').forEach((t) => t.classList.remove('is-active'));
  tab.classList.add('is-active');
  view = tab.getAttribute('data-view');
  /* 切换视角：骨架屏后刷新，页码重置为 1 */
  $('#cardHost').innerHTML = skeletonHtml();
  $('#loadMore').textContent = '';
  setTimeout(render, 300);
});
$('#cardHost').addEventListener('click', (e) => {
  const card = e.target.closest('[data-go]');
  if (card) location.href = card.getAttribute('data-go');
});
$('#loadMore').addEventListener('click', () => {
  $('#loadMore').textContent = '没有更多了';   /* 每页 20 条，到底展示 */
});
/* 三态演示（原型专用） */
document.querySelector('.proto-bar').addEventListener('click', (e) => {
  const a = e.target.closest('[data-demo]');
  if (!a) return;
  const d = a.getAttribute('data-demo');
  const host = $('#cardHost');
  if (d === 'skeleton') { host.innerHTML = skeletonHtml(); $('#loadMore').textContent = ''; }
  else if (d === 'empty') { host.innerHTML = emptyHtml(); $('#loadMore').textContent = ''; }
  else if (d === 'error') {
    host.innerHTML = `<div class="ac-empty" data-ac="AcEmpty"><div class="ac-empty__visual"></div><div class="ac-empty__title">加载失败</div><div class="ac-empty__description"><a class="ac-link" href="#" onclick="return false" data-retry>点击重试</a></div></div>`;
    $('#loadMore').textContent = '';
  } else render();
});
$('#cardHost').addEventListener('click', (e) => {
  if (e.target.closest('[data-retry]')) { render(); toast('已重新加载', 'success'); }
});

/* 初始化：默认 Tab 激活态 */
$$('#viewTabs .ac-tab').forEach((t) => t.classList.toggle('is-active', t.getAttribute('data-view') === view));
render();
</script>
</body>
</html>

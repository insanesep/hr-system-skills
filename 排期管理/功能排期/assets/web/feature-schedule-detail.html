<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>卡片详情 · 功能排期管理 · 鸣鸣很忙</title>
<!--
  功能排期 · 卡片详情页（Web 原型 · Mock 演示数据，刷新即重置）
  页面描述真源：../../references/web-ui.md#卡片详情页 ｜ 页面类型 order-detail
  整页范例：busyming-skills-design/templates/web/order-detail.html ｜ 状态机：../../references/state-machine.md
  区块：页头 J1（返回 / 编号标题 / 标签行 / 右上操作区 L1-L2）→ 业务提示 J2 → 开发进度 J3（busy-steps）
    → 关键摘要 J4（固定三项：排期 / 开发人 / 完成 commit；合并卡追加第四项「子卡 N 张」，非合并卡无第四项）
    → 任务内容 J5（独立面板，内容原文保留换行，空显示「暂无内容」）
    → 页级 Tab K1-K5（基本信息 / 子卡明细 / 完成 commit / 操作日志）
    → 弹窗 M1 编辑 / M2 调整排期（日期区间选择器，今天之前置灰）/ M3 标记完成·关联 commit / M4 回退 / M5 二次确认·气泡确认 / M6 全局提示
  直达规则：以卡片编号为路径参数（原型以 ?no= 模拟）；编号不存在或已删除 →「卡片不存在或已删除」。
  导航栏「原型页面」可切换页面、演示卡片（合并卡 / 延期卡 / 完成卡 / 子卡只读 / 非需求改动卡）与整页状态（正常 / 加载失败 / 不存在）。
  演示基准日 2026-10-21（周三）；当前登录人演示为「陈默」（PM，全权限）。
-->
<link rel="stylesheet" href="../../../../../busyming-skills-design/components/web/tokens/pc.css">
<link rel="stylesheet" href="../../../../../busyming-skills-design/docs-site/demos/pc/css/convert-el-plus.css">
<link rel="stylesheet" href="../../../../../busyming-skills-design/docs-site/ep-base-shim.css">
<link rel="stylesheet" href="../../../../../busyming-skills-design/templates/web/templates.css">
</head>
<body>
<nav class="tpl-nav">
  <span class="tpl-nav__logo">鸣鸣很忙</span>
  <span class="tpl-nav__crumb">首页 / 研发 / 研发管理 / <a href="feature-schedule.html">功能排期管理</a> / <b>卡片详情</b></span>
  <span class="tpl-nav__spacer"></span>
  <span class="tpl-nav__crumb">产品经理 · 陈默</span>
</nav>

<section class="tpl-page" id="detailPage">
  <!-- J1 页头（含 L 操作区） -->
  <div class="tpl-page-head" id="pageHead"></div>

  <!-- J2 业务提示 / J3 开发进度 / J4 关键摘要 / J5 任务内容 / K 页级 Tab：均由脚本按演示卡片渲染 -->
  <div id="pageBody"></div>
</section>

<!-- M. 弹窗（overlay host：文档流内承载，Esc 分层关闭） -->
<div class="busy-overlay-demo" id="ovEdit" hidden></div>
<div class="busy-overlay-demo" id="ovSchedule" hidden></div>
<div class="busy-overlay-demo" id="ovDone" hidden></div>
<div class="busy-overlay-demo" id="ovRevert" hidden></div>
<div class="busy-overlay-demo" id="ovMore" hidden></div>

<script src="./feature-schedule-data.js"></script>
<script>
/* ==================== 演示卡片装配（数据真源 feature-schedule-data.js） ==================== */
var D = FS_DATA, P = FS_PROTO;
function byNo(no) { return D.scheduled.filter(function (c) { return c.no === no; })[0]; }
var CARDS = {
  merge: byNo('FS-20261018-001'),
  delayed: byNo('FS-20261010-001'),
  done: byNo('FS-20261009-002'),
  child: {
    no: 'FS-20261015-005', title: '要货数量输入框失焦抖动', module: 'STORE', project: 'main',
    status: 'IN_PROGRESS', start: '2026-10-22', end: '2026-10-23', developer: '李强', takenAt: '2026-10-19 09:15',
    submitter: '周洁', nature: '业务功能', bizContact: '', created: '2026-10-15 11:32',
    child: true, parent: 'FS-20261018-001'
  },
  nonfeature: {
    no: 'FS-20261016-003', title: '修正 README 排版', module: 'MISC', project: 'none',
    status: 'NON_FEATURE', submitter: '王倩', nature: '技术支持', bizContact: '', created: '2026-10-16 09:40',
    content: 'docs: 修正 README 排版\n\n- 统一标题层级\n- 补齐目录链接'
  }
};
CARDS.merge.content = '合并自 3 张子卡：\n- FS-20261015-005 要货数量输入框失焦抖动\n- FS-20261016-004 要货单列表分页闪烁\n- FS-20261017-002 要货单打印缺少门店编码';
CARDS.delayed.bizContact = '张敏';

var cur = { cardKey: 'merge', pageState: 'normal', tab: 'base', logType: '全部操作类型', logKw: '' };

/* URL 直达：?no= 命中演示卡片，未命中 → 卡片不存在或已删除 */
(function () {
  var m = /[?&]no=([^&]+)/.exec(location.search);
  if (m) {
    var no = decodeURIComponent(m[1]);
    var hit = Object.keys(CARDS).filter(function (k) { return CARDS[k].no === no; })[0];
    if (hit) cur.cardKey = hit; else cur.pageState = 'notFound';
  }
})();

var $ = function (id) { return document.getElementById(id); };
function card() { return CARDS[cur.cardKey]; }
function isDelayed(c) { return P.statusMeta(c).label === '延期'; }
function delayDays(c) { return Math.round((parseD(D.today) - parseD(c.end)) / 86400000); }
function parseD(s) { return new Date(s + 'T00:00:00'); }
function statusTag(c) {
  var m = P.statusMeta(c);
  var cls = { '待开发': 'busy-tag--info is-plain', '开发中': '', '开发完成': 'busy-tag--success', '延期': 'busy-tag--warning', '非需求改动': 'busy-tag--info' }[m.label];
  return '<span class="busy-tag ' + cls + '">' + m.label + '</span>';
}
function bizContactText(c) {
  if (c.nature === '技术支持' || c.status === 'NON_FEATURE') return '—';
  if (c.bizContact) return c.bizContact;
  if (c.linkedReq) return '未填写，以需求单提交人 ' + c.reqSubmitter + ' 兜底';
  return '未填写';
}

/* ==================== 整页渲染 ==================== */
function render() {
  if (cur.pageState === 'loadError') {
    $('pageHead').innerHTML = '';
    $('pageBody').innerHTML =
      '<div class="tpl-panel"><div class="busy-result"><div class="busy-result__icon is-error">✕</div>' +
      '<div class="busy-result__title">卡片详情加载失败</div>' +
      '<div class="busy-result__subtitle">请检查网络后重试</div>' +
      '<button class="busy-button busy-button--primary" type="button" id="btnReload"><span>重新加载</span></button></div></div>';
    $('btnReload').onclick = function () { cur.pageState = 'normal'; render(); P.toast('已重新加载', 'success'); };
    return;
  }
  if (cur.pageState === 'notFound') {
    $('pageHead').innerHTML = '';
    $('pageBody').innerHTML =
      '<div class="tpl-panel"><div class="busy-result"><div class="busy-result__icon is-info">?</div>' +
      '<div class="busy-result__title">卡片不存在或已删除</div>' +
      '<div class="busy-result__subtitle">编号不存在、卡片已删除或合并卡已解散</div>' +
      '<a href="feature-schedule.html"><button class="busy-button busy-button--primary" type="button"><span>返回研发排期工作台</span></button></a></div></div>';
    return;
  }
  renderHead();
  renderBody();
}

/* ---------- J1 页头 + L 操作区 ---------- */
function headHint(c) {
  if (c.child) return '子卡只读：状态、排期与开发人由合并卡控制';
  if (c.status === 'NON_FEATURE') return '恢复后回到待排期池';
  var base = { PENDING: '领取后进入开发中并记录开发人', IN_PROGRESS: '标记完成时可选关联完成 commit', DONE: '已锁定排期，回退将清空完成 commit 回执' }[c.status] || '';
  if (c.merged) base += '；状态与编辑同步扩散至 ' + c.childCount + ' 张子卡';
  return base;
}
function renderHead() {
  var c = card();
  var tags = [statusTag(c)];
  if (c.merged) tags.push('<span class="busy-tag is-plain">合并卡 · ' + c.childCount + ' 项</span>');
  if (c.child) tags.push('<span class="busy-tag busy-tag--info is-plain">子卡</span>');
  tags.push(P.projectTag(c.project));
  tags.push('<span class="busy-tag busy-tag--info is-plain">' + c.module + '</span>');
  if (c.nature === '技术支持') tags.push('<span class="busy-tag busy-tag--info is-plain">技术支持</span>');

  var actions = [];
  actions.push('<button class="busy-button is-link" type="button" id="actCopy"><span>复制编号</span></button>');
  if (c.child) {
    actions.push('<button class="busy-button busy-button--primary" type="button" id="actParent"><span>查看合并卡</span></button>');
  } else {
    actions.push('<button class="busy-button" type="button" id="actMore"><span>更多操作 ▾</span></button>');
    actions.push('<button class="busy-button busy-button--danger is-plain" type="button" id="actDelete"><span>删除</span></button>');
    if (c.status === 'PENDING') {
      actions.push('<button class="busy-button" type="button" id="actDone"><span>标记完成</span></button>');
      actions.push('<button class="busy-button busy-button--primary" type="button" id="actTake"><span>领取开发</span></button>');
    } else if (c.status === 'IN_PROGRESS') {
      actions.push('<button class="busy-button" type="button" id="actUntake"><span>取消领取</span></button>');
      actions.push('<button class="busy-button busy-button--primary" type="button" id="actDone"><span>标记完成</span></button>');
    } else if (c.status === 'DONE') {
      actions.push('<button class="busy-button busy-button--warning" type="button" id="actRevert"><span>回退</span></button>');
    } else if (c.status === 'NON_FEATURE') {
      actions.push('<button class="busy-button busy-button--primary" type="button" id="actRestore"><span>恢复为待开发</span></button>');
    }
  }
  $('pageHead').innerHTML =
    '<div class="tpl-page-head__main">' +
      '<a class="tpl-page-head__back" href="feature-schedule.html">‹ 返回功能排期管理</a>' +
      '<h1 class="tpl-page-title"><span class="u-mono">' + c.no + '</span> ' + c.title + '</h1>' +
      '<div class="tpl-page-head__tags">' + tags.join('') + '</div>' +
    '</div>' +
    '<div class="tpl-page-head__actions" id="headActions">' +
      '<span class="u-sub">' + headHint(c) + '</span>' + actions.join('') +
    '</div>';
  $('actCopy').onclick = function () {
    var done = function () { P.toast('卡片编号 ' + c.no + ' 已复制', 'success'); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(c.no).then(done, function () { P.toast('复制失败，请手动复制', 'error'); });
    else done();
  };
  var b;
  if ((b = $('actParent'))) b.onclick = function () { cur.cardKey = 'merge'; cur.tab = 'children'; render(); };
  if ((b = $('actMore'))) b.onclick = openMore;
  if ((b = $('actDelete'))) b.onclick = function () {
    P.confirmBox({
      title: '删除卡片',
      message: '删除后该卡片不可恢复（源 commit 不会再次触发生成）。确认删除 ' + c.no + '？',
      onOk: function () { P.toast('卡片 ' + c.no + ' 已删除', 'success'); location.href = 'feature-schedule.html'; }
    });
  };
  if ((b = $('actTake'))) b.onclick = function () {
    P.btnLoading(b, function () {
      c.status = 'IN_PROGRESS'; c.developer = D.user; c.takenAt = D.today + ' 10:00';
      D.logs.unshift({ time: D.today + ' 10:00', type: '领取开发', op: D.user, desc: '领取开发：' + D.user + (c.merged ? '（扩散至 ' + c.childCount + ' 张子卡）' : '') });
      P.toast('已领取开发', 'success'); render();
    });
  };
  if ((b = $('actUntake'))) b.onclick = function () {
    P.btnLoading(b, function () {
      var dev = c.developer;
      c.status = 'PENDING'; delete c.developer; delete c.takenAt;
      D.logs.unshift({ time: D.today + ' 10:05', type: '释放开发', op: D.user, desc: '释放开发：' + dev });
      P.toast('已释放开发', 'success'); render();
    });
  };
  if ((b = $('actDone'))) b.onclick = function () { openDone('mark'); };
  if ((b = $('actRevert'))) b.onclick = openRevert;
  if ((b = $('actRestore'))) b.onclick = function () {
    P.btnLoading(b, function () {
      c.status = 'PENDING';
      D.logs.unshift({ time: D.today + ' 10:06', type: '编辑', op: D.user, desc: '从非需求改动恢复为待开发' });
      P.toast('已恢复为待开发，卡片回到待排期池', 'success'); render();
    });
  };
}

/* ---------- J2 业务提示 + J3 开发进度 + J4 关键摘要 + J5 任务内容 ---------- */
function renderBody() {
  var c = card();
  var h = '';

  /* J2 业务提示 */
  if (c.child) {
    h += '<div class="tpl-panel"><span class="busy-message busy-message--info">当前隶属合并卡 ' + c.parent +
      '，状态、排期与开发人由合并卡控制，本页只读。<a href="javascript:void 0" id="lnkParent">查看合并卡</a></span></div>';
  } else if (c.status === 'NON_FEATURE') {
    h += '<div class="tpl-panel"><span class="busy-message busy-message--info">非需求改动：不进入待排期池与月历，不参与排期、领取与完成。</span></div>';
  } else if (isDelayed(c)) {
    h += '<div class="tpl-panel"><span class="busy-message busy-message--warning">已延期：排期截止 ' + c.end +
      '，当前仍为「' + (c.status === 'PENDING' ? '待开发' : '开发中') + '」，已超出 ' + delayDays(c) + ' 天</span></div>';
  }

  /* J3 开发进度（非需求改动卡不渲染） */
  if (c.status !== 'NON_FEATURE') {
    var step = c.status === 'PENDING' ? 0 : c.status === 'IN_PROGRESS' ? 1 : 2;
    var steps = ['待开发', '开发中', '开发完成'].map(function (t, i) {
      var cls = i < step ? 'is-finish' : i === step ? 'is-process' : '';
      var desc = '';
      if (i === 0 && c.status !== 'PENDING') desc = '已领取 ' + (c.takenAt || '');
      if (i === 0 && c.status === 'PENDING') desc = '当前阶段';
      if (i === 1 && c.status === 'IN_PROGRESS') desc = '当前阶段 · ' + c.developer + ' ' + (c.takenAt || '') + (isDelayed(c) ? ' · 已延期 ' + delayDays(c) + ' 天' : '');
      if (i === 1 && c.status === 'DONE') desc = c.developer + ' ' + (c.takenAt || '');
      if (i === 2 && c.status === 'DONE') desc = '完成于 ' + (c.doneAt || '');
      if (i === 2 && c.status !== 'DONE') desc = '待开始';
      if (c.child) desc += (desc ? ' · ' : '') + '随合并卡流转';
      return '<div class="busy-step ' + cls + '"><span class="busy-step__icon">' + (i < step ? '✓' : i + 1) + '</span>' +
        '<div><div class="busy-step__title">' + t + '</div><div class="busy-step__desc">' + desc + '</div></div>' +
        (i < 2 ? '<span class="busy-step__line"></span>' : '') + '</div>';
    }).join('');
    h += '<div class="tpl-panel"><div class="busy-steps">' + steps + '</div></div>';
  }

  /* J4 关键摘要 */
  var scheduleVal, scheduleFoot = '';
  if (!c.start) { scheduleVal = '—'; scheduleFoot = '<span class="tpl-kpi__foot-text">未排期，卡片在待排期池</span>'; }
  else {
    scheduleVal = P.mmdd(c.start) + ' ~ ' + P.mmdd(c.end);
    scheduleFoot = '<span class="tpl-kpi__foot-text">共 ' + P.daysBetween(c.start, c.end) + ' 天</span>' +
      (isDelayed(c) ? '<span class="tpl-kpi__foot-text u-warning">已延期 ' + delayDays(c) + ' 天</span>' : '');
  }
  var commitN = c.no === 'FS-20261009-002' ? D.doneCommits.length : (c.commits || 0);
  /* J4：固定三项（排期 / 开发人 / 完成 commit）；合并卡追加第四项「子卡 N 张」，非合并卡无第四项（所属项目在基本信息分组展示） */
  h += '<div class="tpl-kpi-grid">' +
    '<div class="tpl-kpi"><div class="tpl-kpi__head"><span class="tpl-kpi__dot is-primary"></span><span class="tpl-kpi__label">排期</span></div>' +
      '<div class="tpl-kpi__number"><span class="tpl-kpi__value u-mono">' + scheduleVal + '</span></div><div class="tpl-kpi__foot">' + scheduleFoot + '</div></div>' +
    '<div class="tpl-kpi"><div class="tpl-kpi__head"><span class="tpl-kpi__dot is-primary"></span><span class="tpl-kpi__label">开发人</span></div>' +
      '<div class="tpl-kpi__number"><span class="tpl-kpi__value">' + (c.developer || '待领取') + '</span></div>' +
      '<div class="tpl-kpi__foot"><span class="tpl-kpi__foot-text">' + (c.takenAt ? '领取于 ' + c.takenAt : '') + '</span></div></div>' +
    '<div class="tpl-kpi"><div class="tpl-kpi__head"><span class="tpl-kpi__dot is-success"></span><span class="tpl-kpi__label">完成 commit</span></div>' +
      '<div class="tpl-kpi__number"><span class="tpl-kpi__value">' + commitN + '</span><span class="tpl-kpi__unit">个</span></div>' +
      '<div class="tpl-kpi__foot"><span class="tpl-kpi__foot-text">' + (c.doneAt ? '完成于 ' + c.doneAt : '') + '</span></div></div>' +
    (c.merged
      ? '<div class="tpl-kpi"><div class="tpl-kpi__head"><span class="tpl-kpi__dot is-info"></span><span class="tpl-kpi__label">子卡</span></div>' +
        '<div class="tpl-kpi__number"><span class="tpl-kpi__value">' + c.childCount + '</span><span class="tpl-kpi__unit">张</span></div>' +
        '<div class="tpl-kpi__foot"><span class="tpl-kpi__foot-text"></span></div></div>'
      : '') +
    '</div>';

  /* J5 任务内容（独立面板，位于关键摘要与页级 Tab 之间；内容原文保留换行，空显示「暂无内容」） */
  h += '<div class="tpl-panel"><div class="tpl-section">' +
    '<div class="tpl-section__head">任务内容</div>' +
    (c.content ? '<div>' + c.content.replace(/\n/g, '<br>') + '</div>' : '<div class="u-sub">暂无内容</div>') +
    '</div></div>';

  /* K 页级 Tab */
  h += '<div class="tpl-panel"><div id="tabHost"></div></div>';
  $('pageBody').innerHTML = h;

  var lp = document.getElementById('lnkParent');
  if (lp) lp.onclick = function () { cur.cardKey = 'merge'; cur.tab = 'base'; render(); };
  renderTabs();
}

/* ---------- K 页级 Tab ---------- */
function tabList() {
  var c = card();
  var tabs = [{ key: 'base', label: '基本信息' }];
  if (c.merged) tabs.push({ key: 'children', label: '子卡明细', badge: c.childCount });
  if (c.status !== 'NON_FEATURE') {
    var commitN = c.no === 'FS-20261009-002' ? D.doneCommits.length : (c.commits || 0);
    tabs.push({ key: 'commits', label: '完成 commit', badge: commitN });
  }
  tabs.push({ key: 'logs', label: '操作日志', badge: D.logs.length });
  return tabs;
}
function renderTabs() {
  var c = card();
  var tabs = tabList();
  if (!tabs.filter(function (t) { return t.key === cur.tab; })[0]) cur.tab = 'base';
  var h = '<div class="busy-tabs">' + tabs.map(function (t) {
    return '<span class="busy-tabs__item' + (t.key === cur.tab ? ' is-active' : '') + '" data-tab="' + t.key + '">' + t.label +
      (t.badge ? ' <span class="busy-badge"><span class="busy-badge__content">' + t.badge + '</span></span>' : '') + '</span>';
  }).join('') + '</div>';
  if (cur.tab === 'base') h += tabBase(c);
  if (cur.tab === 'children') h += tabChildren(c);
  if (cur.tab === 'commits') h += tabCommits(c);
  if (cur.tab === 'logs') h += tabLogs(c);
  $('tabHost').innerHTML = h;
  $('tabHost').querySelectorAll('[data-tab]').forEach(function (t) {
    t.addEventListener('click', function () { cur.tab = t.getAttribute('data-tab'); renderTabs(); });
  });
  bindTabEvents(c);
}

/* K1 基本信息 */
function tabBase(c) {
  var repo = c.merged ? '合并卡（无源仓）' : (P.projectOf(c.project).harness || '—');
  var commit = c.merged ? 'MERGE-' + c.no : 'a1b2c3d';
  var h = '<div class="tpl-section">' +
    '<div class="tpl-toolbar"><div class="tpl-toolbar__left"><div class="tpl-section__head">卡片信息</div></div>' +
    '<div class="tpl-toolbar__right">' + (c.child ? '' : '<button class="busy-button busy-button--small" type="button" id="btnEdit"><span>编辑</span></button>') + '</div></div>' +
    '<table class="busy-descriptions is-border">' +
      '<tr><th>卡片编号</th><td class="u-mono">' + c.no + '</td><th>标题</th><td>' + c.title + '</td></tr>' +

/* ==================== M2 调整排期弹窗（日期区间选择器：今天之前置灰，单日排期起止选同一天） ==================== */
var schedSel = { start: '', end: '' };
function openSchedule() {
  var c = card();
  /* 初态：现有排期不早于今天时预选，已延期或未排期不预选 */
  var preselect = c.start && c.end >= D.today;
  schedSel = { start: preselect ? c.start : '', end: preselect ? c.end : '', picking: 'start' };
  renderSchedule();
  P.openOverlay('ovSchedule');
}
function renderSchedule() {
  var c = card();
  var y = 2026, m = 9;
  var first = new Date(y, m, 1), startIdx = (first.getDay() + 6) % 7, daysIn = new Date(y, m + 1, 0).getDate();
  var cells = '', row = '', d = new Date(y, m, 1 - startIdx);
  for (var i = 0; i < 35; i++) {
    var ds = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    var inMonth = d.getMonth() === m;
    var past = ds < D.today;
    var selected = schedSel.start && schedSel.end && ds >= schedSel.start && ds <= schedSel.end;
    var isEnd = ds === schedSel.start || (schedSel.end && ds === schedSel.end);
    var cls = past || !inMonth ? 'u-muted' : selected ? 'u-primary' : '';
    row += '<td class="u-center" data-d="' + ds + '"' + ((past || !inMonth) ? ' data-dis="1"' : '') + '>' +
      (isEnd && !past && inMonth ? '<span class="busy-tag busy-tag--small">' + d.getDate() + '</span>' : '<span class="' + cls + '">' + d.getDate() + '</span>') + '</td>';
    if (i % 7 === 6) { cells += '<tr>' + row + '</tr>'; row = ''; }
    d.setDate(d.getDate() + 1);
  }
  var rangeText = schedSel.start
    ? (schedSel.end ? schedSel.start + ' ~ ' + schedSel.end + ' · 共 ' + P.daysBetween(schedSel.start, schedSel.end) + ' 天' : schedSel.start + ' ~ 点选结束日期（单日排期再点一次 ' + schedSel.start + '）')
    : '请点选开始日期';
  $('ovSchedule').innerHTML =
    '<div class="busy-dialog">' +
      '<div class="busy-dialog__header"><span class="busy-dialog__title">调整排期</span>' +
      '<button class="busy-dialog__close" type="button" data-x="close">✕</button></div>' +
      '<div class="busy-dialog__body"><div class="tpl-section">' +
        '<div class="u-sub">' + (c.start ? '当前排期：' + c.start + ' ~ ' + c.end + (isDelayed(c) ? '（已延期）' : '') : '当前未排期，卡片在待排期池') + '</div>' +
        '<div class="u-sub">开始日期不早于今天；单日排期起止选同一天（原型仅演示 2026-10 月历面板，生产可切月）</div>' +
        '<table class="busy-table busy-table--border"><thead><tr><th class="u-center">一</th><th class="u-center">二</th><th class="u-center">三</th><th class="u-center">四</th><th class="u-center">五</th><th class="u-center">六</th><th class="u-center">日</th></tr></thead>' +
        '<tbody>' + cells + '</tbody></table>' +
        '<div>已选区间：<b class="u-mono">' + rangeText + '</b></div>' +
        '<div class="busy-form-item__error" id="schedErr" hidden></div>' +
      '</div></div>' +
      '<div class="busy-dialog__footer">' +
        '<button class="busy-button" type="button" data-x="cancel"><span>取 消</span></button>' +
        '<button class="busy-button busy-button--primary" type="button" data-x="save"><span>保存排期</span></button>' +
      '</div>' +
    '</div>';
  $('ovSchedule').querySelectorAll('td[data-d]').forEach(function (td) {
    td.addEventListener('click', function () {
      if (td.getAttribute('data-dis')) { $('schedErr').textContent = '不可将卡片改期到今天之前'; $('schedErr').hidden = false; return; }
      $('schedErr').hidden = true;
      var ds = td.getAttribute('data-d');
      if (!schedSel.start || (schedSel.start && schedSel.end)) { schedSel.start = ds; schedSel.end = ''; }
      else if (ds < schedSel.start) { $('schedErr').textContent = '结束日期不能早于开始日期'; $('schedErr').hidden = false; return; }
      else schedSel.end = ds; /* 单日排期：开始日再点一次即起止同日 */
      renderSchedule();
    });
  });
  $('ovSchedule').querySelector('[data-x="close"]').onclick = function () { P.closeOverlay('ovSchedule'); };
  $('ovSchedule').querySelector('[data-x="cancel"]').onclick = function () { P.closeOverlay('ovSchedule'); };
  $('ovSchedule').querySelector('[data-x="save"]').onclick = function () {
    if (!schedSel.start) { $('schedErr').textContent = '请选择排期日期'; $('schedErr').hidden = false; return; }
    if (!schedSel.end) schedSel.end = schedSel.start; /* 单日排期只点一次 */
    if (schedSel.end < schedSel.start) { $('schedErr').textContent = '结束日期不能早于开始日期'; $('schedErr').hidden = false; return; }
    if (schedSel.start === c.start && schedSel.end === c.end) { P.toast('排期没有变化', 'info'); return; }
    var btn = this;
    P.btnLoading(btn, function () {
      var old = c.start ? c.start : '—';
      c.start = schedSel.start; c.end = schedSel.end;
      D.logs.unshift({ time: D.today + ' 10:10', type: '调整排期', op: D.user, desc: '排期：' + old + ' → ' + c.start + (c.end !== c.start ? ' ~ ' + c.end : '') + (c.merged ? '（扩散至 ' + c.childCount + ' 张子卡）' : '') });
      P.closeOverlay('ovSchedule');
      P.toast('排期已更新：' + P.mmdd(c.start) + ' ~ ' + P.mmdd(c.end), 'success');
      render();
    });
  };
}

/* ==================== M3 标记完成 / 关联完成 commit 弹窗 ==================== */
var doneSel = { repo: '', branch: 'master', picks: [] };
function openDone(mode) {
  var c = card();
  var proj = P.projectOf(c.project);
  doneSel = {
    mode: mode,
    repo: (proj.repos && proj.repos[0]) || '',
    branch: localStorage.getItem('fs_branch_' + ((proj.repos && proj.repos[0]) || '')) || 'master',
    picks: mode === 'link' ? D.doneCommits.map(function (m) { return m.hash; }) : []
  };
  renderDone();
  P.openOverlay('ovDone');
}
function renderDone() {
  var c = card(), proj = P.projectOf(c.project);
  var repos = proj.repos || [];
  var noRepo = !repos.length;
  $('ovDone').innerHTML =
    '<div class="busy-dialog">' +
      '<div class="busy-dialog__header"><span class="busy-dialog__title">' + (doneSel.mode === 'link' ? '关联完成 commit' : '标记完成') + '</span>' +
      '<button class="busy-dialog__close" type="button" data-x="close">✕</button></div>' +
      '<div class="busy-dialog__body"><div class="tpl-section">' +
        (doneSel.mode === 'mark' ? '<span class="busy-message busy-message--info">完成 commit 选填，可不关联直接完成</span>' : '') +
        '<div class="tpl-section"><div class="tpl-section__head">已选 commit（' + doneSel.picks.length + '）</div>' +
          (doneSel.picks.length ? doneSel.picks.map(function (h2) {
            var m = D.doneCandidates.filter(function (x) { return x.hash === h2; })[0] || D.doneCommits.filter(function (x) { return x.hash === h2; })[0];
            return '<div class="chip-group"><span class="u-mono">' + h2 + '</span><span>' + (m ? m.msg : '') + '</span>' +
              '<button class="busy-button is-link" type="button" data-unpick="' + h2 + '"><span>移除</span></button></div>';
          }).join('') : '<div class="u-sub">暂无</div>') +
        '</div>' +
        (noRepo ? '<span class="busy-message busy-message--warning">该项目未配置代码服务仓，可不关联直接完成</span>' :
        '<div class="busy-form-item"><div class="busy-form-item__label">代码仓</div>' +
        '<div class="busy-form-item__content"><div class="busy-select"><div class="busy-input"><input readonly id="doneRepo" value="' + doneSel.repo + '"></div><span class="busy-select__caret">▾</span></div>' +
        '<div class="busy-select-dropdown" id="doneRepoDd" hidden>' +
          repos.map(function (r) { return '<div class="busy-select-dropdown__item' + (r === doneSel.repo ? ' is-selected' : '') + '" data-r="' + r + '">' + r + '</div>'; }).join('') +
        '</div></div></div>' +
        '<div class="busy-form-item"><div class="busy-form-item__label">分支</div>' +
        '<div class="busy-form-item__content"><div class="busy-input"><input id="doneBranch" value="' + doneSel.branch + '"></div>' +
        '<div class="u-sub">候选为仓内活跃分支，默认取云效登记的默认分支；手改分支按仓在本浏览器记忆</div></div></div>' +
        '<div class="busy-form-item"><div class="busy-form-item__label">commit 搜索</div>' +
        '<div class="busy-form-item__content"><div class="busy-input"><input id="doneKw" placeholder="输入关键字检索 commit"></div></div></div>' +
        '<div class="tpl-section" id="doneList">' +
          D.doneCandidates.map(function (m) {
            var picked = doneSel.picks.indexOf(m.hash) >= 0;
            return '<div class="chip-group"><span class="u-mono">' + m.hash + '</span><span>' + m.msg + '</span>' +
              '<span class="u-sub">' + m.author + ' · ' + m.time + '</span>' +
              (picked ? '<span class="busy-tag busy-tag--small">已选</span>' : '<button class="busy-button is-link" type="button" data-pick="' + m.hash + '"><span>选择</span></button>') +
              '</div>';
          }).join('') +
        '</div>') +
      '</div></div>' +
      '<div class="busy-dialog__footer">' +
        '<button class="busy-button" type="button" data-x="cancel"><span>取 消</span></button>' +
        '<button class="busy-button busy-button--primary" type="button" data-x="ok"><span>' + (doneSel.mode === 'link' ? '保 存' : '确认完成') + '</span></button>' +
      '</div>' +
    '</div>';
  var rd = $('doneRepoDd');
  if (rd) {
    $('doneRepo').closest('.busy-select').addEventListener('click', function () { rd.hidden = !rd.hidden; });
    rd.querySelectorAll('[data-r]').forEach(function (it) {
      it.addEventListener('click', function () {
        doneSel.repo = it.getAttribute('data-r');
        doneSel.branch = localStorage.getItem('fs_branch_' + doneSel.repo) || 'master';
        renderDone();
      });
    });
    $('doneBranch').addEventListener('input', function () {
      doneSel.branch = this.value;
      localStorage.setItem('fs_branch_' + doneSel.repo, this.value); /* 本浏览器记忆 */
    });
    $('doneKw').addEventListener('input', function () {
      var kw = this.value.trim();
      $('ovDone').querySelectorAll('#doneList > div').forEach(function (row) {
        row.hidden = kw && row.textContent.indexOf(kw) < 0;
      });
    });
  }
  $('ovDone').querySelectorAll('[data-pick]').forEach(function (b) {
    b.addEventListener('click', function () {
      var h2 = b.getAttribute('data-pick');
      if (doneSel.picks.indexOf(h2) >= 0) { P.toast('该 commit 已选中', 'error'); return; }
      doneSel.picks.push(h2); renderDone();
    });
  });
  $('ovDone').querySelectorAll('[data-unpick]').forEach(function (b) {
    b.addEventListener('click', function () {
      var i = doneSel.picks.indexOf(b.getAttribute('data-unpick'));
      if (i >= 0) doneSel.picks.splice(i, 1);
      renderDone();
    });
  });
  $('ovDone').querySelector('[data-x="close"]').onclick = function () { P.closeOverlay('ovDone'); };
  $('ovDone').querySelector('[data-x="cancel"]').onclick = function () { P.closeOverlay('ovDone'); };
  $('ovDone').querySelector('[data-x="ok"]').onclick = function () {
    var btn = this;
    P.btnLoading(btn, function () {
      if (doneSel.mode === 'mark') {
        c.status = 'DONE'; c.doneAt = D.today + ' 10:12';
        if (!c.developer) { c.developer = D.user; c.takenAt = D.today + ' 10:12'; }
        D.logs.unshift({ time: D.today + ' 10:12', type: '标记完成', op: D.user, desc: '标记完成' + (doneSel.picks.length ? '，关联 ' + doneSel.picks.length + ' 个完成 commit' : '，未关联完成 commit') + (c.merged ? '（扩散至 ' + c.childCount + ' 张子卡）' : '') });
        P.closeOverlay('ovDone');
        P.toast(doneSel.picks.length ? '已标记完成，关联 ' + doneSel.picks.length + ' 个 commit' : '已标记完成', 'success');
      } else {
        var before = D.doneCommits.length;
        D.doneCommits = doneSel.picks.map(function (h2) {
          var m = D.doneCandidates.filter(function (x) { return x.hash === h2; })[0] || D.doneCommits.filter(function (x) { return x.hash === h2; })[0];
          return m;
        });
        if (before === D.doneCommits.length) { P.toast('没有需要保存的修改', 'info'); return; }
        D.logs.unshift({ time: D.today + ' 10:13', type: '编辑', op: D.user, desc: '完成 commit：' + before + ' → ' + D.doneCommits.length + ' 个' });
        P.closeOverlay('ovDone');
        P.toast('完成 commit 已更新', 'success');
      }
      render();
    });
  };
}

/* ==================== M4 回退弹窗 ==================== */
function openRevert() {
  var c = card();
  var hasDev = !!c.developer;
  $('ovRevert').innerHTML =
    '<div class="busy-dialog">' +
      '<div class="busy-dialog__header"><span class="busy-dialog__title">回退</span>' +
      '<button class="busy-dialog__close" type="button" data-x="close">✕</button></div>' +
      '<div class="busy-dialog__body"><div class="tpl-section">' +
        '<span class="busy-message busy-message--warning">回退将清空完成 commit 回执与完成时间</span>' +
        '<div class="busy-radio-group">' +
          '<label class="busy-radio' + (hasDev ? ' is-checked' : ' is-disabled') + '" data-r="IN_PROGRESS"' + (hasDev ? '' : ' data-dis="1"') + '><span class="busy-radio__inner"></span><span>回退为开发中（保留开发人' + (hasDev ? ' ' + c.developer : '') + '）</span></label>' +
          '<label class="busy-radio' + (hasDev ? '' : ' is-checked') + '" data-r="PENDING"><span class="busy-radio__inner"></span><span>回退为待开发（清空开发人）</span></label>' +
        '</div>' +
      '</div></div>' +
      '<div class="busy-dialog__footer">' +
        '<button class="busy-button" type="button" data-x="cancel"><span>取 消</span></button>' +
        '<button class="busy-button busy-button--primary" type="button" data-x="ok"><span>确认回退</span></button>' +
      '</div>' +
    '</div>';
  P.openOverlay('ovRevert');
  var target = hasDev ? 'IN_PROGRESS' : 'PENDING';
  $('ovRevert').querySelectorAll('[data-r]').forEach(function (lb) {
    lb.addEventListener('click', function () {
      if (lb.getAttribute('data-dis')) return;
      target = lb.getAttribute('data-r');
      $('ovRevert').querySelectorAll('[data-r]').forEach(function (x) { x.classList.remove('is-checked'); });
      lb.classList.add('is-checked');
    });
  });
  $('ovRevert').querySelector('[data-x="close"]').onclick = function () { P.closeOverlay('ovRevert'); };
  $('ovRevert').querySelector('[data-x="cancel"]').onclick = function () { P.closeOverlay('ovRevert'); };
  $('ovRevert').querySelector('[data-x="ok"]').onclick = function () {
    var btn = this;
    P.btnLoading(btn, function () {
      c.status = target;
      delete c.doneAt; c.commits = 0;
      if (target === 'PENDING') { delete c.developer; delete c.takenAt; }
      D.logs.unshift({ time: D.today + ' 10:14', type: '回退', op: D.user, desc: '已回退为「' + (target === 'IN_PROGRESS' ? '开发中' : '待开发') + '」' + (target === 'IN_PROGRESS' && c.developer ? '，保留开发人 ' + c.developer : '') });
      P.closeOverlay('ovRevert');
      P.toast(target === 'IN_PROGRESS' ? '已回退为开发中' : '已回退为待开发', 'success');
      render();
    });
  };
}

/* ==================== 更多操作（移入非需求改动 / 解散合并） ==================== */
function openMore() {
  var c = card();
  var dissolveDisabled = c.merged && c.status === 'DONE';
  $('ovMore').innerHTML =
    '<div class="busy-dialog">' +
      '<div class="busy-dialog__header"><span class="busy-dialog__title">更多操作</span>' +
      '<button class="busy-dialog__close" type="button" data-x="close">✕</button></div>' +
      '<div class="busy-dialog__body"><div class="tpl-section">' +
        (c.status !== 'NON_FEATURE' ? '<button class="busy-button is-text" type="button" data-x="nonfeature"><span>移入非需求改动</span></button>' : '') +
        (c.merged ? '<button class="busy-button is-text' + (dissolveDisabled ? ' is-disabled' : '') + '" type="button" data-x="dissolve"' + (dissolveDisabled ? ' disabled' : '') + '><span>解散合并' + (dissolveDisabled ? '（开发完成的合并卡需先回退）' : '') + '</span></button>' : '') +
      '</div></div>' +
    '</div>';
  P.openOverlay('ovMore');
  $('ovMore').querySelector('[data-x="close"]').onclick = function () { P.closeOverlay('ovMore'); };
  var nf = $('ovMore').querySelector('[data-x="nonfeature"]');
  if (nf) nf.onclick = function () {
    P.closeOverlay('ovMore');
    P.confirmBox({
      title: '移入非需求改动',
      message: '移入非需求改动后将清空排期、开发人与完成 commit，不进入待排期池与月历。确认移入？',
      onOk: function () {
        var fromLabel = { PENDING: '待开发', IN_PROGRESS: '开发中', DONE: '开发完成' }[c.status] || c.status;
        c.status = 'NON_FEATURE'; delete c.start; delete c.end; delete c.developer; delete c.takenAt; delete c.doneAt; c.commits = 0;
        D.logs.unshift({ time: D.today + ' 10:15', type: '编辑', op: D.user, desc: '从『' + fromLabel + '』移入非需求改动' });
        P.toast('已移入非需求改动', 'success');
        render();
      }
    });
  };
  var ds = $('ovMore').querySelector('[data-x="dissolve"]');
  if (ds && !ds.disabled) ds.onclick = function () {
    P.closeOverlay('ovMore');
    P.confirmBox({
      title: '解散合并',
      message: '解散后子卡按合并前快照恢复独立，快照日期已过期的回到待排期池。确认解散？',
      onOk: function () {
        P.toast('已解散合并，' + c.childCount + ' 张子卡恢复独立', 'success');
        location.href = 'feature-schedule.html'; /* 成功反馈带回工作台展示 */
      }
    });
  };
}

/* ==================== 初始化：导航切换器 + 首渲染 ==================== */
P.renderNav({
  active: 'detail',
  switchers: [
    {
      label: '演示卡片', current: '合并卡（开发中）', currentKey: 'merge',
      options: [
        { key: 'merge', label: '合并卡（开发中）FS-20261018-001' },
        { key: 'delayed', label: '延期卡（开发中）FS-20261010-001' },
        { key: 'done', label: '完成卡（已锁定）FS-20261009-002' },
        { key: 'child', label: '子卡（只读）FS-20261015-005' },
        { key: 'nonfeature', label: '非需求改动卡 FS-20261016-003' }
      ],
      onPick: function (k) { cur.cardKey = k; cur.tab = 'base'; cur.pageState = 'normal'; render(); }
    },
    {
      label: '整页状态', current: '正常', currentKey: 'normal',
      options: [
        { key: 'normal', label: '正常' },
        { key: 'loadError', label: '加载失败' },
        { key: 'notFound', label: '卡片不存在或已删除' }
      ],
      onPick: function (k) { cur.pageState = k; render(); }
    }
  ]
});
render();


</script>

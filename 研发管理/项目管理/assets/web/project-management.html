<!DOCTYPE html>
<html lang="zh-CN" data-native-manual>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="connect-src 'none'; form-action 'none'">
<meta name="prototype-components" content="Button,BusyInput,PageableSelect,Checkbox,BusyTabs,Form,Searcher,ProTable,Pagination,Tag,Message,MessageBox,Dialog">
<meta name="prototype-gap-components" content="Drawer">
<title>项目管理 · 鸣鸣很忙</title>
<link rel="stylesheet" href="../../../../../busyming-skills-design/components/web/tokens/web.css">
<link rel="stylesheet" href="../../../../../busyming-skills-design/docs-site/web/runtime.css">
<link rel="stylesheet" href="../../../../../busyming-skills-design/shared/prototype/web/templates.css">
<!-- Drawer 暂无公共原生适配；只补自身容器，不覆盖公共组件。尺寸档位参照 Drawer spec xlarge。 -->
<style data-gap-component="Drawer">
.gap-drawer { position: fixed; inset: 0; z-index: 1990; background: var(--busy-overlay-color-lighter); }
.gap-drawer__panel { position: absolute; inset-block: 0; right: 0; width: 67.5rem; max-width: 100%; display: flex; flex-direction: column; background: var(--busy-bg-color); box-shadow: var(--busy-box-shadow-dark); }
.gap-drawer__header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 1.25rem; border-bottom: thin solid var(--busy-border-color-lighter); }
.gap-drawer__body { flex: 1; min-height: 0; overflow: auto; padding: 1.25rem; }
.gap-drawer__footer { display: flex; justify-content: flex-end; padding: 1.25rem; border-top: thin solid var(--busy-border-color-lighter); }
</style>
</head>
<body>
<nav class="tpl-nav" aria-label="面包屑">
  <span class="tpl-nav__logo">鸣鸣很忙</span>
  <span class="tpl-nav__crumb">首页 / 研发 / 研发管理 / <b>项目管理</b></span>
  <span class="tpl-nav__spacer"></span>
  <span class="tpl-nav__crumb">浏览器 Mock</span>
</nav>
<main class="tpl-page">
  <div class="tpl-toolbar" data-requirement="mock-controls">
    <div class="tpl-toolbar__right" aria-label="Mock 演示控制">
      <label class="busy-checkbox" id="mockWriteFail"><span class="busy-checkbox__input"><input type="checkbox" class="busy-checkbox__original" aria-label="保存失败演示"><span class="busy-checkbox__inner"></span></span><span class="busy-checkbox__label">保存失败演示</span></label>
      <button class="busy-button" type="button" id="mockNormal"><span>正常</span></button>
      <button class="busy-button" type="button" id="mockLoading"><span>加载中</span></button>
      <button class="busy-button" type="button" id="mockFailed"><span>加载失败</span></button>
      <button class="busy-button" type="button" id="mockEmpty"><span>空态</span></button>
      <button class="busy-button" type="button" id="mockPermission" aria-pressed="false"><span>切换只读</span></button>
      <button class="busy-button" type="button" id="mockReset"><span>重置 Mock</span></button>
    </div>
  </div>
  <p class="u-muted" id="pageNotice" role="status" aria-live="polite">示例项目、仓库和人员均为虚构。修改只影响浏览器 Mock；报告及排期引用同一项目来源，不授予外部操作权限。</p>
  <div class="busy-tabs" id="moduleTabs" data-requirement="module-tabs">
    <div class="busy-tabs__item is-active" data-tab="projects" aria-controls="projectList">项目列表</div>
    <div class="busy-tabs__item" data-tab="repos" id="repoTab" aria-controls="repoList">Git 仓库配置</div>
  </div>
  <div id="projectList" class="pro-table pro-table--fixed-actions is-sticky-header is-sticky-toolbar" role="tabpanel" data-requirement="project-list">
    <div class="tpl-panel pro-table__search-card">
      <div class="tpl-filter">
        <div class="busy-form-item"><div class="busy-form-item__label">项目名称</div><div class="busy-form-item__content"><div class="busy-input"><input class="busy-input__inner" id="projectKeyword" aria-label="项目名称" maxlength="12" placeholder="请输入项目名称"></div></div></div>
        <div class="busy-form-item"><div class="busy-form-item__label">项目状态</div><div class="busy-form-item__content"><div class="busy-select" id="projectStatus" data-options='[["","全部"],["ENABLED","启用"],["DISABLED","停用"]]'><div class="busy-input"><input class="busy-select__input" readonly placeholder="全部"></div></div></div></div>
        <div class="tpl-filter__actions"><button class="busy-button" type="button" id="projectReset"><span>重置</span></button><button class="busy-button busy-button--primary" type="button" id="projectQuery"><span>查询</span></button></div>
      </div>
    </div>
    <div class="pro-table__main-card">
      <div class="pro-table__toolbar-wrap"><div class="pro-table__toolbar"><div class="pro-table__toolbar-left"><button class="busy-button busy-button--primary" type="button" id="projectNew" data-requirement="create-project"><span>新建项目</span></button><span class="u-muted">人工维护 · 仓库按启用项目占用</span></div><div class="pro-table__toolbar-right"><button class="busy-button" type="button" id="projectRefresh"><span>刷新</span></button></div></div></div>
      <div class="pro-table__main-body"><div class="pro-table__table-area"><div class="pro-table__table-wrap tpl-table-wrap--sticky">
        <table class="busy-table" aria-label="项目配置列表"><thead><tr><th data-width="170">项目名称</th><th data-width="100">标识色</th><th data-width="200">harness 工程</th><th data-width="220">代码服务仓</th><th data-width="130" class="u-right">有效成员数</th><th data-width="90">状态</th><th data-width="220">备注</th><th data-width="300" class="tpl-table-sticky tpl-table-sticky--right">操作</th></tr></thead><tbody id="projectRows"></tbody></table>
      </div><div class="pro-table__pagination"><div class="pro-table__pagination-right"><div class="busy-pagination" id="projectPages"></div></div></div></div></div>
    </div>
  </div>
  <div id="repoList" class="pro-table pro-table--fixed-actions is-sticky-header is-sticky-toolbar" hidden role="tabpanel" data-requirement="git-repositories">
    <div class="pro-table__main-card">
      <div class="pro-table__toolbar-wrap"><div class="pro-table__toolbar"><div class="pro-table__toolbar-left"><button class="busy-button busy-button--primary" type="button" id="repoNew"><span>新建 Git 仓库</span></button><span class="u-muted">云效候选只读 · 此处仅维护通用 Git</span></div><div class="pro-table__toolbar-right"><button class="busy-button" type="button" id="repoRefresh"><span>刷新</span></button></div></div></div>
      <div class="pro-table__main-body"><div class="pro-table__table-area"><div class="pro-table__table-wrap tpl-table-wrap--sticky">
        <table class="busy-table" aria-label="通用 Git 仓库配置"><thead><tr><th data-width="190">名称</th><th data-width="330">仓地址</th><th data-width="120">账号</th><th data-width="130">默认分支</th><th data-width="110">凭据配置</th><th data-width="90">状态</th><th data-width="200">引用项目</th><th data-width="210" class="tpl-table-sticky tpl-table-sticky--right">操作</th></tr></thead><tbody id="repoRows"></tbody></table>
      </div><div class="pro-table__pagination"><div class="pro-table__pagination-right"><div class="busy-pagination" id="repoPages"></div></div></div></div></div>
    </div>
  </div>
</main>
<div id="memberDrawer" class="gap-drawer" data-gap-component="Drawer" hidden data-requirement="project-members">
  <section class="gap-drawer__panel" data-gap-component="Drawer" role="dialog" aria-modal="true" aria-labelledby="memberTitle" tabindex="-1">
    <header class="gap-drawer__header" data-gap-component="Drawer"><span class="tpl-section__head" id="memberTitle">成员管理</span><button class="busy-button is-link" type="button" id="memberClose"><span>关闭</span></button></header>
    <div class="gap-drawer__body" data-gap-component="Drawer">
      <div class="tpl-section"><p id="memberContext" class="u-muted"></p><p id="memberNotice" class="u-muted" role="status" aria-live="polite"></p>
        <div id="memberList" class="pro-table pro-table--embedded pro-table--fixed-actions">
          <div class="tpl-panel pro-table__search-card"><div class="tpl-filter">
            <div class="busy-form-item"><div class="busy-form-item__label">姓名/别名</div><div class="busy-form-item__content"><div class="busy-input"><input class="busy-input__inner" id="memberKeyword" placeholder="请输入姓名或别名" aria-label="姓名或别名"></div></div></div>
            <div class="busy-form-item"><div class="busy-form-item__label">角色</div><div class="busy-form-item__content"><div class="busy-select" id="memberRole" data-options='[["","全部"],["PRODUCT","产品"],["DEVELOPER","研发"],["DESIGN","UI"],["ARCHITECT","架构"]]'></div></div></div>
            <div class="busy-form-item"><div class="busy-form-item__label">人员状态</div><div class="busy-form-item__content"><div class="busy-select" id="memberStatus" data-options='[["","全部"],["ENABLED","启用"],["DISABLED","停用"]]'></div></div></div>
            <div class="busy-form-item"><div class="busy-form-item__label">关系状态</div><div class="busy-form-item__content"><div class="busy-select" id="relationStatus" data-options='[["","全部"],["ENABLED","启用"],["DISABLED","停用"]]'></div></div></div>
            <div class="tpl-filter__actions"><span class="tpl-filter__more" id="filterMore" role="button" tabindex="0" aria-expanded="false">展开</span><button class="busy-button" type="button" id="memberReset"><span>重置</span></button><button class="busy-button busy-button--primary" type="button" id="memberQuery"><span>查询</span></button></div>
          </div></div>
          <div class="pro-table__main-card"><div class="pro-table__toolbar-wrap"><div class="pro-table__toolbar"><div class="pro-table__toolbar-left"><button class="busy-button busy-button--primary" type="button" id="memberNew"><span>新增成员</span></button><button class="busy-button" type="button" id="memberLink"><span>关联已有成员</span></button></div><div class="pro-table__toolbar-right"><button class="busy-button" type="button" id="memberRefresh"><span>重新加载</span></button></div></div></div>
            <div class="pro-table__main-body"><div class="pro-table__table-area"><div class="pro-table__table-wrap"><table class="busy-table" aria-label="当前项目成员"><thead><tr><th data-width="130">姓名</th><th data-width="150">角色</th><th data-width="210">别名</th><th data-width="100">人员状态</th><th data-width="140">本项目关系状态</th><th data-width="190">其他参与项目</th><th data-width="330" class="tpl-table-sticky tpl-table-sticky--right">操作</th></tr></thead><tbody id="memberRows"></tbody></table></div><div class="pro-table__pagination"><div class="pro-table__pagination-right"><div class="busy-pagination" id="memberPages"></div></div></div></div></div>
          </div>
        </div>
      </div>
    </div>
    <footer class="gap-drawer__footer" data-gap-component="Drawer"><button class="busy-button" type="button" id="memberDone"><span>返回项目列表</span></button></footer>
  </section>
</div>
<div class="busy-overlay tpl-form-page" id="editorOverlay" hidden>
  <div class="busy-overlay-dialog">
    <section class="busy-dialog" data-size="middle" role="dialog" aria-modal="true" aria-labelledby="editorTitle">
      <header class="busy-dialog__header"><div class="dialog-header"><div class="dialog-title" id="editorTitle">编辑</div><button class="busy-button is-link busy-dialog__close" type="button" data-dialog-close aria-label="关闭编辑弹窗"><span>关闭</span></button></div></header>
      <div class="busy-dialog__body"><div class="dialog-content tpl-section"><p class="u-muted" id="editorContext"></p><div id="editorFeedback" role="status" aria-live="polite" hidden></div><form id="editorForm" class="busy-form busy-form--default busy-form--label-left tpl-section" novalidate></form></div></div>
      <footer class="busy-dialog__footer"><div class="busy-dialog__actions"><button class="busy-button" type="button" id="connectionTest" hidden><span>连接测试</span></button><button class="busy-button" type="button" id="environmentReload" hidden><span>重新加载</span></button><button class="busy-button" type="button" id="editorCancel" data-dialog-close><span>取消</span></button><button class="busy-button busy-button--primary" type="button" id="editorSave"><span>保存</span></button></div></footer>
    </section>
  </div>
</div>
<!-- 表单输入原生层由 BusyInput 公共适配补齐，不使用自造控件。 -->
<template id="textFieldTemplate"><div class="busy-form-item"><div class="busy-form-item__label"></div><div class="busy-form-item__content"><div class="busy-input"><input class="busy-input__inner"></div></div></div></template>
<script src="../../../../../busyming-skills-design/shared/prototype/web/native.js"></script>
<script src="project-management-data.js"></script>
<script>
// 公共适配在本页显式接入；业务脚本只传入数据和动作。
['projectList', 'memberList'].forEach(function (id) { BusyNative.proTableSearch(document.getElementById(id)); });
BusyNative.enhance(document);
BusyNative.inputs(document);
BusyNative.dialogs(document);
window.ProjectPublic = {
  pagination: function (container, count, paint, options) { return BusyNative.pagination(container, count, paint, options); },
  message: function (text) { return BusyNative.message(text); },
  confirm: function (text, title) { return BusyNative.confirm(text, title); }
};
</script>
<script src="project-management.js"></script>
</body>
</html>

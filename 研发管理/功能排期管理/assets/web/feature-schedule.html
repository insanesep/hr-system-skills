<!--
  功能排期 · 研发排期工作台（Web 原型 · Mock 演示数据，刷新即重置）
  页面描述真源：../../references/web-ui.md#研发排期工作台 ｜ 页面类型 order-list
  整页范例：busyming-skills-design/templates/web/order-list.html ｜ 状态机：../../references/state-machine.md ｜ 需求澄清：../../references/business-rule.md §11
  区块：指挥栏 A1–A10（池展开/时间导航/本月进度（单选快捷筛选，再点取消）/搜索/视图切换/待澄清 N（视图切换与筛选之间，N>0 警示样式）/筛选/新建/更多）
    → 待排期池 B1–B6（编号位=创建时间+相对时间标签、超 7 天警示色；服务端分页 10/20/50（总数与每页一行、页码一行，不横向溢出）、批量多选、空态）
    → 月视图 C（卡片仅落在排期截止日所在格，区间卡不逐日铺开；+N 日详情弹层按排期区间覆盖当日取卡）
    → 周视图 D（负责人=开发人→提交人→「未指定」，行按拼音排序，卡片落在本周内截止日所在列）→ 列表视图 E（当月已排期全部，无分页；行内 领取/完成/回退 + 待开发·开发中「澄清」）
    → 浮层 G1–G14（筛选抽屉、日详情、年月选择、右键菜单（含移入非需求改动、转待澄清）、合并、新建卡片、非需求改动、项目配置、二次确认、全局提示、
      待澄清列表 G13（全部/我负责的/我发起的，发起时间正序，等待超 2 天警示，完成澄清/撤回，10/20/50 分页）、澄清弹窗 G14（转待澄清/完成澄清/撤回澄清，与详情页 M7–M9 同一实现）
  演示基准日 2026-10-21（周三，演示当前时间 10:30）；当前登录人演示为「陈默」（PM，全权限）。
  样式链：tokens/pc.css → docs-site/pc/runtime.css → docs-site/ep-base-shim.css → templates/web/templates.css（不加载 native.js / interactions.js）。
  演示约定：卡片 DOM 仅用 busy-*/.tpl-*/.u-* 类，JS 定位一律 data-* 属性；
    拖拽/右键/快捷键 (←/→/T/Esc) 均已实现；浮层以 busy-overlay-demo host 承载并叠加 runtime.css 的 busy-overlay（fixed 全屏遮罩，内容可滚动），
    打开时 host 移到 body 末尾保证后开的在上层；Esc 按打开顺序逐层关闭，无浮层时退出多选态。
    待澄清列表固定 720×640（不足视口时收缩），原生布局效果保持 header/footer 与列表内部滚动；不写 style 属性或私有样式表，问题摘要以 JS 截断为 2 行。
-->

<script src="./feature-schedule-data.js"></script>
<script>
/* ==================== 状态与通用 ==================== */
var D = FS_DATA, P = FS_PROTO;
var S = {
  year: 2026, month: 9,                 /* 0-based：2026-10 */
  view: localStorage.getItem('fs_view') || 'month',
  density: localStorage.getItem('fs_density') || 'standard',
  poolCollapsed: localStorage.getItem('fs_pool') === '1',
  poolPage: 1, poolSize: 10,
  weekAnchor: D.today,                  /* 周视图锚定日期 */
  search: '',
  filters: { mine: false, status: [], owners: [], repos: [], projects: [], modules: [] },
  quickStatus: null,                    /* 指挥栏状态快捷筛选 */
  batch: false, mergeMode: false, selected: {},
  sortKey: null, sortAsc: true
};
var $ = function (id) { return document.getElementById(id); };
function iso(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function parseD(s) { return new Date(s + 'T00:00:00'); }
function repoOf(card) { var p = P.projectOf(card.project); return p.harness || 'unknown-repo'; }
function isMine(card) { return card.submitter === D.user || card.developer === D.user; }
function statusKey(card) { return P.statusMeta(card).label; } /* 待开发/开发中/开发完成/延期 */

/* 筛选 + 搜索（口径见 business-rule §5/§6；待排期池由服务端过滤，原型本地同口径模拟） */
function matchSearch(card) {
  if (!S.search) return true;
  var kws = S.search.split(/[,，\s]+/).filter(Boolean);
  var hay = (card.title + ' ' + (card.content || '') + ' ' + card.no + ' ' + card.submitter).toLowerCase();
  return kws.every(function (k) { return hay.indexOf(k.toLowerCase()) >= 0; });
}
function matchFilter(card) {
  var f = S.filters;
  if (f.mine && !isMine(card)) return false;
  /* 抽屉状态选项为 待开发/开发中/已完成/延期（「延期」为前端派生）；「已完成」映射卡片徽标「开发完成」 */
  var st = f.status.map(function (v) { return v === '已完成' ? '开发完成' : v; });
  var label = P.statusMeta(card).label;
  if (S.quickStatus === 'DELAYED') { if (label !== '延期') return false; }
  else if (S.quickStatus && label !== statusLabelOf(S.quickStatus)) return false;
  if (st.length && st.indexOf(label) < 0) return false;
  if (f.owners.length && f.owners.indexOf(card.submitter) < 0 && f.owners.indexOf(card.developer || '') < 0) return false;
  if (f.repos.length && f.repos.indexOf(repoOf(card)) < 0) return false;
  if (f.projects.length) {
    var pname = P.projectOf(card.project).name;
    if (f.projects.indexOf(pname) < 0) return false;
  }
  if (f.modules.length && f.modules.indexOf(card.module) < 0) return false;
  return true;
}
function statusLabelOf(key) { return { PENDING: '待开发', IN_PROGRESS: '开发中', DONE: '开发完成', DELAYED: '延期' }[key]; }
function visibleScheduled() { return D.scheduled.filter(function (c) { return matchFilter(c); }); }
function visiblePool() {
  var all = D.pool.items.concat(D.pool.page2, D.pool.page3);
  return all.filter(function (c) { return matchFilter(c) && matchSearch(c); });
}
function filterCount() {
  var f = S.filters, n = 0;
  if (f.mine) n++;
  if (f.status.length) n++;
  if (f.owners.length) n++;
  if (f.repos.length && f.repos.length < D.filterOptions.repos.length) n++;
  if (f.projects.length && f.projects.length < D.filterOptions.projects.length) n++;
  if (f.modules.length) n++;
  return n;
}
function anyFilterActive() { return filterCount() > 0 || !!S.quickStatus || !!S.search; }

/* 卡片 DOM（各视图通用；density=compact 时单行） */
function cardHtml(card, mode) {
  var hit = !S.search || matchSearch(card);
  var title = card.title;
  if (S.search && hit) {
    var kws = S.search.split(/[,，\s]+/).filter(Boolean);
    kws.forEach(function (k) { title = title.split(k).join('<b class="u-primary">' + k + '</b>'); });
  }
  var mergeTag = card.merged ? '<span class="busy-tag busy-tag--small is-plain">⊕ 合并 · ' + card.childCount + ' 项</span>' : '';
  var lockTag = card.status === 'DONE' ? '<span class="busy-tag busy-tag--small busy-tag--info">锁定</span>' : '';
  var dimCls = (S.search && !hit) ? ' u-muted' : '';
  var checkbox = (S.batch || S.mergeMode) ? '<label class="busy-checkbox' + (S.selected[card.no] ? ' is-checked' : '') + (S.mergeMode && !mergeable(card) ? ' is-disabled' : '') + '"><span class="busy-checkbox__inner"></span></label> ' : '';
  if (mode === 'compact') {
    return '<div data-card="' + card.no + '"' + dragAttr(card) + '>' + checkbox +
      '<span class="chip-group' + dimCls + '">' + P.statusCell(card) + P.projectTag(card.project, true) +
      '<span>' + (card.title.length > 10 ? card.title.slice(0, 10) + '…' : card.title) + '</span>' +
      '<span class="u-sub">' + card.submitter + '</span>' + mergeTag + lockTag + '</span></div>';
  }
  var line3 = card.no + ' · ' + (card.submitter || '—') + (card.developer ? ' → ' + card.developer : '');
  if (mode === 'pool') {
    /* B2：池卡片不显示编号，编号位 = 创建时间 YYYY-MM-DD HH:mm · 相对时间标签（超过 7 天未排期为警示样式） */
    line3 = card.created + ' · <span class="busy-tag busy-tag--small' + (card.stale ? ' busy-tag--warning' : ' is-plain') + '">' + card.ago + '</span> · ' + card.submitter;
  }
  return '<div data-card="' + card.no + '"' + dragAttr(card) + '>' + checkbox +
    '<div class="' + (dimCls ? 'u-muted' : '') + '"><b>' + title + '</b> ' + mergeTag + lockTag + '</div>' +
    '<div class="chip-group">' + P.statusCell(card) + P.projectTag(card.project, true) +
    '<span class="busy-tag busy-tag--small busy-tag--info is-plain">' + card.module + '</span></div>' +
    '<div class="u-sub u-mono">' + line3 + '</div></div>';
}
/* F6：锁定卡（开发完成/非需求改动/子卡）不可拖拽；原型保留 draggable，在 dragstart 统一拦截并 toast */
function dragAttr(card) {
  return card ? ' draggable="true"' : '';
}
function mergeable(card) { return card.status === 'PENDING' || card.status === 'IN_PROGRESS'; }

/* ==================== 渲染：指挥栏统计 ==================== */
function statScope(card) {
  /* business-rule §4：仅只看自己与项目筛选影响统计；状态/负责人/仓/模块/搜索不改变统计 */
  var f = S.filters;
  if (f.mine && !isMine(card)) return false;
  if (f.projects.length && f.projects.indexOf(P.projectOf(card.project).name) < 0) return false;
  return true;
}
function renderStats() {
  var prefix = S.year + '-' + String(S.month + 1).padStart(2, '0');
  var inMonth = D.scheduled.filter(function (c) { return statScope(c) && c.start && c.start.slice(0, 7) === prefix; });
  var cnt = { PENDING: 0, IN_PROGRESS: 0, DONE: 0, DELAYED: 0 };
  inMonth.forEach(function (c) {
    var m = P.statusMeta(c);
    if (m.label === '延期') cnt.DELAYED++; else cnt[c.status]++;
  });
  $('statWrap').querySelector('b').textContent = statPoolTotal();
  var statLabel = { PENDING: '待开发', IN_PROGRESS: '开发中', DONE: '已完成', DELAYED: '延期' };
  document.querySelectorAll('#statWrap [data-stat]').forEach(function (b) {
    var k = b.getAttribute('data-stat');
    b.querySelector('span').textContent = statLabel[k] + ' ' + cnt[k];
    if (S.quickStatus === k) { b.classList.remove('is-plain'); } else { b.classList.add('is-plain'); }
  });
  var fc = $('filterCount'), n = filterCount();
  fc.hidden = n === 0; fc.textContent = n;
  $('btnPoolOpen').querySelector('span').textContent = '待排期 ' + visiblePoolTotal() + ' ▶';
  renderClarifyEntry();
}
/* A10：待澄清全量计数（business-rule §4：不含子卡，不随视图月份、筛选、搜索与只看自己变化）；N>0 为警示样式 */
function renderClarifyEntry() {
  var b = $('btnClarify'), n = D.clarifying.total;
  b.querySelector('span').textContent = '待澄清 ' + n;
  b.classList.toggle('busy-button--warning', n > 0);
  b.classList.toggle('is-plain', n > 0);
}
function statPoolTotal() {
  var all = D.pool.items.concat(D.pool.page2, D.pool.page3);
  var n = all.filter(statScope).length;
  /* 池内全量总数与页码无关；无筛选时取全量 total 演示 */
  return (S.filters.mine || S.filters.projects.length) ? n : D.pool.total;
}
function visiblePoolTotal() {
  /* 待排期统计取池内全量总数（不随页码变化）；筛选/搜索变化时由服务端返回命中总数，此处按可见数模拟 */
  return anyFilterActive() ? visiblePool().length : D.pool.total;
}

/* ==================== 渲染：待排期池 B ==================== */
function poolPageItems() {
  var all = anyFilterActive() ? visiblePool() : D.pool.items.concat(D.pool.page2, D.pool.page3);
  var from = (S.poolPage - 1) * S.poolSize;
  return all.slice(from, from + S.poolSize);
}
function renderPool() {
  $('poolPanel').querySelector('#poolBody').hidden = S.poolCollapsed;
  $('poolCollapsedTip').hidden = !S.poolCollapsed;
  $('poolOpenEntry').hidden = !S.poolCollapsed;
  $('btnPoolCollapse').querySelector('span').textContent = S.poolCollapsed ? '已收起' : '收起';
  if (S.poolCollapsed) return;
  $('poolTotal').textContent = visiblePoolTotal();
  $('btnBatch').querySelector('span').textContent = S.batch ? '退出批量' : '批量';

  var items = poolPageItems();
  var list = $('poolList');
  if (!items.length) {
    list.innerHTML = S.filters.mine
      ? '<div class="busy-empty"><div class="busy-empty__image">▦</div>没有由你提交的卡片<div class="u-sub">关闭「只看自己」可查看全部</div></div>'
      : '<div class="busy-empty"><div class="busy-empty__image">▦</div>待排期池已清空</div>';
  } else {
    list.innerHTML = '';
    items.forEach(function (c) {
      var box = document.createElement('div');
      box.innerHTML = cardHtml(c, 'pool') + '<hr class="tpl-divider">';
      list.appendChild(box);
    });
  }
  renderPoolPager(items.length);
  bindCards(list);
}
function renderPoolPager(pageLen) {
  var total = visiblePoolTotal();
  var pages = Math.max(1, Math.ceil(total / S.poolSize));
  /* B3：池宽不足时分页条换行——第 1 行总数与每页条数，第 2 行上一页 / 页码 / 下一页（页码多时折叠省略号）；只有 1 页时只保留第 1 行 */
  var h = '<div class="tpl-section"><div class="busy-pagination"><span class="u-muted">共 ' + total + ' 张</span><span class="u-muted">每页</span>';
  [10, 20, 50].forEach(function (n) {
    h += '<button type="button" data-size="' + n + '"' + (n === S.poolSize ? ' class="is-active"' : '') + '>' + n + '</button>';
  });
  h += '</div>';
  if (pages > 1) {
    h += '<div class="busy-pagination"><button type="button" data-pg="prev"' + (S.poolPage <= 1 ? ' disabled' : '') + '>‹</button>';
    pageList(S.poolPage, pages).forEach(function (p) {
      h += p === '…' ? '<span class="u-muted">…</span>' : '<button type="button" data-pg="' + p + '"' + (p === S.poolPage ? ' class="is-active"' : '') + '>' + p + '</button>';
    });
    h += '<button type="button" data-pg="next"' + (S.poolPage >= pages ? ' disabled' : '') + '>›</button></div>';
  }
  h += '</div>';
  $('poolPager').innerHTML = h;
  $('poolPager').querySelectorAll('button').forEach(function (b) {
    b.addEventListener('click', function () {
      if (b.dataset.pg === 'prev' && S.poolPage > 1) S.poolPage--;
      else if (b.dataset.pg === 'next' && S.poolPage < pages) S.poolPage++;
      else if (b.dataset.pg && b.dataset.pg !== 'prev' && b.dataset.pg !== 'next') S.poolPage = +b.dataset.pg;
      else if (b.dataset.size) { S.poolSize = +b.dataset.size; S.poolPage = 1; }
      renderPool(); /* 切换页码保留勾选（business-rule §7 跨页多选） */
    });
  });
}
/* 页码折叠：总页数 ≤5 全部展示，否则保留首尾与当前页前后各 1 页，其余折叠为「…」 */
function pageList(cur, pages) {
  if (pages <= 5) return Array.from({ length: pages }, function (_, i) { return i + 1; });
  var out = [1];
  if (cur > 3) out.push('…');
  for (var p = Math.max(2, cur - 1); p <= Math.min(pages - 1, cur + 1); p++) out.push(p);
  if (cur < pages - 2) out.push('…');
  out.push(pages);
  return out;
}

/* ==================== 渲染：月视图 C ==================== */
function monthGridDates() {
  var first = new Date(S.year, S.month, 1);
  var startIdx = (first.getDay() + 6) % 7;
  var daysIn = new Date(S.year, S.month + 1, 0).getDate();
  var rows = Math.ceil((startIdx + daysIn) / 7);
  var dates = [];
  var d = new Date(S.year, S.month, 1 - startIdx);
  for (var i = 0; i < rows * 7; i++) { dates.push(iso(d)); d.setDate(d.getDate() + 1); }
  return dates;
}
/* C3：格内卡片仅显示在排期截止日所在日期格（区间卡不逐日铺开） */
function cardsDueOn(dateStr) {
  return visibleScheduled().filter(function (c) { return c.end === dateStr; });
}
/* G3：日详情弹层按排期区间覆盖当日取全量 */
function cardsCovering(dateStr) {
  return visibleScheduled().filter(function (c) { return c.start <= dateStr && c.end >= dateStr; });
}
function renderMonth() {
  var dates = monthGridDates();
  var curPrefix = S.year + '-' + String(S.month + 1).padStart(2, '0');
  var h = '';
  for (var r = 0; r < dates.length / 7; r++) {
    h += '<tr>';
    for (var c = 0; c < 7; c++) {
      var ds = dates[r * 7 + c];
      var inMonth = ds.slice(0, 7) === curPrefix;
      var isToday = ds === D.today;
      var cells = inMonth ? cardsDueOn(ds).filter(matchSearch) : [];
      var all = inMonth ? cardsDueOn(ds) : [];
      var shown = cells.slice(0, 3);
      h += '<td data-date="' + ds + '"' + (inMonth ? '' : ' data-out="1"') + '>';
      h += '<div class="chip-group">';
      h += isToday ? '<span class="busy-tag busy-tag--small">' + (+ds.slice(8)) + ' 今天</span>'
                   : '<span class="' + (inMonth ? 'u-mono' : 'u-muted') + '">' + (+ds.slice(8)) + '</span>';
      if (D.releaseDays.indexOf(ds) >= 0) h += '<span class="busy-tag busy-tag--small busy-tag--warning is-plain">发版</span>';
      h += '</div>';
      shown.forEach(function (card) { h += cardHtml(card, S.density === 'compact' ? 'compact' : 'standard'); });
      if (cells.length > 3) h += '<button class="busy-button is-link" type="button" data-day="' + ds + '"><span>+' + (cells.length - 3) + '</span></button>';
      if (inMonth && !cells.length && all.length && S.search) h += '<span class="u-sub u-muted">未命中 ' + all.length + ' 张已淡化</span>';
      h += '</td>';
    }
    h += '</tr>';
  }
  $('monthBody').innerHTML = h;
  bindCards($('monthBody'));
  /* +N 日详情弹层 G3 */
  $('monthBody').querySelectorAll('[data-day]').forEach(function (b) {
    b.addEventListener('click', function (e) { e.stopPropagation(); openDay(b.getAttribute('data-day')); });
  });
  /* 发版日：点击可放置日期格空白处切换（G 操作反馈清单） */
  $('monthBody').querySelectorAll('td[data-date]').forEach(function (td) {
    td.addEventListener('click', function (e) {
      if (td.getAttribute('data-out')) return;
      /* 仅日期格空白处切换发版日（排除卡片、+N、日期数字行与按钮） */
      if (e.target.closest('[data-card]') || e.target.closest('button') || e.target.closest('.chip-group')) return;
      toggleReleaseDay(td.getAttribute('data-date'));
    });
    td.addEventListener('dragover', function (e) { if (!td.getAttribute('data-out')) e.preventDefault(); });
    td.addEventListener('drop', function (e) {
      e.preventDefault();
      var no = e.dataTransfer.getData('text/plain');
      if (no) dropCardOn(no, td.getAttribute('data-date'));
    });
  });
}
function toggleReleaseDay(ds) {
  var i = D.releaseDays.indexOf(ds);
  var marked = i >= 0;
  if (marked) D.releaseDays.splice(i, 1); else D.releaseDays.push(ds);
  P.toast(marked ? '已取消 ' + P.mmdd(ds) + ' 的发版日标记' : '已标记 ' + P.mmdd(ds) + ' 为发版日', 'success');
  renderMonth();
}

/* ==================== 渲染：周视图 D（负责人 × 周一至周日） ==================== */
function weekDates() {
  var d = parseD(S.weekAnchor);
  var monday = new Date(d); monday.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  var out = [];
  for (var i = 0; i < 7; i++) { out.push(iso(monday)); monday.setDate(monday.getDate() + 1); }
  return out;
}
function renderWeek() {
  var dates = weekDates();
  $('weekHead').innerHTML = '<tr><th>负责人</th>' + dates.map(function (ds) {
    return '<th>' + '一二三四五六日'[dates.indexOf(ds)] + ' <span class="u-mono">' + P.mmdd(ds) + '</span>' +
      (ds === D.today ? ' <span class="busy-tag busy-tag--small">今天</span>' : '') + '</th>';
  }).join('') + '</tr>';
  /* D3：卡片落在本周内排期截止日所在列 */
  var cards = visibleScheduled().filter(function (c) { return c.end >= dates[0] && c.end <= dates[6] && matchSearch(c); });
  /* D2：负责人取开发人，无开发人时取提交人，均无归入「未指定」；行按负责人拼音排序 */
  var owners = [];
  cards.forEach(function (c) {
    var o = c.developer || c.submitter || '未指定';
    if (owners.indexOf(o) < 0) owners.push(o);
  });
  owners.sort(function (a, b) { return String(a).localeCompare(String(b), 'zh-Hans-CN'); });
  var isCurWeek = dates.indexOf(D.today) >= 0;
  $('weekBody').innerHTML = owners.map(function (o) {
    var mine = cards.filter(function (c) { return (c.developer || c.submitter || '未指定') === o; });
    var delayN = isCurWeek ? mine.filter(function (c) { return P.statusMeta(c).label === '延期'; }).length : 0;
    var row = '<td><b>' + o + '</b> <span class="u-sub">本周 ' + mine.length + ' 张</span>' +
      (delayN ? ' <span class="busy-tag busy-tag--small busy-tag--warning">延 ' + delayN + '</span>' : '') + '</td>';
    dates.forEach(function (ds) {
      row += '<td data-date="' + ds + '">' + mine.filter(function (c) { return c.end === ds; })
        .map(function (c) { return cardHtml(c, 'standard'); }).join('') + '</td>';
    });
    return '<tr>' + row + '</tr>';
  }).join('') || '<tr><td colspan="8"><div class="busy-empty"><div class="busy-empty__image">▦</div>本周暂无已排期的卡片</div></td></tr>';
  bindCards($('weekBody'));
  $('weekBody').querySelectorAll('td[data-date]').forEach(function (td) {
    td.addEventListener('dragover', function (e) { e.preventDefault(); });
    td.addEventListener('drop', function (e) {
      e.preventDefault();
      var no = e.dataTransfer.getData('text/plain');
      if (no) dropCardOn(no, td.getAttribute('data-date'));
    });
  });
}

/* ==================== 渲染：列表视图 E ==================== */
function renderList() {
  var prefix = S.year + '-' + String(S.month + 1).padStart(2, '0');
  var rows = visibleScheduled().filter(function (c) { return c.start && c.start.slice(0, 7) === prefix && matchSearch(c); });
  if (S.sortKey) {
    rows = rows.slice().sort(function (a, b) {
      var va = S.sortKey === 'start' ? a.start : (a.created || '');
      var vb = S.sortKey === 'start' ? b.start : (b.created || '');
      if (!va) return 1; if (!vb) return -1; /* 空值置底 */
      return S.sortAsc ? (va < vb ? -1 : 1) : (va > vb ? -1 : 1);
    });
  }
  $('listEmpty').hidden = rows.length > 0;
  $('listTable').hidden = rows.length === 0;
  $('listBody').innerHTML = rows.map(function (c) {
    return '<tr data-card="' + c.no + '">' +
      '<td><b>' + c.title + '</b>' + (c.merged ? ' <span class="busy-tag busy-tag--small is-plain">⊕ 合并 · ' + c.childCount + ' 项</span>' : '') + '</td>' +
      '<td class="u-mono">' + c.no + '</td>' +
      '<td>' + P.projectTag(c.project, true) + '</td>' +
      '<td><span class="busy-tag busy-tag--small busy-tag--info is-plain">' + c.module + '</span></td>' +
      '<td>' + (c.submitter || '—') + '</td>' +
      '<td>' + (c.developer || '—') + '</td>' +
      '<td class="u-mono">' + c.start + '</td>' +
      '<td class="u-mono">' + c.end + '</td>' +
      '<td>' + P.statusCell(c) + '</td>' +
      '<td class="u-mono u-sub">' + (c.created || '—') + '</td>' +
      '<td><span class="tpl-row-actions">' + rowAction(c) + '</span></td>' +
      '</tr>';
  }).join('');
  bindListActions();
}
function rowAction(c) {
  var m = P.statusMeta(c).label;
  if (m === '延期' && c.status === 'PENDING') m = '待开发';
  if (m === '延期' && c.status === 'IN_PROGRESS') m = '开发中';
  /* E3：待开发「领取」「澄清」、开发中「完成」「澄清」、开发完成「回退」；「澄清」打开转待澄清弹窗（G14），子卡不提供 */
  var clarify = c.child ? '' : '<button class="busy-button is-link busy-button--warning" type="button" data-act="clarify" data-no="' + c.no + '"><span>澄清</span></button>';
  if (m === '待开发') return '<button class="busy-button is-link" type="button" data-act="take" data-no="' + c.no + '"><span>领取</span></button>' + clarify;
  if (m === '开发中') return '<button class="busy-button is-link" type="button" data-act="done" data-no="' + c.no + '"><span>完成</span></button>' + clarify;
  if (c.status === 'DONE') return '<button class="busy-button is-link" type="button" data-act="revert" data-no="' + c.no + '"><span>回退</span></button>';
  return '';
}

/* ==================== 卡片事件绑定（点击进详情 G1 / 拖拽 / 右键 G5 / 多选勾选 F8） ==================== */
function bindCards(root) {
  root.querySelectorAll('[data-card]').forEach(function (el) {
    var no = el.getAttribute('data-card');
    el.addEventListener('click', function (e) {
      if (e.target.closest('button') || e.target.closest('a')) return;
      if (S.batch || S.mergeMode) { toggleSelect(no); return; }
      P.openDetail(findCard(no));
    });
    el.addEventListener('dragstart', function (e) {
      var card = findCard(no);
      if (card && (card.status === 'DONE' || card.status === 'NON_FEATURE' || card.child)) {
        /* 拖拽锁定卡（开发完成/非需求改动/子卡）：拦截并提示 */
        e.preventDefault();
        P.toast('已完成的卡片不允许拖拽改期；如需改期请先回退状态', 'error');
        return;
      }
      e.dataTransfer.setData('text/plain', no);
      e.dataTransfer.effectAllowed = 'move';
    });
    el.addEventListener('contextmenu', function (e) {
      e.preventDefault();
      openCtxMenu(no);
    });
  });
}
function findCard(no) {
  var all = D.scheduled.concat(D.pool.items, D.pool.page2, D.pool.page3, D.nonFeature.items, D.clarifying.items);
  return all.filter(function (c) { return c.no === no; })[0];
}

/* 拖拽落点：池→日历=排期；日历→日历=改期；日历→池=拖回待排期（business-rule §2.1） */
function removeFromPool(no) {
  ['items', 'page2', 'page3'].forEach(function (k) {
    var i = D.pool[k].findIndex(function (c) { return c.no === no; });
    if (i >= 0) D.pool[k].splice(i, 1);
  });
}
function dropCardOn(no, dateStr) {
  var card = findCard(no);
  if (!card) return;
  if (dateStr < D.today) { P.toast('不可将卡片改期到今天之前', 'error'); return; }
  var fromPool = !card.start;
  var dur = card.start ? P.daysBetween(card.start, card.end) : 1;
  if (card.start === dateStr && card.end) return; /* 拖回原日期不产生变更 */
  card.start = dateStr;
  var end = parseD(dateStr); end.setDate(end.getDate() + dur - 1);
  card.end = iso(end);
  if (fromPool) {
    removeFromPool(no);
    D.pool.total--; moveScheduledIn(card);
    P.toast('已排期到 ' + P.mmdd(dateStr), 'success');
    poolAfterRemove();
  } else {
    P.toast('已改期到 ' + P.mmdd(dateStr), 'success');
  }
  renderAll();
}
function moveScheduledIn(card) { if (D.scheduled.indexOf(card) < 0) D.scheduled.push(card); }
function poolAfterRemove() {
  /* 刷新当前页，当前页为空且不是第 1 页时回退上一页 */
  var total = visiblePoolTotal();
  var pages = Math.max(1, Math.ceil(total / S.poolSize));
  if (S.poolPage > pages) S.poolPage = pages;
}
function dropCardToPool(no) {
  var card = findCard(no);
  if (!card || !card.start) return;
  delete card.start; delete card.end;
  D.pool.total++;
  S.poolPage = 1; /* 移回待排期后回到第 1 页 */
  P.toast('已移回待排期', 'success');
  renderAll();
}

/* ==================== G5 右键菜单（busy-dialog 承载；不可用项置灰） ==================== */
function openCtxMenu(no) {
  var card = findCard(no);
  if (!card) return;
  var locked = card.status === 'DONE' || card.status === 'CLARIFYING' || card.child;
  var unscheduled = !card.start;
  /* G5：移入非需求改动仅未排期、非子卡、非非需求改动且具编辑权限时可用，其余置灰 */
  var canNonFeature = unscheduled && !card.child && card.status !== 'NON_FEATURE' && card.status !== 'CLARIFYING';
  /* G5：转待澄清——不具标记完成权限时不展示（演示账号全权限）；卡片非待开发或开发中、或为子卡时置灰 */
  var canClarify = canRaise(card);
  function item(label, act, disabled) {
    return '<button class="busy-button is-text' + (disabled ? ' is-disabled' : '') + '" type="button" data-x="' + act + '"' + (disabled ? ' disabled' : '') + '><span>' + label + '</span></button>';
  }
  $('ovCtx').innerHTML =
    '<div class="busy-dialog">' +
      '<div class="busy-dialog__header"><span class="busy-dialog__title">' + no + '</span>' +
      '<button class="busy-dialog__close" type="button" data-x="close">✕</button></div>' +
      '<div class="busy-dialog__body"><div class="tpl-section">' +
        item('查看详情', 'view', false) +
        item('改期到今天', 'today', locked || unscheduled) +
        item('改期到明天', 'tomorrow', locked || unscheduled) +
        item('移回待排期', 'pool', locked || unscheduled) +
        item('移入非需求改动', 'nonfeature', !canNonFeature) +
        (PERM.markDone ? item('转待澄清', 'clarify', !canClarify) : '') +
      '</div></div>' +
    '</div>';
  P.openOverlay('ovCtx');
  $('ovCtx').querySelector('[data-x="close"]').onclick = function () { P.closeOverlay('ovCtx'); };
  $('ovCtx').querySelectorAll('button[data-x]').forEach(function (b) {
    if (b.disabled || b.getAttribute('data-x') === 'close') return;
    b.addEventListener('click', function () {
      var act = b.getAttribute('data-x');
      P.closeOverlay('ovCtx');
      if (act === 'view') P.openDetail(findCard(no));
      if (act === 'today') dropCardOn(no, D.today);
      if (act === 'tomorrow') { var t = parseD(D.today); t.setDate(t.getDate() + 1); dropCardOn(no, iso(t)); }
      if (act === 'pool') dropCardToPool(no);
      if (act === 'nonfeature') moveToNonFeature(no);
      if (act === 'clarify') openRaiseFor(no);
    });
  });
}
/* G5 右键「移入非需求改动」：二次确认后清空排期、开发人与完成 commit */
function moveToNonFeature(no) {
  var card = findCard(no);
  if (!card) return;
  P.confirmBox({
    title: '移入非需求改动',
    message: '确认将 ' + card.no + '『' + card.title + '』移入非需求改动？移入后将清空排期、开发人与完成 commit。',
    onOk: function () {
      card.status = 'NON_FEATURE';
      delete card.start; delete card.end; delete card.developer; delete card.takenAt; delete card.doneAt; card.commits = 0;
      removeFromPool(no);
      D.pool.total--; D.nonFeature.items.unshift(card); D.nonFeature.total++;
      poolAfterRemove();
      P.toast('已移入非需求改动', 'success');
      renderAll();
    }
  });
}

/* ==================== 需求澄清（A10 入口 / G5 右键 / E3 行内「澄清」/ G13 待澄清列表 / G14 澄清弹窗；规则见 business-rule §11） ==================== */
var PERM = { edit: true, del: true, markDone: true, releaseDay: true }; /* 演示账号陈默持有全部按钮权限（permission-rules §1） */
function canRaise(card) {
  var st = card.status || 'PENDING'; /* 池卡片未带 status 时即待开发 */
  return (st === 'PENDING' || st === 'IN_PROGRESS') && !card.child;
}
function openRaiseFor(no) {
  var card = findCard(no);
  if (!card) return;
  if (!canRaise(card)) { P.toast('仅待开发或开发中的非子卡可转待澄清', 'error'); return; }
  P.clarify.openRaise('ovClarify', card, { onSuccess: function (q) { doRaise(card, q); } });
}
/* 按对象移出月历 / 待排期池，返回来源 */
function removeCardObj(card) {
  var i = D.scheduled.indexOf(card);
  if (i >= 0) { D.scheduled.splice(i, 1); return 'scheduled'; }
  var segs = ['items', 'page2', 'page3'];
  for (var s = 0; s < segs.length; s++) {
    var j = D.pool[segs[s]].indexOf(card);
    if (j >= 0) { D.pool[segs[s]].splice(j, 1); return 'pool'; }
  }
  return '';
}
/* 回到待排期池：按池排序（创建时间倒序，同刻按编号倒序）插入 */
function insertPoolSorted(card) {
  var segs = [D.pool.items, D.pool.page2, D.pool.page3];
  for (var s = 0; s < segs.length; s++) {
    for (var i = 0; i < segs[s].length; i++) {
      var x = segs[s][i];
      if (x.created < card.created || (x.created === card.created && x.no < card.no)) { segs[s].splice(i, 0, card); return; }
    }
  }
  D.pool.page3.push(card);
}
function removeClarifyItem(no) {
  var i = D.clarifying.items.findIndex(function (x) { return x.no === no; });
  if (i >= 0) D.clarifying.items.splice(i, 1);
  D.clarifying.total = D.clarifying.items.length;
  D.stats.clarifying = D.clarifying.total;
}
/* 转待澄清成功：卡片移出月历与待排期池，排期清空、开发人保留；生成澄清记录（澄清前状态与原排期）；待澄清计数 +1 */
function doRaise(card, question) {
  var from = removeCardObj(card);
  if (from === 'pool') { D.pool.total--; poolAfterRemove(); }
  D.clarifying.items.push({
    no: card.no, title: card.title, module: card.module, project: card.project, submitter: card.submitter || '',
    developer: card.developer, takenAt: card.takenAt, nature: card.nature, bizContact: card.bizContact,
    created: card.created || '', merged: card.merged, childCount: card.childCount, srcHash: card.srcHash,
    status: 'CLARIFYING', round: (card.clarifyRounds || 0) + 1, raiser: D.user, raisedAt: D.now, channel: 'PC',
    preStatus: card.status || 'PENDING', preStart: card.start || '', preEnd: card.end || '', question: question,
    content: card.content, children: card.children, childRepos: card.childRepos, sourceCommits: card.sourceCommits
  });
  P.saveClarification(card.no, D.clarifying.items[D.clarifying.items.length - 1], 'OPEN');
  D.clarifying.total = D.clarifying.items.length;
  D.stats.clarifying = D.clarifying.total;
  var owner = card.submitter || '';
  /* 负责人为本人或未匹配系统用户时不发送通知（business-rule §11.5） */
  P.toast(!owner || owner === D.user || card.ownerUnmatched ? '已转为待澄清' : '已转为待澄清，已通知 ' + owner, 'success');
  renderAll();
  if (!$('ovClarifyList').hidden) renderClarifyList(false);
}
/* 完成澄清成功：原卡与修订卡自动合并为新合并卡（标题/负责人/性质/对接人取原卡），恢复澄清前状态并回到待排期池；编号变为新合并卡 */
function doResolve(it, picks) {
  var isUsed = function (no) {
    return !!findCard(no) || D.clarifying.items.some(function (x) { return x.no === no; }) || D.revisionCommits.some(function (c) { return c.card === no; });
  };
  var revNos = picks.map(function (c) { return c.card || P.nextCardNo(isUsed); }); /* 未出卡的修订 commit 当场出卡 */
  var newNo = P.nextCardNo(isUsed);
  P.saveClarification(it.no, it, 'RESOLVED', {
    mergedInto: newNo, revisions: picks.map(function (c, i) { return { hash: c.hash, msg: c.msg, author: c.author, time: c.time, card: revNos[i] }; })
  });
  removeClarifyItem(it.no);
  revNos.forEach(function (no) { /* 修订卡成为子卡：离开待排期池 / 月历 */
    var rc = findCard(no);
    if (rc && removeCardObj(rc) === 'pool') D.pool.total--;
  });
  picks.forEach(function (c, i) { if (!c.card) c.card = revNos[i]; });
  var restored = it.preStatus || 'PENDING';
  var mc = {
    no: newNo, title: it.title, module: it.module, project: it.project, submitter: it.submitter,
    created: D.now, ago: '刚刚', merged: true, childCount: (it.merged ? it.childCount : 1) + picks.length,
    status: restored, nature: it.nature, bizContact: it.bizContact, clarifiedFrom: it.no
  };
  if (restored === 'IN_PROGRESS') { mc.developer = it.developer; mc.takenAt = it.takenAt; }
  var originals = it.merged ? (it.children || D.children).slice() : [{
    no: it.no, title: it.title, module: it.module, submitter: it.submitter, srcHash: it.srcHash,
    preStatus: P.statusLabel(restored), preDate: '—', mergedAt: D.now, created: it.created, clarifyOrigin: true
  }];
  mc.children = picks.map(function (c, i) { return {
    no: revNos[i], title: c.msg.replace(/^[a-z]+(\([^)]*\))?:\s*/, '').slice(0, 30),
    module: it.module, submitter: c.author, srcHash: c.hash, repo: c.repo, created: c.time,
    preStatus: '待开发', preDate: '—', mergedAt: D.now
  }; }).concat(originals);
  mc.childCount = mc.children.length;
  mc.content = '合并自 ' + mc.childCount + ' 张子卡：\n' + mc.children.map(function (c) { return '- ' + c.no + ' ' + c.title; }).join('\n');
  mc.sourceCommits = mc.children.map(function (c) { return { repo: c.repo || P.harnessOf(it), hash: c.srcHash, no: c.no, title: c.title, author: c.submitter, time: c.created }; });
  mc.logs = [{ time: D.now, type: '创建卡片', op: D.user, desc: '澄清完成，合并自 ' + mc.childCount + ' 张：' + mc.children.map(function (c) { return c.no; }).join(', ') }];
  insertPoolSorted(mc); D.pool.total++;
  S.poolPage = 1; /* 待排期池回到第 1 页 */
  P.toast('澄清完成，已并入合并卡 ' + newNo + '，回到待排期池', 'success');
  renderAll();
  refreshClarifyList();
}
/* 撤回澄清成功：恢复澄清前状态，排期为空回到待排期池，开发人信息不变；不合并任何卡片 */
function doWithdraw(it, reason) {
  P.saveClarification(it.no, it, 'WITHDRAWN', { reason: reason });
  removeClarifyItem(it.no);
  var restored = it.preStatus || 'PENDING';
  var ago = P.agoInfo(it.created || D.now);
  var card = {
    no: it.no, title: it.title, module: it.module, project: it.project, submitter: it.submitter,
    created: it.created || D.now, ago: ago.text, stale: ago.stale, status: restored, nature: it.nature, bizContact: it.bizContact,
    merged: it.merged, childCount: it.childCount, srcHash: it.srcHash, clarifyRounds: it.round,
    content: it.content, children: it.children, sourceCommits: it.sourceCommits
  };
  if (it.developer) { card.developer = it.developer; card.takenAt = it.takenAt; }
  insertPoolSorted(card); D.pool.total++;
  S.poolPage = 1;
  P.toast('已撤回澄清，卡片恢复为「' + P.statusLabel(restored) + '」回到待排期池', 'success');
  renderAll();
  refreshClarifyList();
}

/* ---------- G13 待澄清列表弹层：分栏 全部 / 我负责的 / 我发起的；发起时间正序（同刻编号倒序）；10 / 20 / 50 分页 ---------- */
var CL = { tab: 'all', page: 1, size: 10, previous: null };
function changeClarifyList(tab, page, size) {
  CL.previous = { tab: CL.tab, page: CL.page, size: CL.size };
  CL.tab = tab; CL.page = page; CL.size = size;
  renderClarifyList(true);
}
function clarifyTabItems(tab) {
  var all = D.clarifying.items.slice().sort(function (a, b) {
    if (a.raisedAt !== b.raisedAt) return a.raisedAt < b.raisedAt ? -1 : 1;
    return a.no < b.no ? 1 : a.no > b.no ? -1 : 0;
  });
  if (tab === 'mine') return all.filter(function (i) { return i.submitter === D.user; });   /* 负责人是当前用户 */
  if (tab === 'raised') return all.filter(function (i) { return i.raiser === D.user; });   /* 当前澄清的发起人是当前用户 */
  return all;
}
function openClarifyList() {
  CL.tab = 'all'; CL.page = 1; CL.previous = null; /* 每次打开回到「全部」第 1 页 */
  renderClarifyList(true);
  P.openOverlay('ovClarifyList');
}
/* 完成 / 撤回后刷新当前页，当前页为空且不是第 1 页时回退上一页 */
function refreshClarifyList() {
  if ($('ovClarifyList').hidden) return;
  var pages = Math.max(1, Math.ceil(clarifyTabItems(CL.tab).length / CL.size));
  if (CL.page > pages) CL.page = pages;
  renderClarifyList(true);
}
function clarifyRow(it) {
  var w = P.waitInfo(it.raisedAt);
  var canWithdraw = it.raiser === D.user ? PERM.markDone : PERM.edit;
  return '<tr data-clar="' + it.no + '">' +
    '<td><div class="chip-group"><b>' + P.esc(it.title) + '</b><span class="busy-tag busy-tag--small busy-tag--warning">待澄清</span>' + P.projectTag(it.project, true) +
      (it.merged ? '<span class="busy-tag busy-tag--small is-plain">⊕ 合并 · ' + it.childCount + ' 项</span>' : '') + '</div>' +
      '<div class="u-sub u-mono">' + it.no + ' · 负责人 ' + (it.submitter || '—') + ' · 发起人 ' + it.raiser + '（' + it.channel + '）</div>' +
      '<div class="chip-group"><span class="u-sub u-mono">发起于 ' + it.raisedAt + '</span>' +
        '<span class="busy-tag busy-tag--small ' + (w.over2d ? 'busy-tag--warning' : 'busy-tag--info is-plain') + '" data-wait="' + (w.over2d ? 'over' : 'ok') + '">已等待 ' + w.short + '</span></div>' +
      '<div class="u-sub" data-clamp="2">' + P.esc(P.summary(it.question)) + '</div></td>' +
    '<td><span class="tpl-row-actions">' +
      (PERM.edit ? '<button class="busy-button is-link" type="button" data-cact="resolve" data-no="' + it.no + '"><span>完成澄清</span></button>' : '') +
      (canWithdraw ? '<button class="busy-button is-link" type="button" data-cact="withdraw" data-no="' + it.no + '"><span>撤回</span></button>' : '') +
    '</span></td></tr>';
}
function renderClarifyList(loading) {
  var items = clarifyTabItems(CL.tab);
  var total = items.length;
  var pages = Math.max(1, Math.ceil(total / CL.size));
  if (CL.page > pages) CL.page = pages;
  var pageItems = items.slice((CL.page - 1) * CL.size, CL.page * CL.size);
  var body = loading
    ? '<div class="busy-empty"><span class="chip-group"><span class="busy-button__loading"></span><span>加载中…</span></span></div>'
    : pageItems.length ? '<table class="busy-table"><tbody>' + pageItems.map(clarifyRow).join('') + '</tbody></table>'
    : '<div class="busy-empty"><div class="busy-empty__image">▦</div>暂无待澄清卡片</div>';
  var pager = '<div class="busy-pagination"><span class="u-muted">共 ' + total + ' 条</span>' +
    '<button type="button" data-cpg="prev"' + (CL.page <= 1 ? ' disabled' : '') + '>‹</button>' +
    pageList(CL.page, pages).map(function (p) {
      return p === '…' ? '<span class="u-muted">…</span>' : '<button type="button" data-cpg="' + p + '"' + (p === CL.page ? ' class="is-active"' : '') + '>' + p + '</button>';
    }).join('') +
    '<button type="button" data-cpg="next"' + (CL.page >= pages ? ' disabled' : '') + '>›</button>' +
    '<span class="u-muted">每页</span>' +
    [10, 20, 50].map(function (n) { return '<button type="button" data-csize="' + n + '"' + (n === CL.size ? ' class="is-active"' : '') + '>' + n + '</button>'; }).join('') +
    '</div>';
  var tabs = [['all', '全部'], ['mine', '我负责的'], ['raised', '我发起的']];
  var host = $('ovClarifyList');
  host.innerHTML =
    '<div class="busy-dialog" role="dialog" aria-label="待澄清">' +
      '<div class="busy-dialog__header"><span class="busy-dialog__title">待澄清 · 共 ' + D.clarifying.total + ' 张</span>' +
      '<button class="busy-dialog__close" type="button" data-x="close">✕</button></div>' +
      '<div class="busy-dialog__body"><div class="tpl-section">' +
        '<div class="busy-tabs" role="tablist">' + tabs.map(function (t) {
          return '<span class="busy-tabs__item' + (t[0] === CL.tab ? ' is-active' : '') + '" data-ctab="' + t[0] + '" role="tab" tabindex="0">' + t[1] + '</span>';
        }).join('') + '</div>' +
        '<div class="u-sub">按发起时间正序，等待最久的在前；不受工作台筛选、搜索与只看自己影响</div>' +
        '<div id="clarifyListBody"' + (loading ? ' aria-busy="true"' : '') + '>' + body + '</div>' +
      '</div></div>' +
      '<div class="busy-dialog__footer">' + pager + '</div>' +
    '</div>';
  host.querySelector('[data-x="close"]').onclick = function () { P.closeOverlay('ovClarifyList'); };
  host.querySelectorAll('[data-ctab]').forEach(function (t) {
    t.onclick = function () { changeClarifyList(t.getAttribute('data-ctab'), 1, CL.size); }; /* 切换分栏回到第 1 页 */
    t.onkeydown = function (e) { if (e.key === 'Enter') t.click(); };
  });
  host.querySelectorAll('[data-cpg]').forEach(function (b) {
    b.onclick = function () {
      var v = b.getAttribute('data-cpg');
      changeClarifyList(CL.tab, v === 'prev' ? CL.page - 1 : v === 'next' ? CL.page + 1 : +v, CL.size);
    };
  });
  host.querySelectorAll('[data-csize]').forEach(function (b) {
    b.onclick = function () { changeClarifyList(CL.tab, 1, +b.getAttribute('data-csize')); };
  });
  P.layoutOverlay('ovClarifyList', 720, 640);
  if (loading) {
    setTimeout(function () {
      if (host.hidden || !host.querySelector('[aria-busy]')) return;
      if (D.clarifying.failNext) { /* 可在 Mock 中置 true 演示加载失败，不产生网络或 console error */
        D.clarifying.failNext = false;
        if (CL.previous) {
          CL.tab = CL.previous.tab; CL.page = CL.previous.page; CL.size = CL.previous.size; CL.previous = null;
          renderClarifyList(false); P.toast('待澄清列表加载失败', 'error');
        } else {
          var body = $('clarifyListBody');
          body.removeAttribute('aria-busy');
          body.innerHTML = '<div class="busy-empty">待澄清列表加载失败<div><button class="busy-button" type="button" data-retry="clarify"><span>重新加载</span></button></div></div>';
          body.querySelector('[data-retry]').onclick = function () { renderClarifyList(true); };
        }
      } else { CL.previous = null; renderClarifyList(false); }
    }, 350);
    return;
  }
  host.querySelectorAll('[data-clamp]').forEach(function (el) { P.clampLines(el, 2); }); /* 问题摘要最多 2 行 */
  host.querySelectorAll('tr[data-clar]').forEach(function (tr) {
    tr.addEventListener('click', function (e) {
      if (e.target.closest('button')) return;
      P.openDetail(findCard(tr.getAttribute('data-clar')));
    });
  });
  host.querySelectorAll('[data-cact]').forEach(function (b) {
    b.addEventListener('click', function () {
      var it = D.clarifying.items.filter(function (x) { return x.no === b.getAttribute('data-no'); })[0];
      if (!it) return;
      if (b.getAttribute('data-cact') === 'resolve') {
        P.clarify.openResolve('ovClarify', it, { onSuccess: function (picks) { doResolve(it, picks); } });
      } else {
        P.clarify.openWithdraw('ovClarify', it, { onSuccess: function (reason) { doWithdraw(it, reason); } });
      }
    });
  });
}

/* ==================== G2 筛选抽屉（草稿/应用语义见 business-rule §6.1） ==================== */
var filterDraft = null;
function openFilter() {
  filterDraft = JSON.parse(JSON.stringify(S.filters));
  renderFilterDrawer();
  P.openOverlay('ovFilter');
}
function selectedTags() {
  var f = filterDraft, tags = [];
  if (f.mine) tags.push({ g: 'mine', v: '只看自己' });
  f.status.forEach(function (v) { tags.push({ g: 'status', v: v }); });
  f.owners.forEach(function (v) { tags.push({ g: 'owners', v: v }); });
  f.repos.forEach(function (v) { tags.push({ g: 'repos', v: v }); });
  f.projects.forEach(function (v) { tags.push({ g: 'projects', v: v }); });
  f.modules.forEach(function (v) { tags.push({ g: 'modules', v: v }); });
  return tags;
}
function renderFilterDrawer() {
  var f = filterDraft;
  function group(title, key, opts, isProject) {
    /* 各复选组首项「全部」= 清空该组（G2） */
    var allItem = '<label class="busy-checkbox' + (f[key].length === 0 ? ' is-checked' : '') + '" data-g="' + key + '" data-v="__all__"><span class="busy-checkbox__inner"></span><span>全部</span></label>';

        var label = isProject && o !== '未归属项目'

          : (o === '未归属项目' ? P.projectTag('none', true) : o);
        return '<label class="busy-checkbox' + (checked ? ' is-checked' : '') + '" data-g="' + key + '" data-v="' + o + '"><span class="busy-checkbox__inner"></span><span>' + label + '</span></label>';
      }).join('') + '</div></div>';
  }
  $('ovFilter').innerHTML =
    '<div class="busy-drawer rtl" role="dialog" aria-label="筛选">' +
      '<div class="busy-dialog__header"><span class="busy-dialog__title">筛选</span>' +
      '<button class="busy-dialog__close" type="button" data-x="close">✕</button></div>' +
      '<div class="busy-dialog__body busy-drawer__body"><div class="tpl-section">' +
        '<div class="tpl-toolbar"><div class="tpl-toolbar__left">' +
        '<label class="busy-checkbox' + (f.mine ? ' is-checked' : '') + '" id="mineSwitch" role="switch" aria-checked="' + f.mine + '"><span class="busy-checkbox__inner"></span><span>只看自己</span></label>' +
        '<span class="u-sub">即时生效，不入抽屉草稿</span></div></div>' +
        '<div class="chip-group" id="filterTags">' +
          (selectedTags().map(function (t) {
            return '<span class="busy-tag busy-tag--small">' + t.v + ' <button class="busy-button is-text" type="button" data-g="' + t.g + '" data-v="' + t.v + '"><span>✕</span></button></span>';
          }).join('') || '<span class="u-sub">暂无条件</span>') +
        '</div>' +
        group('状态 <span class="u-sub">「延期」为前端派生</span>', 'status', D.filterOptions.status) +
        group('负责人', 'owners', D.filterOptions.owners) +
        group('skills 仓库', 'repos', D.filterOptions.repos) +
        group('项目', 'projects', D.filterOptions.projects, true) +
        group('模块', 'modules', D.filterOptions.modules) +
      '</div></div>' +
      '<div class="busy-dialog__footer">' +
        '<button class="busy-button" type="button" data-x="reset"><span>重 置</span></button>' +
        '<button class="busy-button" type="button" data-x="cancel"><span>取 消</span></button>' +
        '<button class="busy-button busy-button--primary" type="button" data-x="ok"><span>确 定</span></button>' +
      '</div>' +
    '</div>';
  $('mineSwitch').onclick = function () {

  };
  $('ovFilter').querySelectorAll('.busy-checkbox[data-g]').forEach(function (lb) {

      if (i >= 0) filterDraft[g].splice(i, 1); else filterDraft[g].push(v);
      renderFilterDrawer();
    });
  });
  $('ovFilter').querySelectorAll('#filterTags [data-g]').forEach(function (b) {

                '<span class="u-sub">' + c.author + ' · ' + c.time + '</span>' + note + '</label>';

      createState.commit = lb.getAttribute('data-c');

    P.btnLoading(btn, function () {

      P.closeOverlay('ovCreate');
      P.toast('已生成卡片 ' + newNo + '，落入待排期池', 'success');
      renderAll();
    });
  };

        '<div class="busy-form-item__content"><div class="busy-input"><input id="projName" maxlength="12" value="' + f.name + '" placeholder="1-12 字，启用中项目之间唯一"></div>' +
        '<div class="busy-form-item__error" id="projNameErr" hidden></div></div></div>' +
        '<div class="busy-form-item"><div class="busy-form-item__label">标识色</div>' +
        '<div class="busy-form-item__content">' + (f.mode === 'edit' ? P.projectTag(D.projects[f.idx].key, true) + ' <span class="u-sub">' + D.projects[f.idx].colorName + ' · 系统分配，不可编辑</span>' : '<span class="u-sub">创建时按调色板顺序自动分配</span>') + '</div></div>' +
        '<div class="busy-form-item"><div class="busy-form-item__label is-required">harness 工程</div>' +
        '<div class="busy-form-item__content"><div class="busy-select"><div class="busy-input"><input id="projHarness" placeholder="搜索并选择云效研发仓" value="' + f.harness + '"></div><span class="busy-select__caret">▾</span></div>' +
        '<div class="busy-select-dropdown" id="projHarnessDd" hidden>' +
          D.repos.map(function (r) {
            var dis = r.stale || (r.owner && r.name.indexOf('harness-') === 0 && (f.mode === 'new' || D.projects[f.idx].harness !== r.name));
            var note = r.stale ? '（云效侧已失效）' : (dis ? '（已被 ' + r.owner + ' 占用）' : '');
            return '<div class="busy-select-dropdown__item' + (dis ? ' is-disabled' : '') + (f.harness === r.name ? ' is-selected' : '') + '" data-r="' + r.name + '">' + r.name + ' <span class="u-sub">' + note + '</span></div>';
          }).join('') +
        '</div>' +
        '<div class="busy-form-item__error" id="projHarnessErr" hidden>请选择 harness 工程</div></div></div>' +
        '<div class="busy-form-item"><div class="busy-form-item__label">代码服务仓</div>' +
        '<div class="busy-form-item__content"><div class="busy-checkbox-group">' +
          D.repos.filter(function (r) { return r.name.indexOf('harness-') !== 0; }).map(function (r) {
            var dis = r.stale || (r.owner && f.repos.indexOf(r.name) < 0 && (f.mode === 'new' || D.projects[f.idx].repos.indexOf(r.name) < 0) && r.owner !== f.name);
            var note = r.stale ? '（云效侧已失效）' : (dis ? '（已被 ' + r.owner + ' 占用）' : '');
            return '<label class="busy-checkbox' + (f.repos.indexOf(r.name) >= 0 ? ' is-checked' : '') + (dis ? ' is-disabled' : '') + '" data-r="' + r.name + '"' + (dis ? ' data-dis="1"' : '') + '><span class="busy-checkbox__inner"></span><span class="u-mono">' + r.name + '</span> <span class="u-sub">' + note + '</span></label>';
          }).join('') +
        '</div></div></div>' +
        '<div class="busy-form-item"><div class="busy-form-item__label is-required">状态</div>' +
        '<div class="busy-form-item__content"><div class="busy-radio-group">' +
          ['启用', '停用'].map(function (s) { return '<label class="busy-radio' + (f.status === s ? ' is-checked' : '') + '" data-s="' + s + '"><span class="busy-radio__inner"></span><span>' + s + '</span></label>'; }).join('') +
        '</div></div></div>' +
        '<div class="busy-form-item"><div class="busy-form-item__label">备注</div>' +
        '<div class="busy-form-item__content"><textarea class="busy-textarea" id="projRemark" placeholder="选填">' + f.remark + '</textarea></div></div>' +
      '</div></div>' +
      '<div class="busy-dialog__footer">' +
        '<button class="busy-button" type="button" data-x="back"><span>返回列表</span></button>' +
        '<button class="busy-button busy-button--primary" type="button" data-x="save"><span>保 存</span></button>' +
      '</div>' +
    '</div>';
  var nameInput = $('projName');
  nameInput.addEventListener('blur', function () {
    var v = nameInput.value.trim(), err = $('projNameErr');
    if (!v) { err.textContent = '请填写项目名称'; err.hidden = false; return; }
    if (v.length > 12) { err.textContent = '项目名称最长 12 字'; err.hidden = false; return; }
    var dup = D.projects.filter(function (p, i) { return p.status === '启用' && p.name === v && (f.mode === 'new' || i !== f.idx); })[0];
    if (dup) { err.textContent = '项目名称「' + v + '」已被启用中项目占用'; err.hidden = false; return; }
    err.hidden = true; f.name = v; f.dirty = true;
  });
  nameInput.addEventListener('input', function () { f.dirty = true; });
  var hInput = $('projHarness'), hDd = $('projHarnessDd');
  hInput.addEventListener('input', function () {
    f.dirty = true;
    var kw = hInput.value.trim();
    hDd.hidden = false;
    hDd.querySelectorAll('[data-r]').forEach(function (it) { it.hidden = kw && it.textContent.indexOf(kw) < 0; });
  });
  hInput.closest('.busy-select').addEventListener('click', function () { hDd.hidden = !hDd.hidden; });
  hDd.querySelectorAll('[data-r]').forEach(function (it) {
    it.addEventListener('click', function () {
      if (it.classList.contains('is-disabled')) return;
      f.harness = it.getAttribute('data-r'); f.dirty = true;
      hInput.value = f.harness; hDd.hidden = true;
      $('projHarnessErr').hidden = true;
    });
  });
  $('ovProject').querySelectorAll('.busy-checkbox[data-r]').forEach(function (lb) {
    lb.addEventListener('click', function () {
      if (lb.getAttribute('data-dis')) return;
      var r = lb.getAttribute('data-r'), i = f.repos.indexOf(r);
      if (i >= 0) f.repos.splice(i, 1); else f.repos.push(r);
      f.dirty = true;
      lb.classList.toggle('is-checked');
    });
  });
  $('ovProject').querySelectorAll('.busy-radio[data-s]').forEach(function (lb) {
    lb.addEventListener('click', function () {
      f.status = lb.getAttribute('data-s'); f.dirty = true;
      $('ovProject').querySelectorAll('.busy-radio[data-s]').forEach(function (x) { x.classList.remove('is-checked'); });
      lb.classList.add('is-checked');
    });
  });
  $('projRemark').addEventListener('input', function () { f.remark = this.value; f.dirty = true; });
  $('ovProject').querySelector('[data-x="close"]').onclick = function () { P.closeOverlay('ovProject'); };
  $('ovProject').querySelector('[data-x="back"]').onclick = function () {
    if (f.dirty) {
      P.confirmBox({ title: '放弃修改', message: '项目信息尚未保存，确认放弃？', onOk: function () { renderProjectList(); } });
    } else renderProjectList();
  };
  $('ovProject').querySelector('[data-x="save"]').onclick = function () {
    nameInput.dispatchEvent(new Event('blur'));
    if (!$('projNameErr').hidden) { nameInput.focus(); return; }
    if (!f.name) { $('projNameErr').textContent = '请填写项目名称'; $('projNameErr').hidden = false; nameInput.focus(); return; }
    if (!f.harness) { $('projHarnessErr').hidden = false; return; }
    var btn = this;
    P.btnLoading(btn, function () {
      if (f.mode === 'new') {
        var palette = [['蓝', ''], ['青', 'busy-tag--success'], ['紫', 'busy-tag--danger'], ['金', 'busy-tag--warning'], ['品红', 'busy-tag--danger is-plain'], ['橙红', 'busy-tag--warning is-plain']];
        var ci = D.projects.length % 6;
        D.projects.push({ key: 'p' + Date.now(), name: f.name, colorName: palette[ci][0], cls: palette[ci][1], harness: f.harness, repos: f.repos.slice(), status: f.status, remark: f.remark });
      } else {
        var p = D.projects[f.idx];
        p.name = f.name; p.harness = f.harness; p.repos = f.repos.slice(); p.status = f.status; p.remark = f.remark;
      }
      P.toast('项目已保存，卡片归属已按新映射重新解析', 'success');
      renderProjectList(); renderAll();
    });
  };
}

/* ==================== 行内操作（气泡确认 = BubbleCard 的 busy-popover is-light DOM） ==================== */
function bindListActions() {
  $('listBody').querySelectorAll('tr[data-card]').forEach(function (tr) {
    tr.addEventListener('click', function (e) {
      if (e.target.closest('button') || e.target.closest('.busy-popover')) return;
      P.openDetail(findCard(tr.getAttribute('data-card')));
    });
  });
  $('listBody').querySelectorAll('[data-act]').forEach(function (b) {
    b.addEventListener('click', function () {
      var no = b.getAttribute('data-no'), act = b.getAttribute('data-act');
      var target = findCard(no);
      /* E3「澄清」：直接打开转待澄清弹窗（G14），不使用气泡确认 */
      if (act === 'clarify') { openRaiseFor(no); return; }
      var tips = {
        take: '确认领取开发？',
        done: '确认标记完成？完成 commit 可稍后在卡片详情页补录',
        /* E3：回退确认文案按卡片有无开发人区分 */
        revert: target && target.developer ? '确认回退为开发中？将清空完成 commit，保留开发人' : '确认回退为待开发？将清空完成 commit，卡片无开发人'
      };
      var pop = document.createElement('span');
      pop.className = 'busy-popover is-light';
      pop.innerHTML = '<div>' + tips[act] + '</div><div class="tpl-footer-bar">' +
        '<button class="busy-button busy-button--small" type="button" data-x="no"><span>取消</span></button>' +
        '<button class="busy-button busy-button--small busy-button--primary" type="button" data-x="yes"><span>确定</span></button></div>';
      b.parentNode.appendChild(pop);
      P.onEsc(function () { pop.remove(); }, pop);
      pop.querySelector('[data-x="no"]').onclick = function () { pop.remove(); };
      pop.querySelector('[data-x="yes"]').onclick = function () {
        var card = findCard(no);
        P.btnLoading(pop.querySelector('[data-x="yes"]'), function () {
          pop.remove();
          if (act === 'take') { card.status = 'IN_PROGRESS'; card.developer = D.user; card.takenAt = D.today + ' 10:00'; P.toast('已领取开发', 'success'); }
          if (act === 'done') { card.status = 'DONE'; card.doneAt = D.today + ' 10:00'; if (!card.developer) { card.developer = D.user; card.takenAt = D.today + ' 10:00'; } P.toast('已标记完成', 'success'); }
          if (act === 'revert') {
            if (card.developer) { card.status = 'IN_PROGRESS'; P.toast('已回退为开发中', 'success'); }
            else { card.status = 'PENDING'; P.toast('已回退为待开发', 'success'); }
            delete card.doneAt; card.commits = 0;
          }
          renderAll();
        });
      };
    });
  });
}

/* ==================== 命令栏事件 ==================== */
function shiftPeriod(dir) {
  if (S.view === 'week') {
    var d = parseD(S.weekAnchor); d.setDate(d.getDate() + dir * 7);
    S.weekAnchor = iso(d);
  } else {
    S.month += dir;
    if (S.month < 0) { S.month = 11; S.year--; }
    if (S.month > 11) { S.month = 0; S.year++; }
  }
  renderAll();
}
function periodText() {
  if (S.view === 'week') {
    var ds = weekDates();
    return ds[0] + ' ~ ' + ds[6];
  }
  return S.year + ' 年 ' + (S.month + 1) + ' 月';
}
$('btnPrev').onclick = function () { shiftPeriod(-1); };
$('btnNext').onclick = function () { shiftPeriod(1); };
$('btnToday').onclick = function () {
  S.year = 2026; S.month = 9; S.weekAnchor = D.today;
  renderAll();
};
$('periodLabel').onclick = function () { if (S.view !== 'week') openYm(); };
/* A3：本月进度快捷筛选为单选开关（再点取消）；与筛选抽屉的状态条件交集为空时，抽屉状态条件置空 */
function applyQuickStatus(k) {
  S.quickStatus = S.quickStatus === k ? null : k;
  if (S.quickStatus && S.filters.status.length) {
    var drawerLabel = { PENDING: '待开发', IN_PROGRESS: '开发中', DONE: '已完成', DELAYED: '延期' }[S.quickStatus];
    if (S.filters.status.indexOf(drawerLabel) < 0) S.filters.status = [];
  }
}
document.querySelectorAll('#statWrap [data-stat]').forEach(function (b) {
  b.addEventListener('click', function () {
    applyQuickStatus(b.getAttribute('data-stat'));
    renderAll();
  });
});
$('btnProgressFloat').onclick = openProgress;
$('searchInput').addEventListener('input', function () {
  S.search = this.value.trim();
  S.poolPage = 1; /* 搜索变化后待排期池回到第 1 页 */
  if (S.batch || S.mergeMode) exitSelectModes();
  renderAll();
});
$('searchInput').addEventListener('keydown', function (e) {
  if (e.key === 'Escape') { this.value = ''; S.search = ''; S.poolPage = 1; renderAll(); }
});
document.querySelectorAll('#viewSwitch [data-view]').forEach(function (lb) {
  lb.addEventListener('click', function () {
    S.view = lb.getAttribute('data-view');
    localStorage.setItem('fs_view', S.view);
    renderAll();
  });
});
$('btnClarify').onclick = openClarifyList;
$('btnFilter').onclick = openFilter;
$('btnCreate').onclick = openCreate;
$('btnMore').onclick = openMore;
$('btnBatch').onclick = function () {
  S.batch = !S.batch; S.mergeMode = false; S.selected = {};
  renderBars(); renderAll();
};
$('btnPoolCollapse').onclick = function () {
  S.poolCollapsed = true; localStorage.setItem('fs_pool', '1'); renderAll();
};
$('btnPoolOpen').onclick = function () {
  S.poolCollapsed = false; localStorage.setItem('fs_pool', '0'); renderAll();
};
$('btnClearFilter').onclick = function () {
  S.filters = { mine: false, status: [], owners: [], repos: [], projects: [], modules: [] };
  S.quickStatus = null; S.poolPage = 1; renderAll();
};
$('btnClearSearch').onclick = function () {
  S.search = ''; $('searchInput').value = ''; S.poolPage = 1; renderAll();
};
/* 列表排序 E2 */
document.querySelectorAll('#listTable [data-sort]').forEach(function (b) {
  b.addEventListener('click', function (e) {
    e.stopPropagation();
    var k = b.getAttribute('data-sort');
    if (S.sortKey === k) S.sortAsc = !S.sortAsc; else { S.sortKey = k; S.sortAsc = true; }
    b.querySelector('span').textContent = (k === 'start' ? '开始 ' : '创建时间 ') + (S.sortAsc ? '↑' : '↓');
    renderList();
  });
});
/* 待排期池接收拖回（含落到池内卡片上，不触发合并） */
$('poolPanel').addEventListener('dragover', function (e) { e.preventDefault(); });
$('poolPanel').addEventListener('drop', function (e) {
  e.preventDefault();
  var no = e.dataTransfer.getData('text/plain');
  if (no) dropCardToPool(no);
});

/* ==================== 键盘 H：←/→ 切换期，T 回到今天；输入框聚焦、弹层打开与后台页签时不响应 ==================== */
document.addEventListener('keydown', function (e) {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (document.hidden || P.isOverlayOpen()) return;
  if (e.key === 'ArrowLeft') shiftPeriod(-1);
  if (e.key === 'ArrowRight') shiftPeriod(1);
  if (e.key === 't' || e.key === 'T') $('btnToday').click();
});
/* Esc 分层关闭（右键菜单 → 气泡确认 → 二次确认 → 澄清弹窗 → 弹层 → … 由 FS_PROTO 按打开顺序处理）；无浮层时退出多选态 */
P.setEscFallback(function () {
  if (S.batch || S.mergeMode) { S.batch = false; S.mergeMode = false; S.selected = {}; renderBars(); renderAll(); }
});

/* 单行指挥栏：放不下完整本月进度时收进「进度」浮层，不挤压搜索 / 视图 / 待澄清 / 筛选等核心操作。 */
function renderCommandLayout() {
  var toolbar = $('commandBar').querySelector('.tpl-toolbar');
  toolbar.querySelectorAll('.tpl-toolbar__right button').forEach(function (b) { b.classList.add('busy-button--small'); });
  ['btnPrev', 'btnNext'].forEach(function (id) { $(id).classList.add('busy-button--circle'); });
  var search = $('searchInput').parentNode;
  if (search._geometry) search._geometry.cancel();
  var width = innerWidth < 1280 ? 120 : 220;
  search._geometry = search.animate([{ width: width + 'px' }, { width: width + 'px' }], { duration: 1, fill: 'forwards' });
  $('statWrap').hidden = false; $('btnProgressFloat').hidden = true;
  var left = toolbar.querySelector('.tpl-toolbar__left'), right = toolbar.querySelector('.tpl-toolbar__right');
  var collapsed = left.getBoundingClientRect().width + right.getBoundingClientRect().width + 12 > toolbar.clientWidth;
  $('statWrap').hidden = collapsed; $('btnProgressFloat').hidden = !collapsed;
  /* 桌面场景：页面本身不滚动，视图区与池各自滚动；窄屏沿用模板纵向堆叠保底。 */
  function geometry(el, props) {
    if (el._paneGeometry) el._paneGeometry.cancel();
    if (innerWidth <= 1024) return;
    el._paneGeometry = el.animate([props, props], { duration: 1, fill: 'forwards' });
  }
  var page = document.querySelector('section.tpl-page'), dual = page.querySelector('.tpl-dual');
  geometry(page, { height: Math.max(0, innerHeight - 48) + 'px', minHeight: '0px', overflow: 'hidden' });
  geometry(dual, { flex: '1 1 auto', minHeight: '0px', alignItems: 'stretch', overflow: 'hidden', gridTemplateColumns: S.poolCollapsed ? '0px minmax(0px, 1fr)' : '280px minmax(0px, 1fr)' });
  geometry(dual.querySelector('.tpl-dual__main'), { minHeight: '0px', overflowY: 'auto' });
  geometry($('poolPanel'), { minHeight: '0px', height: '100%', overflow: 'hidden' });
  geometry($('poolBody'), { flex: '1 1 auto', minHeight: '0px', overflowY: 'auto' });
  $('poolPanel').hidden = S.poolCollapsed;
}
window.addEventListener('resize', function () {
  renderCommandLayout();
  if (!$('ovClarifyList').hidden) { P.layoutOverlay('ovClarifyList', 720, 640); $('ovClarifyList').querySelectorAll('[data-clamp]').forEach(function (el) { P.clampLines(el, 2); }); }
  if (!$('ovClarify').hidden && $('ovClarify').querySelector('#clrCommitList')) P.layoutOverlay('ovClarify', 720, 640);
});

/* ==================== 总渲染与初始化 ==================== */
function renderAll() {
  renderStats();
  renderPool();
  $('periodLabel').querySelector('span').textContent = periodText() + (S.view !== 'week' ? ' ▾' : '');
  document.querySelectorAll('#viewSwitch [data-view]').forEach(function (b) {
    var on = b.getAttribute('data-view') === S.view;
    b.classList.toggle('busy-button--primary', on);
    b.setAttribute('aria-selected', String(on));
  });
  $('viewMonth').hidden = S.view !== 'month';
  $('viewWeek').hidden = S.view !== 'week';
  $('viewList').hidden = S.view !== 'list';
  if (S.view === 'month') renderMonth();
  if (S.view === 'week') renderWeek();
  if (S.view === 'list') renderList();
  /* C5 零命中提示 */
  var hasVisible = S.view === 'list'
    ? visibleScheduled().filter(function (c) { return c.start && c.start.slice(0, 7) === S.year + '-' + String(S.month + 1).padStart(2, '0') && matchSearch(c); }).length > 0
    : visibleScheduled().filter(function (c) { return c.start; }).filter(matchSearch).length > 0;
  $('zeroHit').hidden = !(anyFilterActive() && !hasVisible);
  renderCommandLayout();
}
P.renderNav({ active: 'schedule' });
renderBars();
renderAll();



</script>
</body>
</html>

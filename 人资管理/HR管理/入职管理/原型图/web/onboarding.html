<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="prototype-components" content="Button,BusyInput,PageableSelect,DatePicker,Tag,Checkbox,Popover,Table,Pagination,Message">
  <title>入职管理 · 台账与详情</title>
  <!-- 静态 Mock：四页签台账（含未到岗）与入职详情同文件，#list / #detail/{入职单号} 互联；勾选后可批量提醒、改期、标记未到岗；李成记录满足确认入职条件，可演示确认入职与档案生成。 -->
  <style>
    :root{
      --primary:#2563eb; --primary-weak:#eff4ff; --primary-line:#bfd3ff;
      --bg:#f4f6fa; --panel:#fff; --line:#e5e8ef; --line-strong:#d3d9e4;
      --text:#1f2937; --muted:#6b7280; --subtle:#9aa3b2;
      --success:#15803d; --success-weak:#eaf7ef; --warn:#b45309; --warn-weak:#fff7e6;
      --danger:#b91c1c; --danger-weak:#fdecec;
      --radius:10px; --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.08);
    }
    *{box-sizing:border-box}
    [hidden]{display:none!important}
    body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    button,input,select,textarea{font:inherit;color:inherit}
    .topbar{display:flex;align-items:center;gap:12px;height:52px;padding:0 24px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
    .topbar b{font-weight:600}
    .topbar .spacer{flex:1;color:var(--subtle);font-size:12px}
    .page{max-width:1420px;margin:0 auto;padding:20px 24px 72px}
    .page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:12px}
    .page-head h1{margin:0;font-size:20px;line-height:1.5;display:flex;align-items:center;gap:10px}
    .title-icon{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:8px;background:var(--primary);color:#fff;font-size:16px}
    .page-sub{margin:2px 0 0;color:var(--muted);font-size:13px}
    .actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end;position:relative}
    .btn{height:34px;padding:0 14px;border-radius:8px;border:1px solid var(--line-strong);background:#fff;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
    .btn:hover{border-color:#b9c2d2}
    .btn-primary{background:var(--primary);border-color:var(--primary);color:#fff}
    .btn-primary:hover{background:#1d4ed8;border-color:#1d4ed8}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    .btn-link{border:0;background:none;color:var(--primary);padding:0 2px;height:auto;cursor:pointer}
    .btn-link.danger{color:var(--danger)}
    .btn-link.muted{color:#c3c8d1;cursor:not-allowed}
    .tabs{display:flex;align-items:center;gap:28px;margin:0 0 12px;padding:0 4px;border-bottom:1px solid var(--line)}
    .tab{position:relative;padding:10px 2px 12px;border:0;background:none;color:var(--text);font-size:15px;cursor:pointer}
    .tab .num{font-size:12px;color:var(--subtle);margin-left:4px}
    .tab.is-active{color:var(--primary);font-weight:600}
    .tab.is-active::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;border-radius:2px;background:var(--primary)}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
    .filter-card{padding:14px 16px;margin-bottom:12px;position:relative}
    .filter-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .field{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);white-space:nowrap}
    .field input,.field select{height:32px;min-width:120px;padding:0 10px;border:1px solid var(--line-strong);border-radius:8px;background:#fff;color:var(--text)}
    .field input[type=date]{min-width:136px}
    .field.date-range{gap:4px}
    .filter-row .grow{flex:1}
    .adv-toggle{color:var(--primary);border:0;background:none;cursor:pointer;padding:0;height:32px}
    .adv-badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;margin-left:4px;border-radius:999px;background:var(--primary-weak);color:#1e40af;font-size:11px;border:1px solid var(--primary-line)}
    .clear-link{border:0;background:none;color:var(--primary);cursor:pointer;height:32px}
    .adv-panel{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);display:flex;gap:10px;flex-wrap:wrap}
    .pop{position:absolute;z-index:40;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(16,24,40,.14);padding:10px;min-width:190px}
    .pop label{display:flex;align-items:center;gap:8px;padding:6px 6px;border-radius:6px;font-size:13px;color:var(--text);cursor:pointer}
    .pop label:hover{background:#f5f7fb}
    .pop .pop-title{font-size:12px;color:var(--subtle);padding:2px 6px 6px}
    .table-card{padding:0;overflow:visible}
    .table-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);min-height:46px}
    .batch{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted)}
    .batch b{color:var(--primary)}
    .table-tools{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}
    .gear{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer}
    .table-wrap{overflow:auto;max-height:560px;border-bottom:1px solid var(--line)}
    table{border-collapse:separate;border-spacing:0;width:100%;min-width:1280px}
    th,td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;font-size:13px}
    th{position:sticky;top:0;z-index:5;background:#f8fafc;color:var(--muted);font-weight:500}
    th:first-child,td:first-child{position:sticky;left:0;background:inherit;z-index:6}
    th:first-child{background:#f8fafc}
    td:first-child{background:#fff}
    tbody tr:hover td{background:#f9fbff}
    tbody tr:hover td:first-child{background:#f9fbff}
    tbody tr.is-checked td{background:var(--primary-weak)}
    tbody tr.is-checked td:first-child{background:var(--primary-weak)}
    .name-cell{display:flex;align-items:center;gap:8px;font-weight:500}
    .avatar{width:24px;height:24px;border-radius:50%;background:#dbeafe;color:#1e40af;display:inline-flex;align-items:center;justify-content:center;font-size:12px;flex:none}
    .person-cell{display:inline-flex;align-items:center;gap:6px}
    .tag{display:inline-flex;align-items:center;padding:1px 8px;border-radius:999px;font-size:12px;line-height:20px;white-space:nowrap}
    .tag-primary{background:var(--primary-weak);color:#1e40af;border:1px solid var(--primary-line)}
    .tag-success{background:var(--success-weak);color:var(--success);border:1px solid #c8ead4}
    .tag-warn{background:var(--warn-weak);color:var(--warn);border:1px solid #f2ddb4}
    .tag-neutral{background:#f3f4f6;color:var(--muted);border:1px solid var(--line)}
    .tag-danger{background:var(--danger-weak);color:var(--danger);border:1px solid #f5c6c6}
    .muted{color:var(--subtle)}
    .warn-text{color:var(--danger);font-weight:600}
    .ok-text{color:var(--success);font-weight:600}
    .row-actions{display:flex;align-items:center;gap:10px;font-size:13px}
    .pager{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;font-size:13px;color:var(--muted)}
    .pager .pages{display:flex;gap:6px;align-items:center}
    .pager button{height:30px;min-width:30px;border-radius:6px;border:1px solid var(--line-strong);background:#fff;cursor:pointer}
    .pager button.is-active{border-color:var(--primary);color:var(--primary);background:var(--primary-weak)}
    .toast-host{position:fixed;top:16px;right:16px;z-index:99;display:flex;flex-direction:column;gap:8px}
    .toast{background:#111827;color:#fff;padding:10px 14px;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.2);font-size:13px;max-width:360px}
    .toast.err{background:#b91c1c}
    .mask{position:fixed;inset:0;background:rgba(15,23,42,.42);z-index:60;display:flex;align-items:center;justify-content:center;padding:24px}
    .modal{width:520px;max-width:100%;background:#fff;border-radius:12px;box-shadow:0 24px 64px rgba(15,23,42,.28);overflow:hidden}
    .modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
    .modal-head h3{margin:0;font-size:16px}
    .modal-body{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
    .modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line);background:#fafbfd}
    .form-item{display:flex;flex-direction:column;gap:6px;font-size:13px}
    .form-item label{color:var(--muted)}
    .form-item input,.form-item textarea{width:100%;padding:8px 10px;border:1px solid var(--line-strong);border-radius:8px}
    .form-item textarea{min-height:84px;resize:vertical}
    .form-error{color:var(--danger);font-size:12px;min-height:16px}
    .chip-list{display:flex;flex-wrap:wrap;gap:6px}
    .chip{background:#f3f4f6;border-radius:999px;padding:2px 10px;font-size:12px}
    /* 详情 */
    .detail-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
    .back{color:var(--primary);text-decoration:none;font-size:13px;display:inline-flex;align-items:center;gap:4px}
    .detail-title{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .detail-title h1{margin:0;font-size:20px}
    .overview{display:flex;gap:16px;padding:18px 20px;margin-bottom:12px;flex-wrap:wrap;align-items:flex-start}
    .ov-avatar{width:48px;height:48px;border-radius:12px;background:var(--primary-weak);color:#1e40af;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:600}
    .ov-main{flex:1;min-width:280px}
    .ov-name{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:600}
    .ov-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px 24px;margin-top:10px;font-size:13px}
    .ov-meta span{color:var(--muted)}
    .ov-meta b{font-weight:500;color:var(--text)}
    .detail-tabs{display:flex;gap:24px;padding:0 16px;border-bottom:1px solid var(--line)}
    .dtab{padding:12px 2px;border:0;background:none;cursor:pointer;color:var(--text);position:relative}
    .dtab.is-active{color:var(--primary);font-weight:600}
    .dtab.is-active::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--primary)}
    .panel-body{padding:16px}
    .section-title{font-weight:600;margin:0 0 10px;font-size:14px}
    .status-strip{display:flex;gap:22px;flex-wrap:wrap;background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:13px;margin-bottom:14px}
    .status-strip span{color:var(--muted)}
    .desc{width:100%;border:1px solid var(--line);border-radius:8px;overflow:hidden;border-collapse:collapse;min-width:0}
    .desc th,.desc td{white-space:normal;font-size:13px;padding:9px 12px;border-bottom:1px solid var(--line);position:static;background:#fff}
    .desc th{background:#f8fafc;width:120px;color:var(--muted);font-weight:500}
    .desc tr:last-child th,.desc tr:last-child td{border-bottom:0}
    .empty{padding:32px;text-align:center;color:var(--subtle)}
    .detail-table th,.detail-table td{position:static;white-space:nowrap;background:#fff}
    .detail-table th{background:#f8fafc}
    .preview-box{margin-top:12px;border:1px dashed var(--line-strong);border-radius:8px;padding:12px;background:#fafbfd;font-size:13px;color:var(--muted);white-space:pre-wrap}
    .prep-progress{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:13px;color:var(--muted)}
    .bar{height:8px;flex:1;max-width:240px;border-radius:999px;background:#eef2f7;overflow:hidden}
    .bar i{display:block;height:100%;background:var(--primary)}
    .bottom-bar{position:sticky;bottom:0;display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;background:rgba(255,255,255,.95);border-top:1px solid var(--line);backdrop-filter:blur(6px)}
    .blocker{background:var(--warn-weak);border:1px solid #f2ddb4;color:#8a5a00;border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:12px}
    .blocker ul{margin:6px 0 0;padding-left:18px}
    .inline-link{border:0;background:none;color:var(--primary);cursor:pointer;padding:0;font-size:13px;margin-left:6px}
    .u-mono{font-variant-numeric:tabular-nums}
    @media (max-width:900px){
      .page{padding:16px 12px 64px}
      .page-head{flex-direction:column;align-items:stretch}
      .actions{justify-content:flex-start}
      .tabs{gap:18px;overflow:auto}
      .filter-row{gap:8px}
    }
  </style>
</head>
<body>
  <span id="list" hidden></span>
  <span id="detail/OB20261123001" hidden></span>
  <nav class="topbar" aria-label="原型导航">
    <b>示例集团 · 人资管理</b>
    <span class="muted">/ HR管理 / 入职管理</span>
    <span class="spacer">静态 Mock</span>
  </nav>

  <div class="page" id="viewList">
    <div class="page-head">
      <div>
        <h1><span class="title-icon" aria-hidden="true">▣</span>入职管理</h1>
        <p class="page-sub">跟进待入职人员的信息采集、入职材料与入职准备，确认入职后写入员工档案</p>
      </div>
      <div class="actions">
        <button class="btn" type="button" id="btnRemindTop" disabled>提醒必备事项</button>
        <button class="btn" type="button" id="btnRescheduleTop" disabled>改期入职</button>
        <button class="btn btn-primary" type="button" id="btnExport">导出 ▾</button>
        <div class="pop" id="exportPop" hidden>
          <div class="pop-title">导出当前页签与筛选结果</div>
          <label><input type="checkbox" id="expMasked" checked disabled>证件号码脱敏（默认）</label>
          <label><input type="checkbox" id="expPlain">含证件号码明文（需敏感字段权限）</label>
          <div style="padding:8px 6px 2px"><button class="btn btn-primary" type="button" id="btnExportGo" style="width:100%;justify-content:center">导出</button></div>
        </div>
      </div>
    </div>

    <div class="tabs" id="tabs" role="tablist">
      <button class="tab is-active" type="button" data-tab="pending" role="tab">待入职<span class="num" id="cntPending"></span></button>
      <button class="tab" type="button" data-tab="today" role="tab">今日待入职<span class="num" id="cntToday"></span></button>
      <button class="tab" type="button" data-tab="joined" role="tab">已入职<span class="num" id="cntJoined"></span></button>
      <button class="tab" type="button" data-tab="noshow" role="tab">未到岗<span class="num" id="cntNoShow"></span></button>
    </div>

    <section class="card filter-card" aria-label="筛选">
      <div class="filter-row">
        <label class="field">姓名 <input id="fName" maxlength="20" placeholder="姓名" style="width:120px"></label>
        <label class="field">待入职部门 <select id="fDept"></select></label>
        <label class="field">雇佣关系 <select id="fEmploy"></select></label>
        <label class="field">计划入职日期 <span class="date-range"><input type="date" id="fFrom"> ~ <input type="date" id="fTo"></span></label>
        <label class="field">招聘季度 <select id="fQuarter"><option value="">全部季度</option><option>2026Q3</option><option>2026Q4</option></select></label>
        <div class="field" style="position:relative">
          <button class="btn" type="button" id="btnStatusPop" aria-haspopup="true" aria-expanded="false">入职状态：<span id="statusText">空（未填写）、正常、延期</span> ▾</button>
          <div class="pop" id="statusPop" hidden>
            <div class="pop-title">入职状态（可多选）</div>
            <label><input type="checkbox" value="" checked>空（未填写）</label>
            <label><input type="checkbox" value="正常" checked>正常</label>
            <label><input type="checkbox" value="延期" checked>延期</label>
          </div>
        </div>
        <div class="grow"></div>
        <button class="adv-toggle" type="button" id="btnAdv" aria-expanded="false">高级筛选</button>
        <button class="clear-link" type="button" id="btnClear">清空已选</button>
      </div>
      <div class="adv-panel" id="advPanel" hidden>
        <label class="field">信息采集状态 <select id="fCollection"></select></label>
        <label class="field">入职材料状态 <select id="fMaterial"></select></label>
        <label class="field">招聘负责人 <select id="fRecruiter"></select></label>
        <label class="field">招聘HR <select id="fHr"></select></label>
        <label class="field">Offer发送人 <select id="fOfferer"></select></label>
        <label class="field">爽约原因 <select id="fNoShowReason"><option value="">全部</option><option>个人原因</option><option>薪酬</option><option>地点</option><option>家庭</option><option>其他</option></select></label>
        <label class="field">是否逾期 <select id="fOverdue"><option value="">全部</option><option value="1">是</option><option value="0">否</option></select></label>
      </div>
    </section>

    <section class="card table-card" aria-label="入职台账">
      <div class="table-top">
        <div class="batch" id="batchBar" hidden>
          已选 <b id="selCount">0</b> 条
          <button class="btn-link" type="button" id="btnRemindBatch">提醒必备事项</button>
          <button class="btn-link" type="button" id="btnRescheduleBatch">改期入职</button>
          <button class="btn-link" type="button" id="btnNoShowBatch">标记未到岗</button>
          <button class="btn-link" type="button" id="btnClearSel">取消选择</button>
        </div>
        <div class="batch" id="totalBar">共 <b id="totalCount">0</b> 人</div>
        <div class="table-tools">
          <span id="tableHint">按计划入职日期排序</span>
          <button class="gear" type="button" id="btnGear" title="列设置" aria-label="列设置">⚙</button>
          <div class="pop" id="colsPop" hidden>
            <div class="pop-title">列设置（姓名与操作固定）</div>
            <div id="colsList"></div>
            <div style="padding:8px 6px 0;border-top:1px solid var(--line);margin-top:6px"><button class="btn-link" type="button" id="btnColsReset">恢复默认</button></div>
          </div>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr id="theadRow"></tr></thead>
          <tbody id="tbodyRows"></tbody>
        </table>
      </div>
      <div class="empty" id="listEmpty" hidden>暂无符合条件的入职人员</div>
      <div class="pager">
        <span id="pagerTotal">共 0 条</span>
        <div class="pages" id="pagerPages"></div>
      </div>
    </section>
  </div>

  <div class="page" id="viewDetail" hidden></div>

  <div class="mask" id="rescheduleMask" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="rescheduleTitle">
      <div class="modal-head"><h3 id="rescheduleTitle">改期入职</h3><button class="btn-link" type="button" id="btnRescheduleClose" aria-label="关闭">✕</button></div>
      <div class="modal-body">
        <div class="chip-list" id="rescheduleNames"></div>
        <div class="form-item">
          <label for="rDate">新计划入职日期</label>
          <input type="date" id="rDate">
        </div>
        <div class="form-item">
          <label for="rReason">改期原因（必填，200 字以内）</label>
          <textarea id="rReason" maxlength="200" placeholder="如：候选人现单位离职交接延期"></textarea>
        </div>
        <div class="form-error" id="rescheduleError"></div>
      </div>
      <div class="modal-foot">
        <button class="btn" type="button" id="btnRescheduleCancel">取消</button>
        <button class="btn btn-primary" type="button" id="btnRescheduleSubmit">确认改期</button>
      </div>
    </div>
  </div>

  <div class="mask" id="noShowMask" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="noShowTitle">
      <div class="modal-head"><h3 id="noShowTitle">标记未到岗</h3><button class="btn-link" type="button" id="btnNoShowClose" aria-label="关闭">✕</button></div>
      <div class="modal-body">
        <div class="chip-list" id="noShowNames"></div>
        <div class="form-item">
          <label for="nsReason">爽约原因</label>
          <select id="nsReason"><option>个人原因</option><option>薪酬</option><option>地点</option><option>家庭</option><option>其他</option></select>
        </div>
        <div class="form-item">
          <label for="nsNote">说明（选填，200 字以内）</label>
          <textarea id="nsNote" maxlength="200" placeholder="如：候选人在入职前一天告知接受其他公司 offer"></textarea>
        </div>
        <div class="tip">标记后将关闭对应 Offer 并释放职位名额，且不可撤销。</div>
        <div class="form-error" id="noShowError"></div>
      </div>
      <div class="modal-foot">
        <button class="btn" type="button" id="btnNoShowCancel">取消</button>
        <button class="btn btn-primary" type="button" id="btnNoShowSubmit">确认标记</button>
      </div>
    </div>

      var html = '<button class="btn-link" type="button" data-detail="' + p.id + '">详情</button>';
      if (!p.onboarded && p.arrival !== '未到岗' && p.arrival !== '已取消') {
        html += '<button class="btn-link" type="button" data-remind="' + p.id + '">提醒</button>';
        html += '<button class="btn-link" type="button" data-reschedule="' + p.id + '">改期</button>';
        var ok = eligible(p);
        html += '<button class="btn-link' + (ok ? '' : ' muted') + '" type="button" data-confirm="' + p.id + '"' + (ok ? '' : ' title="' + esc(blockers(p).join('；')) + '"') + '>确认入职</button>';
        if (p.plan < TODAY) html += '<button class="btn-link danger" type="button" data-noshow="' + p.id + '">标记未到岗</button>';
      }
      return '<div class="row-actions">' + html + '</div>';
    }

    function renderHead() {
      var html = '<th style="width:42px"><input type="checkbox" id="checkAll" aria-label="全选"' + (state.tab === 'joined' || state.tab === 'noshow' ? ' disabled' : '') + '></th><th style="width:110px">姓名</th>';
      OPTIONAL_COLS.forEach(function (c) {
        if (!state.cols[c[0]]) return;
        if (c[0] === 'plan') html += '<th style="width:150px">' + (state.tab === 'joined' ? '实际入职日期' : '计划入职日期') + '</th>';
        else if (c[0] === 'prep') html += '<th style="width:120px">入职准备进度</th>';
        else html += '<th>' + c[1] + '</th>';
      });
      html += '<th style="width:230px">操作</th>';
      $('theadRow').innerHTML = html;
    }

    function renderList() {
      var rows = currentRows();
      var pages = Math.max(1, Math.ceil(rows.length / state.pageSize));
      if (state.page > pages) state.page = pages;
      var pageRows = rows.slice((state.page - 1) * state.pageSize, state.page * state.pageSize);
      $('cntPending').textContent = tabRows('pending').length;
      $('cntToday').textContent = tabRows('today').length;
      $('cntJoined').textContent = tabRows('joined').length;
      $('cntNoShow').textContent = tabRows('noshow').length;
      $('totalCount').textContent = rows.length;
      $('totalBar').hidden = selectedIds().length > 0;
      $('batchBar').hidden = selectedIds().length === 0;
      $('selCount').textContent = selectedIds().length;
      $('tableHint').textContent = state.tab === 'joined' ? '按实际入职日期排序' : state.tab === 'noshow' ? '按爽约确认时间排序' : '按计划入职日期排序';
      renderHead();
      $('tbodyRows').innerHTML = pageRows.map(function (p) {
        var checked = !!state.selected[p.id];
        var fixed = '<td><input type="checkbox" data-check="' + p.id + '"' + (checked ? ' checked' : '') + (p.onboarded || p.arrival === '未到岗' ? ' disabled' : '') + ' aria-label="选择 ' + esc(p.name) + '"></td><td><span class="name-cell">' + esc(p.name) + '</span></td>';
        return '<tr class="' + (checked ? 'is-checked' : '') + '">' + fixed + rowCells(p) + '<td>' + rowActions(p) + '</td></tr>';
      }).join('');
      $('listEmpty').hidden = rows.length > 0;
      $('pagerTotal').textContent = '共 ' + rows.length + ' 条';
      var pageHtml = '<button type="button" data-page="' + Math.max(1, state.page - 1) + '"' + (state.page === 1 ? ' disabled' : '') + '>‹</button>';
      for (var i = 1; i <= pages; i++) {
        pageHtml += '<button type="button" data-page="' + i + '" class="' + (i === state.page ? 'is-active' : '') + '">' + i + '</button>';
      }
      pageHtml += '<button type="button" data-page="' + Math.min(pages, state.page + 1) + '"' + (state.page === pages ? ' disabled' : '') + '>›</button>';
      $('pagerPages').innerHTML = pageHtml;
      var allChecked = pageRows.length > 0 && pageRows.every(function (p) { return state.selected[p.id]; });
      var checkAll = $('checkAll');
      if (checkAll) checkAll.checked = allChecked;
      $('btnRemindTop').disabled = selectedIds().length === 0;
      $('btnRescheduleTop').disabled = selectedIds().length === 0;
      $('btnRemindBatch').disabled = selectedIds().length === 0;
      $('btnRescheduleBatch').disabled = selectedIds().length === 0;
      updateStatusText();
      var advN = [state.collection, state.material, state.recruiter, state.offerer, state.overdue].filter(Boolean).length;
      $('btnAdv').innerHTML = '高级筛选' + (advN ? ' <span class="adv-badge">' + advN + '</span>' : '');
    }

    function updateStatusText() {
      var map = { '': '空（未填写）', '正常': '正常', '延期': '延期' };
      var all = ['', '正常', '延期'];
      $('statusText').textContent = state.status.length === all.length ? '空（未填写）、正常、延期' : (state.status.map(function (s) { return map[s]; }).join('、') || '未选择');
    }

    /* ---------- 交互：筛选与列表 ---------- */
    function bindList() {
      $('tabs').addEventListener('click', function (e) {
        var btn = e.target.closest('[data-tab]');
        if (!btn) return;
        state.tab = btn.dataset.tab; state.page = 1; state.selected = {};
        $('tabs').querySelectorAll('.tab').forEach(function (t) { t.classList.toggle('is-active', t === btn); });
        renderList();
      });
      var nameTimer = null;
      $('fName').addEventListener('input', function () {
        clearTimeout(nameTimer);
        nameTimer = setTimeout(function () { state.name = $('fName').value; state.page = 1; state.selected = {}; renderList(); }, 250);
      });
      ['fDept', 'fEmploy', 'fFrom', 'fTo', 'fQuarter', 'fCollection', 'fMaterial', 'fRecruiter', 'fHr', 'fOfferer', 'fNoShowReason', 'fOverdue'].forEach(function (id) {
        $(id).addEventListener('change', function () {
          var key = { fDept: 'dept', fEmploy: 'employ', fFrom: 'from', fTo: 'to', fQuarter: 'quarter', fCollection: 'collection', fMaterial: 'material', fRecruiter: 'recruiter', fHr: 'hr', fOfferer: 'offerer', fNoShowReason: 'noShowReason', fOverdue: 'overdue' }[id];
          state[key] = $(id).value; state.page = 1; state.selected = {}; renderList();
        });
      });
      $('btnStatusPop').addEventListener('click', function (e) {
        e.stopPropagation();
        var pop = $('statusPop');
        pop.hidden = !pop.hidden;
        $('btnStatusPop').setAttribute('aria-expanded', String(!pop.hidden));
      });
      $('statusPop').addEventListener('change', function () {
        state.status = Array.prototype.slice.call($('statusPop').querySelectorAll('input:checked')).map(function (i) { return i.value; });
        state.page = 1; state.selected = {}; renderList();
      });
      $('btnAdv').addEventListener('click', function () {
        var panel = $('advPanel');
        panel.hidden = !panel.hidden;
        $('btnAdv').setAttribute('aria-expanded', String(!panel.hidden));
      });
      $('btnClear').addEventListener('click', function () {
        state.name = ''; state.dept = ''; state.employ = ''; state.from = ''; state.to = ''; state.quarter = '';
        state.status = ['', '正常', '延期']; state.collection = ''; state.material = ''; state.recruiter = ''; state.hr = ''; state.offerer = ''; state.noShowReason = ''; state.overdue = '';
        state.page = 1; state.selected = {};
        $('fName').value = ''; ['fDept', 'fEmploy', 'fFrom', 'fTo', 'fQuarter', 'fCollection', 'fMaterial', 'fRecruiter', 'fHr', 'fOfferer', 'fNoShowReason', 'fOverdue'].forEach(function (id) { $(id).value = ''; });
        $('statusPop').querySelectorAll('input').forEach(function (i) { i.checked = true; });
        renderList();
      });
      $('btnGear').addEventListener('click', function (e) {
        e.stopPropagation();
        $('colsPop').hidden = !$('colsPop').hidden;
      });
      $('colsList').addEventListener('change', function (e) {
        var input = e.target.closest('input[data-col]');
        if (!input) return;
        state.cols[input.dataset.col] = input.checked;
        renderList();
      });
      $('btnColsReset').addEventListener('click', function () {
        OPTIONAL_COLS.forEach(function (c) { state.cols[c[0]] = true; });
        $('colsList').querySelectorAll('input[data-col]').forEach(function (i) { i.checked = true; });
        renderList();
      });
      var exportOpen = false;
      $('btnExport').addEventListener('click', function (e) {
        e.stopPropagation();
        exportOpen = !exportOpen;
        $('exportPop').hidden = !exportOpen;
      });
      $('btnExportGo').addEventListener('click', function () {
        var plain = $('expPlain').checked;
        if (plain && !window.confirm('将导出证件号码明文，操作会写入操作记录，是否继续？')) return;
        var count = currentRows().length;
        toast('已导出 ' + count + ' 条记录' + (plain ? '（含证件号码明文）' : '（证件号码已脱敏）'));
        $('exportPop').hidden = true; exportOpen = false;
      });
      document.addEventListener('click', function (e) {
        if (!e.target.closest('#statusPop') && !e.target.closest('#btnStatusPop')) $('statusPop').hidden = true;
        if (!e.target.closest('#colsPop') && !e.target.closest('#btnGear')) $('colsPop').hidden = true;
        if (!e.target.closest('#exportPop') && !e.target.closest('#btnExport')) { $('exportPop').hidden = true; exportOpen = false; }
      });
      $('tbodyRows').addEventListener('change', function (e) {
        var box = e.target.closest('input[data-check]');
        if (!box) return;
        state.selected[box.dataset.check] = box.checked;
        syncSelectionUI();
      });
      $('theadRow').addEventListener('change', function (e) {
        if (e.target.id !== 'checkAll') return;
        var rows = currentRows().slice((state.page - 1) * state.pageSize, state.page * state.pageSize);
        rows.forEach(function (p) { state.selected[p.id] = e.target.checked; });
        syncSelectionUI();
      });
      $('pagerPages').addEventListener('click', function (e) {
        var btn = e.target.closest('[data-page]');
        if (!btn || btn.disabled) return;
        state.page = Number(btn.dataset.page);
        renderList();
      });
      $('btnClearSel').addEventListener('click', function () { state.selected = {}; syncSelectionUI(); });
      $('btnRemindTop').addEventListener('click', function () { remind(selectedIds()); });
      $('btnRemindBatch').addEventListener('click', function () { remind(selectedIds()); });
      $('btnRescheduleTop').addEventListener('click', function () { openReschedule(selectedIds()); });
      $('btnRescheduleBatch').addEventListener('click', function () { openReschedule(selectedIds()); });
      $('btnNoShowBatch').addEventListener('click', function () { openNoShow(selectedIds()); });
      $('tbodyRows').addEventListener('click', function (e) {
        var detail = e.target.closest('[data-detail]');
        if (detail) { location.hash = 'detail/' + detail.dataset.detail; return; }
        var remindBtn = e.target.closest('[data-remind]');
        if (remindBtn) { remind([remindBtn.dataset.remind]); return; }
        var res = e.target.closest('[data-reschedule]');
        if (res) { openReschedule([res.dataset.reschedule]); return; }
        var conf = e.target.closest('[data-confirm]');
        if (conf) { confirmOnboarding(conf.dataset.confirm); return; }
        var ns = e.target.closest('[data-noshow]');
        if (ns) { openNoShow([ns.dataset.noshow]); return; }
      });
    }

    /* ---------- 批量操作 ---------- */
    function remind(ids) {
      ids = ids.filter(function (id) { var p = byId(id); return p && !p.onboarded; });
      if (!ids.length) { toast('请先选择待入职人员', true); return; }
      var recent = ids.filter(function (id) {
        var p = byId(id);
        return (p.logs || []).some(function (l) { return l.type === '提醒必备事项' && l.time.slice(0, 10) === TODAY; });
      });
      if (recent.length && !window.confirm(recent.length + ' 人 24 小时内已提醒，仍要再次提醒？')) return;
      ids.forEach(function (id) { var p = byId(id); p.loggedRemind = true; log(p, '提醒必备事项', '提醒内容：未完成采集、未交齐材料与未填写入职状态'); });
      toast('已发送提醒 ' + ids.length + ' 人');
      if (currentId) renderDetail(); else renderList();
    }
    var rescheduleIds = [];
    var rescheduleOriginal = '';
    function openReschedule(ids) {
      ids = ids.filter(function (id) { var p = byId(id); return p && !p.onboarded; });
      if (!ids.length) { toast('请先选择待入职人员', true); return; }
      rescheduleIds = ids;
      $('rescheduleNames').innerHTML = ids.map(function (id) { return '<span class="chip">' + esc(byId(id).name) + '</span>'; }).join('');
      rescheduleOriginal = byId(ids[0]).plan;
      $('rDate').value = rescheduleOriginal;
      $('rDate').min = TODAY;
      $('rReason').value = '';
      $('rescheduleError').textContent = '';
      $('rescheduleMask').hidden = false;
    }
    function closeReschedule(skipConfirm) {
      if (!skipConfirm && !$('rescheduleMask').hidden) {
        var dirty = $('rReason').value.trim() || $('rDate').value !== rescheduleOriginal;
        if (dirty && !window.confirm('放弃本次改期？')) return;
      }
      $('rescheduleMask').hidden = true;
      rescheduleIds = [];
    }
    function submitReschedule() {
      var date = $('rDate').value;
      var reason = $('rReason').value.trim();
      if (!date) { $('rescheduleError').textContent = '请选择新的计划入职日期'; return; }
      if (date < TODAY) { $('rescheduleError').textContent = '新计划入职日期不得早于今天'; return; }
      if (!reason) { $('rescheduleError').textContent = '请填写改期原因'; return; }
      rescheduleIds.forEach(function (id) {
        var p = byId(id);
        var old = p.plan;
        p.plan = date; p.status = '延期';
        log(p, '改期入职', '原计划 ' + old + ' → ' + date + '，原因：' + reason);
      });
      var n = rescheduleIds.length;
      closeReschedule(true);
      toast('已改期 ' + n + ' 人');
      if (currentId) renderDetail(); else renderList();
    }

    var noShowIds = [];
    function openNoShow(ids) {
      var list = ids.map(byId).filter(function (p) { return p && !p.onboarded && p.arrival !== '未到岗' && p.arrival !== '已取消' && p.plan < TODAY; });
      if (!list.length) { toast('仅计划入职日期已过且未到岗的记录可标记', true); return; }
      noShowIds = list.map(function (p) { return p.id; });
      $('noShowNames').innerHTML = list.map(function (p) { return '<span class="chip">' + esc(p.name) + '</span>'; }).join('');
      $('nsReason').value = '个人原因';
      $('nsNote').value = '';
      $('noShowError').textContent = '';
      $('noShowMask').hidden = false;
    }
    function closeNoShow() {
      $('noShowMask').hidden = true;
      noShowIds = [];
    }
    function submitNoShow() {
      var reason = $('nsReason').value;
      var note = $('nsNote').value.trim();
      if (!reason) { $('noShowError').textContent = '请选择爽约原因'; return; }
      noShowIds.forEach(function (id) {
        var p = byId(id);
        if (!p) return;
        p.arrival = '未到岗';
        p.noShowReason = reason;
        p.noShowAt = nowText();
        log(p, '标记未到岗', '原因：' + reason + (note ? '；' + note : '') + '；招聘侧 Offer 已关闭，职位名额已释放');
      });
      var n = noShowIds.length;
      closeNoShow();
      state.selected = {};
      toast('已标记未到岗 ' + n + ' 人，招聘侧 Offer 已关闭');
      if (currentId) renderDetail(); else renderList();
    }

    function confirmOnboarding(id) {
      var p = byId(id);
      if (!p || p.onboarded) return;
      var list = blockers(p);
      if (list.length) { toast('暂不能确认入职：' + list.join('；'), true); return; }
      if (!window.confirm('确认入职后将写入员工档案且不可撤销，是否继续？')) return;
      p.onboarded = true; p.actual = TODAY; p.empNo = 'EMP' + String(10400 + Math.floor(Math.random() * 500));
      p.arrival = '已到岗';
      p.quarter = quarterOf(TODAY);
      var ln = function (v) { var m = String(v || '').match(/\d+/); return m ? Number(m[0]) : 0; };
      p.levelDiff = ln(p.level) < ln(p.offerLevel) ? '低于 Offer' : ln(p.level) > ln(p.offerLevel) ? '高于 Offer' : '无差异';
      log(p, '确认入职', '实际入职 ' + TODAY + '，员工档案已生成（' + p.empNo + '）；职级差异：' + p.levelDiff);
      toast('已确认入职，员工档案已生成' + (p.levelDiff !== '无差异' ? '（职级差异：' + p.levelDiff + '）' : ''));
      state.tab = 'joined'; state.page = 1; state.selected = {};
      $('tabs').querySelectorAll('.tab').forEach(function (t) { t.classList.toggle('is-active', t.dataset.tab === 'joined'); });
      location.hash = 'list';
      renderList();
    }

    /* ---------- 详情 ---------- */
    var currentId = null;
    var detailTab = 'collection';
    var previewIndex = -1;

    function collectionActions(p) {
      if (p.onboarded) return '<span class="muted">已入职，信息采集只读</span>';
      if (p.arrival === '未到岗') return '<span class="muted">未到岗，信息采集只读</span>';
      var html = '';
      if (p.collection === '未发送' || p.collection === '已发送') html += '<button class="btn" type="button" data-d-action="send">' + (p.collection === '未发送' ? '发送采集' : '重新发送') + '</button>';
      if (p.collection === '已暂存') html += '<button class="btn" type="button" data-d-action="send">重新发送</button>';
      if (p.collection === '已提交') html += '<button class="btn" type="button" data-d-action="return">退回重填</button>';
      return html;
    }
    function detailCollection(p) {
      var c = p.collect;
      var content = c
        ? '<table class="desc"><tbody>' +
            '<tr><th>个人基本信息</th><td>' + esc(c.basic) + '</td></tr>' +
            '<tr><th>联系方式</th><td>' + esc(c.contact) + '</td></tr>' +
            '<tr><th>紧急联系人</th><td>' + esc(c.emergency) + '</td></tr>' +
          '</tbody></table>'
        : '<div class="empty">候选人尚未提交信息采集</div>';
      return '<div class="status-strip">' +
          '<div><span>状态：</span>' + collectionTag(p.collection) + '</div>' +
          '<div><span>首次发送：</span>' + (p.sentAt || '—') + '</div>' +
          '<div><span>最近发送：</span>' + (p.sentAt || '—') + '</div>' +
          '<div><span>暂存时间：</span>' + (p.savedAt || '—') + '</div>' +
          '<div><span>提交时间：</span>' + (p.submittedAt || '—') + '</div>' +
        '</div>' +
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><h3 class="section-title" style="margin:0">采集内容</h3><div>' + collectionActions(p) + '</div></div>' + content;
    }
    function detailMaterials(p) {
      var sum = materialSummary(p);
      var required = p.materials.filter(function (m) { return m.required; });
      var confirmed = required.filter(function (m) { return m.state === '已确认'; }).length;
      var rows = p.materials.map(function (m, i) {
        var actions = '<button class="btn-link" type="button" data-mat-preview="' + i + '">预览</button>';
        if (!p.onboarded && p.arrival !== '未到岗') {
          if (m.state === '已提交') {
            actions += '<button class="btn-link" type="button" data-mat-confirm="' + i + '">确认</button>';
            actions += '<button class="btn-link danger" type="button" data-mat-return="' + i + '">退回</button>';
          }
          if (m.state === '已确认') actions += '<button class="btn-link danger" type="button" data-mat-return="' + i + '">退回</button>';
        }
        return '<tr><td>' + esc(m.name) + (m.required ? ' ' + tag('必备', 'warn') : '') + '</td><td>' + (m.state === '已确认' ? tag(m.state, 'success') : (m.state === '已退回' ? tag(m.state, 'danger') : tag(m.state, 'neutral'))) + '</td><td>' + esc(m.file || '—') + '</td><td class="u-mono">' + (m.upload || '—') + '</td><td>' + esc(m.confirmer || '—') + '</td><td class="u-mono">' + (m.confirmAt || '—') + '</td><td><div class="row-actions">' + actions + '</div></td></tr>';
      }).join('');
      var preview = '';
      if (previewIndex >= 0 && p.materials[previewIndex]) {
        var m = p.materials[previewIndex];
        preview = '<div class="preview-box">附件预览：' + esc(m.file || m.name) + '\n\n' + (m.file ? '材料内容（Mock）：' + esc(m.name) + '，上传于 ' + (m.upload || '—') + '。' : '尚未上传文件，无法预览。') + '</div>';
      }
      return '<div class="status-strip"><div><span>汇总状态：</span>' + materialTag(sum) + '</div><div><span>必备材料已确认：</span>' + confirmed + ' / ' + required.length + '</div><div><span>证件号码：</span>' + esc(p.idcard) + '（脱敏）</div></div>' +
        '<table class="desc detail-table"><thead><tr><th style="width:auto">材料名称</th><th>状态</th><th>文件名</th><th>上传时间</th><th>确认人</th><th>确认时间</th><th>操作</th></tr></thead><tbody>' + rows + '</tbody></table>' + preview;
    }
    function detailPreps(p) {
      var s = prepStat(p);
      var pct = s.total ? Math.round(s.done / s.total * 100) : 0;
      var rows = p.preps.map(function (it, i) {
        var actions = '<span class="muted">—</span>';
        if (!p.onboarded && p.arrival !== '未到岗') actions = it.done
          ? '<button class="btn-link" type="button" data-prep="' + i + '">撤销完成</button>'
          : '<button class="btn-link" type="button" data-prep="' + i + '">标记完成</button>';
        return '<tr><td>' + esc(it.name) + (it.required ? ' ' + tag('必备', 'warn') : '') + '</td><td>' + esc(it.owner) + '</td><td>' + (it.done ? tag('已完成', 'success') : tag('未完成', 'neutral')) + '</td><td class="u-mono">' + (it.doneAt || '—') + '</td><td><div class="row-actions">' + actions + '</div></td></tr>';
      }).join('');
      return '<div class="prep-progress"><span>已完成 ' + s.done + ' / ' + s.total + '</span><div class="bar"><i style="width:' + pct + '%"></i></div><span>' + (s.allRequired ? '<span class="ok-text">必备事项已完成</span>' : '必备事项未完成') + '</span></div>' +
        '<table class="desc detail-table"><thead><tr><th style="width:auto">事项名称</th><th>负责人</th><th>状态</th><th>完成时间</th><th>操作</th></tr></thead><tbody>' + rows + '</tbody></table>';
    }
    function detailOffer(p) {
      return '<table class="desc"><tbody>' +
        '<tr><th>Offer 编号</th><td>' + esc(p.offerNo) + '</td><th>Offer 发送人</th><td>' + personCell(p.offerer) + '</td></tr>' +
        '<tr><th>发送时间</th><td class="u-mono">' + esc(p.offerSent) + '</td><th>待入职部门</th><td>' + esc(p.dept) + '</td></tr>' +
        '<tr><th>职位</th><td>' + esc(p.position) + '</td><th> Offer 职级 / 入职职级</th><td>' + esc((p.offerLevel || '—') + ' / ' + (p.level || '—')) + '</td></tr>' +
        '<tr><th>职级差异</th><td>' + levelDiffTag(p.levelDiff) + '</td><th>计划入职日期</th><td class="u-mono">' + p.plan + '</td></tr>' +
        '<tr><th>雇佣关系</th><td>' + esc(p.employ) + '</td><th>招聘季度</th><td>' + esc(p.quarter) + '</td></tr>' +
        '</tbody></table><p class="muted" style="font-size:12px;margin:10px 0 0">Offer 信息只读引自招聘管理；变更需招聘侧重新确认。</p>';
    }
    function detailLogs(p) {
      var logs = (p.logs || []).slice();
      if (!logs.length) return '<div class="empty">暂无操作记录</div>';
      var rows = logs.map(function (l) {
        return '<tr><td>' + esc(l.time) + '</td><td>' + esc(l.type) + '</td><td>' + esc(l.op) + '</td><td style="white-space:normal">' + esc(l.note || '—') + '</td></tr>';
      }).join('');
      return '<table class="desc detail-table"><thead><tr><th style="width:150px">时间</th><th style="width:140px">操作类型</th><th style="width:110px">操作人</th><th style="width:auto">说明</th></tr></thead><tbody>' + rows + '</tbody></table>';
    }
    function detailBlockers(p) {
      var list = blockers(p);
      if (p.onboarded || p.arrival === '未到岗' || !list.length) return '';
      return '<div class="blocker"><b>暂不能确认入职</b><ul>' + list.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul></div>';
    }
    function renderDetail() {
      var p = byId(currentId);
      if (!p) { location.hash = 'list'; return; }
      var tabs = [['collection', '信息采集'], ['materials', '入职材料'], ['preps', '入职准备'], ['offer', 'Offer 信息'], ['logs', '操作记录']];
      var body = detailTab === 'collection' ? detailCollection(p)
        : detailTab === 'materials' ? detailMaterials(p)
        : detailTab === 'preps' ? detailPreps(p)
        : detailTab === 'offer' ? detailOffer(p) : detailLogs(p);
      var joinedTag = p.arrival === '未到岗' ? tag('未到岗（爽约）', 'danger') : p.onboarded ? tag('已入职', 'success') : tag('待入职', 'primary');
      var actionBar = '<div class="bottom-bar">';
      if (p.arrival === '未到岗') {
        actionBar += '<span class="muted" style="font-size:13px;align-self:center">已标记未到岗（爽约），记录只读；招聘侧 Offer 已关闭并释放职位名额</span>';
      } else if (!p.onboarded) {
        actionBar += '<button class="btn" type="button" data-d-action="remind">提醒必备事项</button>';
        actionBar += '<button class="btn" type="button" data-d-action="reschedule">改期入职</button>';
        var ok = eligible(p);
        actionBar += '<button class="btn btn-primary" type="button" data-d-action="confirm"' + (ok ? '' : ' disabled title="' + esc(blockers(p).join('；')) + '"') + '>确认入职</button>';
        if (p.plan < TODAY) actionBar += '<button class="btn" type="button" data-d-action="noshow">标记未到岗</button>';
      } else {
        actionBar += '<span class="muted" style="font-size:13px;align-self:center">已入职，信息采集、材料与准备事项只读；员工档案工号 ' + esc(p.empNo || '—') + '</span>';
      }
      actionBar += '</div>';
      $('viewDetail').innerHTML =
        '<div class="detail-head"><a class="back" href="#list">‹ 返回列表</a><div class="muted" style="font-size:12px">入职单 ' + esc(p.id) + '</div></div>' +
        '<div class="detail-title" style="margin-bottom:12px"><h1>' + esc(p.name) + '</h1>' + joinedTag + (p.onboarded ? '' : '<span class="muted">计划入职 ' + p.plan + '</span>') + '</div>' +
        '<section class="card overview"><div class="ov-avatar">' + esc(p.name.charAt(0)) + '</div><div class="ov-main">' +
          '<div class="ov-name">' + esc(p.name) + ' ' + statusTag(p.status) + ' ' + materialTag(materialSummary(p)) + '</div>' +
          '<div class="ov-meta">' +
            '<div><span>待入职部门</span><br><b>' + esc(p.dept) + '</b></div>' +
            '<div><span>职位 / 职级</span><br><b>' + esc(p.position) + ' / ' + esc(p.level || '—') + '</b></div>' +
            '<div><span>雇佣关系</span><br><b>' + esc(p.employ) + '</b></div>' +
            '<div><span>计划入职日期</span><br><b class="u-mono">' + p.plan + '</b></div>' +
            '<div><span>实际入职日期</span><br><b class="u-mono">' + (p.actual || '—') + '</b></div>' +
            '<div><span>招聘负责人 / 招聘HR</span><br><b>' + personCell(p.recruiter) + ' / ' + personCell(p.hr) + '</b></div>' +
            '<div><span>招聘季度</span><br><b>' + esc(p.quarter) + '</b></div>' +
            '<div><span>到岗结果</span><br><b>' + arrivalTag(p.arrival) + '</b></div>' +
            '<div><span>职级差异</span><br><b>' + levelDiffTag(p.levelDiff) + '</b></div>' +
            '<div><span>Offer 发送人</span><br><b>' + personCell(p.offerer) + '</b></div>' +
            '<div><span>入职准备进度</span><br><b>' + prepCell(p) + '</b></div>' +
            (p.arrival === '未到岗' ? '<div><span>爽约原因 / 确认时间</span><br><b>' + esc((p.noShowReason || '—') + ' / ' + (p.noShowAt || '—')) + '</b></div>' : '') +
          '</div></div></section>' +
        '<section class="card">' +
          '<div class="detail-tabs">' + tabs.map(function (t) { return '<button class="dtab' + (detailTab === t[0] ? ' is-active' : '') + '" type="button" data-dtab="' + t[0] + '">' + t[1] + '</button>'; }).join('') + '</div>' +
          '<div class="panel-body">' + detailBlockers(p) + body + '</div>' +
          actionBar +
        '</section>';
    }

    function bindDetail() {
      $('viewDetail').addEventListener('click', function (e) {
        var dtab = e.target.closest('[data-dtab]');
        if (dtab) { detailTab = dtab.dataset.dtab; previewIndex = -1; renderDetail(); return; }
        var action = e.target.closest('[data-d-action]');
        if (action) {
          var p = byId(currentId);
          var type = action.dataset.dAction;
          if (type === 'send') {
            p.collection = '已发送'; p.sentAt = nowText();
            log(p, '发送采集', '采集链接已发送至候选人');
            toast('采集已发送');
            renderDetail();
          } else if (type === 'return') {
            var reason = window.prompt('请填写退回原因');
            if (reason == null) return;
            if (!reason.trim()) { toast('退回原因不能为空', true); return; }
            p.collection = '已发送'; p.collect = null;
            log(p, '退回采集', '原因：' + reason.trim());
            toast('已退回，状态回到已发送');
            renderDetail();
          } else if (type === 'remind') {
            remind([p.id]);
          } else if (type === 'reschedule') {
            openReschedule([p.id]);
          } else if (type === 'confirm') {
            confirmOnboarding(p.id);
          } else if (type === 'noshow') {
            openNoShow([p.id]);
          }
          return;
        }
        var matPreview = e.target.closest('[data-mat-preview]');
        if (matPreview) {
          previewIndex = Number(matPreview.dataset.matPreview);
          renderDetail();
          return;
        }
        var matConfirm = e.target.closest('[data-mat-confirm]');
        if (matConfirm) {
          var m = byId(currentId).materials[Number(matConfirm.dataset.matConfirm)];
          m.state = '已确认'; m.confirmer = '当前用户'; m.confirmAt = TODAY;
          log(byId(currentId), '材料确认', '材料：' + m.name);
          toast('材料已确认');
          renderDetail();
          return;
        }
        var matReturn = e.target.closest('[data-mat-return]');
        if (matReturn) {
          var mr = byId(currentId).materials[Number(matReturn.dataset.matReturn)];
          var r = window.prompt('请填写材料退回原因（' + mr.name + '）');
          if (r == null) return;
          if (!r.trim()) { toast('退回原因不能为空', true); return; }
          mr.state = '已退回'; mr.backReason = r.trim();
          log(byId(currentId), '材料退回', '材料：' + mr.name + '，原因：' + r.trim());
          toast('材料已退回');
          renderDetail();
          return;
        }
        var prepBtn = e.target.closest('[data-prep]');
        if (prepBtn) {
          var it = byId(currentId).preps[Number(prepBtn.dataset.prep)];
          it.done = !it.done; it.doneAt = it.done ? TODAY : '';
          log(byId(currentId), it.done ? '准备完成' : '撤销准备', '事项：' + it.name);
          toast(it.done ? '已标记完成' : '已撤销完成');
          renderDetail();
        }
      });
    }

    /* ---------- 路由 ---------- */
    function route() {
      var hash = location.hash || '#list';
      if (hash.indexOf('#detail') === 0) {
        currentId = hash.split('/')[1] || 'OB20261123001';
        detailTab = 'collection';
        previewIndex = -1;
        renderDetail();
        $('viewList').hidden = true;
        $('viewDetail').hidden = false;
        window.scrollTo(0, 0);
      } else {
        currentId = null;
        $('viewDetail').hidden = true;
        $('viewList').hidden = false;
        renderList();
      }
    }

    /* ---------- 初始化 ---------- */
    initSelects();
    bindList();
    bindDetail();
    $('btnRescheduleClose').addEventListener('click', function () { closeReschedule(); });
    $('btnRescheduleCancel').addEventListener('click', function () { closeReschedule(); });
    $('btnRescheduleSubmit').addEventListener('click', submitReschedule);
    $('rescheduleMask').addEventListener('click', function (e) { if (e.target === $('rescheduleMask')) closeReschedule(); });
    $('btnNoShowClose').addEventListener('click', closeNoShow);
    $('btnNoShowCancel').addEventListener('click', closeNoShow);
    $('btnNoShowSubmit').addEventListener('click', submitNoShow);
    $('noShowMask').addEventListener('click', function (e) { if (e.target === $('noShowMask')) closeNoShow(); });
    window.addEventListener('hashchange', route);
    route();
  </script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="prototype-components" content="Button,BusyInput,PageableSelect,DatePicker,Tag,Checkbox,Popover,Table,Pagination,Message">
  <title>招聘需求管理 · 台账与详情</title>
  <!-- 静态 Mock：统计卡与需求台账、需求详情同文件，#list / #detail/{需求编号} 互联；新建需求校验编制缺额，支持关闭、导入与授权。 -->
  <style>
    :root{
      --primary:#2563eb; --primary-weak:#eff4ff; --primary-line:#bfd3ff;
      --bg:#f4f6fa; --panel:#fff; --line:#e5e8ef; --line-strong:#d3d9e4;
      --text:#1f2937; --muted:#6b7280; --subtle:#9aa3b2;
      --success:#15803d; --success-weak:#eaf7ef; --warn:#b45309; --warn-weak:#fff7e6;
      --danger:#b91c1c; --danger-weak:#fdecec;
      --radius:10px; --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.08);
    }
    *{box-sizing:border-box}
    [hidden]{display:none!important}
    body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    body.no-scroll{overflow:hidden}
    button,input,select,textarea{font:inherit;color:inherit}
    a{color:var(--primary);text-decoration:none}
    .topbar{display:flex;align-items:center;gap:12px;height:52px;padding:0 24px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
    .topbar .brand{display:flex;align-items:center;gap:8px;font-weight:600}
    .brand-dot{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,#f97316,#ef4444);display:inline-block}
    .topbar .crumb{color:var(--subtle);font-size:13px}
    .topbar .spacer{flex:1;color:var(--subtle);font-size:12px}
    .user{display:flex;align-items:center;gap:8px;font-size:13px}
    .avatar{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:var(--primary-weak);color:var(--primary);font-size:12px;flex:none}
    .page{max-width:1440px;margin:0 auto;padding:20px 24px 72px}
    .page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:14px}
    .page-head h1{margin:0;font-size:20px;line-height:1.5;display:flex;align-items:center;gap:10px}
    .title-icon{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:8px;background:var(--primary);color:#fff;font-size:15px}
    .page-sub{margin:2px 0 0;color:var(--muted);font-size:13px}
    .actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
    .btn{height:34px;padding:0 14px;border-radius:8px;border:1px solid var(--line-strong);background:#fff;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
    .btn:hover{border-color:#b9c2d2}
    .btn-primary{background:var(--primary);border-color:var(--primary);color:#fff}
    .btn-primary:hover{background:#1d4ed8;border-color:#1d4ed8}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    .btn-sm{height:28px;padding:0 10px;font-size:13px}
    .btn-link{border:0;background:none;color:var(--primary);padding:0 2px;height:auto;cursor:pointer;font-size:13px}
    .btn-link.danger{color:var(--danger)}
    .btn-link.muted{color:#c3c8d1;cursor:not-allowed}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
    .stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:14px}
    .stat{padding:16px 18px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);cursor:pointer;position:relative}
    .stat:hover{border-color:var(--primary-line)}
    .stat .lab{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:4px}
    .stat .lab::before{content:"";width:3px;height:12px;border-radius:2px;background:var(--primary);display:inline-block}
    .stat .val{font-size:28px;font-weight:600;line-height:1.2;margin-top:6px;font-variant-numeric:tabular-nums}
    .stat .hint{font-size:12px;color:var(--subtle);margin-top:2px}
    .filter-card{padding:14px 16px;margin-bottom:12px;position:relative}
    .filter-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .field{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);white-space:nowrap}
    .field input,.field select{height:32px;min-width:120px;padding:0 10px;border:1px solid var(--line-strong);border-radius:8px;background:#fff;color:var(--text)}
    .field input[type=date]{min-width:136px}
    .adv-toggle{color:var(--primary);border:0;background:none;cursor:pointer;padding:0;height:32px}
    .adv-badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;margin-left:4px;border-radius:999px;background:var(--primary-weak);color:#1e40af;font-size:11px;border:1px solid var(--primary-line)}
    .clear-link{border:0;background:none;color:var(--primary);cursor:pointer;height:32px}
    .adv-panel{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);display:flex;gap:10px;flex-wrap:wrap}
    .pop{position:absolute;z-index:40;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(16,24,40,.14);padding:10px;min-width:190px}
    .pop label{display:flex;align-items:center;gap:8px;padding:6px 6px;border-radius:6px;font-size:13px;color:var(--text);cursor:pointer}
    .pop label:hover{background:#f5f7fb}
    .pop .pop-title{font-size:12px;color:var(--subtle);padding:2px 6px 6px}
    .table-card{padding:0}
    .tabs{display:flex;gap:4px;padding:10px 14px 0;border-bottom:1px solid var(--line)}
    .tab-btn{border:0;background:transparent;padding:8px 12px;font-size:14px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
    .tab-btn.is-on{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
    .tab-btn .cnt{font-size:12px;color:var(--subtle);margin-left:4px}
    .table-toolbar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);min-height:44px;flex-wrap:wrap}
    .table-toolbar .hint{color:var(--muted);font-size:13px}
    .batch{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted)}
    .batch b{color:var(--text)}
    .gear{margin-left:auto;border:0;background:none;cursor:pointer;font-size:16px;color:var(--muted);padding:4px 6px;border-radius:6px;position:relative}
    .gear:hover{background:#f3f5f9}
    .cols-pop{right:0;top:38px;min-width:220px;max-height:320px;overflow:auto}
    .table-wrap{overflow:auto}
    table{border-collapse:collapse;width:100%;min-width:1180px}
    th,td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle;white-space:nowrap}
    th.col-ops,td.col-ops{position:sticky;right:0;background:#fff;box-shadow:-8px 0 10px -8px rgba(16,24,40,.28);z-index:1}
    thead th.col-ops{background:#fafbfd}
    tbody tr:hover td.col-ops{background:#fbfcfe}
    th{background:#fafbfd;color:var(--muted);font-weight:500}
    tbody tr:hover{background:#fafcff}
    td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
    td.name{min-width:210px;white-space:normal}
    td.name .warn-tag{margin-left:6px}
    .person{display:inline-flex;align-items:center;gap:6px}
    .tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:5px;font-size:12px;border:1px solid transparent;white-space:nowrap}
    .tag-primary{color:#1e40af;background:var(--primary-weak);border-color:var(--primary-line)}
    .tag-success{color:var(--success);background:var(--success-weak);border-color:#bfe3cc}
    .tag-warn{color:var(--warn);background:var(--warn-weak);border-color:#f5d9a8}
    .tag-danger{color:var(--danger);background:var(--danger-weak);border-color:#f3c6c6}
    .tag-neutral{color:var(--muted);background:#f3f4f6;border-color:#e5e7eb}
    .date-warn{color:var(--danger)}
    .row-actions{display:flex;gap:8px;align-items:center}
    .inline-edit td{background:#f8fbff;white-space:normal}
    .inline-edit .form-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    .inline-edit label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px}
    .inline-edit select,.inline-edit input{height:30px;border:1px solid var(--line-strong);border-radius:6px;padding:0 8px;background:#fff;font-size:12px}
    .pager{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;color:var(--muted);font-size:13px;flex-wrap:wrap;gap:8px}
    .pages{display:flex;gap:6px;align-items:center}
    .page-btn{min-width:30px;height:30px;border:1px solid var(--line-strong);background:#fff;border-radius:7px;cursor:pointer;color:var(--text);padding:0 8px}
    .page-btn:disabled{opacity:.45;cursor:not-allowed}
    .page-btn.is-active{background:var(--primary);border-color:var(--primary);color:#fff}
    .empty{padding:64px 20px;text-align:center;color:var(--subtle)}
    .empty .art{width:88px;height:64px;margin:0 auto 12px;border-radius:10px;background:linear-gradient(180deg,#eef2f8,#e2e8f2);position:relative}
    .empty .art::after{content:"";position:absolute;left:18px;right:18px;bottom:12px;height:6px;border-radius:3px;background:#cbd5e1}
    .overlay{position:fixed;inset:0;background:rgba(17,24,39,.42);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:48px 16px;overflow:auto}
    .modal{background:#fff;border-radius:12px;box-shadow:0 24px 64px rgba(16,24,40,.28);width:min(720px,100%);padding:0}
    .modal.wide{width:min(860px,100%)}
    .modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
    .modal-head h3{margin:0;font-size:16px}
    .modal-body{padding:18px 20px;max-height:calc(100vh - 220px);overflow:auto}
    .modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line);background:#fcfdff;border-radius:0 0 12px 12px}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
    .form-item{display:flex;flex-direction:column;gap:6px}
    .form-item.full{grid-column:1/-1}
    .form-item label{font-size:13px;color:var(--muted)}
    .form-item label b{color:var(--danger);margin-left:2px}
    .form-item input,.form-item select,.form-item textarea{width:100%;height:34px;padding:0 10px;border:1px solid var(--line-strong);border-radius:8px;background:#fff}
    .form-item textarea{height:84px;padding:8px 10px;resize:vertical}
    .form-item .tip{font-size:12px;color:var(--subtle)}
    .quota-box{border:1px solid var(--line);background:#fafbfd;border-radius:10px;padding:12px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px 14px;font-size:13px}
    .quota-box .k{color:var(--muted);font-size:12px}
    .quota-box .v{font-weight:600;font-variant-numeric:tabular-nums}
    .quota-box .v.hl{color:var(--primary)}
    .form-error{color:var(--danger);font-size:12px;min-height:18px}
    .checkline{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--text)}
    .checkline input{margin-top:3px}
    .detail-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:14px}
    .detail-title{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .detail-title h1{margin:0;font-size:20px}
    .grid-2{display:grid;grid-template-columns:1.6fr 1fr;gap:14px}
    .panel{padding:16px 18px}
    .panel h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px}
    .panel h3::before{content:"";width:3px;height:14px;border-radius:2px;background:var(--primary)}
    .kv{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 18px;font-size:13px}
    .kv .k{color:var(--muted);font-size:12px}
    .kv .v{color:var(--text);word-break:break-all}
    .progress-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
    .pcard{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:#fff}
    .pcard .k{font-size:12px;color:var(--muted)}
    .pcard .v{font-size:22px;font-weight:600;margin-top:2px}
    .pcard .v small{font-size:13px;color:var(--subtle);font-weight:400}
    .bar{height:8px;border-radius:999px;background:#eef1f6;overflow:hidden}
    .bar span{display:block;height:100%;border-radius:999px;background:var(--primary)}
    .funnel{display:flex;flex-direction:column;gap:10px}
    .frow{display:grid;grid-template-columns:88px 1fr 60px;gap:10px;align-items:center;font-size:12px;color:var(--muted)}
    .frow .fbar{height:16px;background:#f1f4f9;border-radius:4px;overflow:hidden}
    .frow .fbar span{display:block;height:100%;background:linear-gradient(90deg,#93b4f7,#2563eb);border-radius:4px}
    .frow b{color:var(--text);text-align:right;font-variant-numeric:tabular-nums}
    .mini-table{width:100%;border-collapse:collapse;min-width:0}
    .mini-table th,.mini-table td{padding:8px 10px;font-size:12px;white-space:nowrap;min-width:0}
    .auth-list{display:flex;flex-direction:column;gap:8px}
    .auth-row{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px}
    .auth-row .meta{color:var(--subtle);font-size:12px}
    .auth-row .grow{flex:1}
    .timeline{list-style:none;margin:0;padding:0 0 0 16px;border-left:2px solid var(--line)}
    .timeline li{position:relative;padding:0 0 14px 12px;font-size:13px}
    .timeline li::before{content:"";position:absolute;left:-21px;top:6px;width:8px;height:8px;border-radius:50%;background:#fff;border:2px solid var(--primary)}
    .timeline .t{color:var(--subtle);font-size:12px}
    .toast-host{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center}
    .toast{background:#111827;color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
    .toast.err{background:#991b1b}
    .muted{color:var(--subtle)}
    .nowrap{white-space:nowrap}
    .block-list{border:1px solid #f3c6c6;background:var(--danger-weak);border-radius:8px;padding:10px 12px;font-size:13px;color:#7f1d1d;margin-bottom:12px}
    .block-list ul{margin:6px 0 0;padding-left:18px}
    .import-drop{border:1px dashed var(--line-strong);border-radius:10px;padding:22px;text-align:center;color:var(--muted);background:#fafbfd}
    .import-result{margin-top:12px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13px}
    .import-result .row{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
    .import-result .row.fail{color:var(--danger)}
    .people{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:10px 12px}
    .people label{display:flex;align-items:center;gap:8px;font-size:13px;padding:4px 0}
    @media (max-width:1180px){
      .stats{grid-template-columns:repeat(3,1fr)}
      .grid-2{grid-template-columns:1fr}
      .kv{grid-template-columns:repeat(2,1fr)}
      .quota-box{grid-template-columns:repeat(3,1fr)}
    }
    @media (max-width:760px){
      .page{padding:14px 12px 60px}
      .stats{grid-template-columns:repeat(2,1fr)}
      .stat .val{font-size:24px}
      .progress-cards{grid-template-columns:repeat(2,1fr)}
      .form-grid{grid-template-columns:1fr}
      .quota-box{grid-template-columns:repeat(2,1fr)}
      .kv{grid-template-columns:1fr}
      .page-head{flex-direction:column}
      .actions{justify-content:flex-start}
      .topbar .crumb{display:none}
      .modal-body{max-height:calc(100vh - 180px)}
    }
  </style>
</head>
<body>
  <div class="topbar">
    <span class="brand"><span class="brand-dot"></span>示例集团</span>
    <span class="crumb">人资管理 / HR管理 / 招聘管理 / 招聘需求管理</span>
    <span class="spacer">2026-11-23 周一</span>
    <span class="user"><span class="avatar">王</span>王亮</span>
  </div>

  <div class="page" id="viewList">
    <div class="page-head">
      <div>
        <h1><span class="title-icon">需</span>招聘需求</h1>
        <p class="page-sub">需求来源于编制缺额，提交审批即冻结缺额；入职确认后回写到岗与编制</p>
      </div>
      <div class="actions">
        <button class="btn btn-primary" type="button" id="btnNew">新建需求</button>
        <button class="btn" type="button" id="btnCloseTop" disabled>关闭需求</button>
        <button class="btn" type="button" id="btnImport">批量导入</button>
        <button class="btn" type="button" id="btnAuth">批量授权</button>
      </div>
    </div>

    <div class="stats" id="stats">
      <div class="stat" data-scope="mine"><div class="lab">我的招聘需求</div><div class="val" id="stMine">0</div><div class="hint">我负责、我审批或被授权</div></div>
      <div class="stat" data-scope="all"><div class="lab">全部招聘需求</div><div class="val" id="stAll">0</div><div class="hint">数据权限范围内全部需求</div></div>
      <div class="stat" data-status="已完成"><div class="lab">已完成</div><div class="val" id="stDone">0</div><div class="hint">已到岗人数达到需求人数</div></div>
      <div class="stat" data-status="进行中"><div class="lab">进行中</div><div class="val" id="stRunning">0</div><div class="hint">待审批 + 招聘中</div></div>
      <div class="stat" data-status="已关闭"><div class="lab">已关闭的招聘需求</div><div class="val" id="stClosed">0</div><div class="hint">关闭为终态，不可恢复</div></div>
    </div>

    <section class="card filter-card" aria-label="筛选">
      <div class="filter-row">
        <label class="field">需求名称 <input id="fName" placeholder="输入需求名称" style="width:190px"></label>
        <label class="field">招聘季度 <select id="fQuarter"></select></label>
        <label class="field">岗位类别 <select id="fCategory"></select></label>
        <label class="field">招聘原因 <select id="fReason"></select></label>
        <label class="field">需求一级组织 <select id="fOrg1"></select></label>
        <label class="field">需求二级组织 <select id="fOrg2"></select></label>
        <label class="field">业务终面人 <select id="fFinal"></select></label>
        <button class="adv-toggle" type="button" id="btnAdv" aria-expanded="false">高级筛选<span class="adv-badge" id="advBadge" hidden>0</span></button>
        <button class="clear-link" type="button" id="btnClear">清空已选</button>
      </div>
      <div class="adv-panel" id="advPanel" hidden>
        <div class="field" style="position:relative">
          <button class="btn btn-sm" type="button" id="btnStatusPop" aria-haspopup="true" aria-expanded="false">需求状态：<span id="statusText" class="muted">全部</span> ▾</button>
          <div class="pop" id="statusPop" hidden style="top:38px;left:0">
            <div class="pop-title">多选需求状态</div>
            <div id="statusOpts"></div>
          </div>
        </div>
        <label class="field">招聘负责人 <select id="fOwner"></select></label>
        <label class="field">岗位族 <select id="fFamily"></select></label>
        <label class="field">需求对接人 <select id="fRequester"></select></label>
        <label class="field">预警状态 <select id="fAlert"><option value="">全部</option><option value="需升级">需升级</option><option value="需关注">需关注</option><option value="正常">正常</option></select></label>
        <label class="field">期望到岗日期 <span class="nowrap"><input type="date" id="fDueFrom"> ~ <input type="date" id="fDueTo"></span></label>
        <label class="field">是否超期 <select id="fOverdue"><option value="">全部</option><option value="1">是</option><option value="0">否</option></select></label>
        <label class="field">需求警示 <select id="fWarn"><option value="">全部</option><option value="超编需求">超编需求</option><option value="编制变更待处理">编制变更待处理</option></select></label>
      </div>
    </section>

    <section class="card table-card" aria-label="招聘需求台账">
      <div class="tabs" id="typeTabs">
        <button class="tab-btn is-on" type="button" data-type="all">全部需求 <span class="cnt" id="tabAll">0</span></button>
        <button class="tab-btn" type="button" data-type="formal">正式需求 <span class="cnt" id="tabFormal">0</span></button>
        <button class="tab-btn" type="button" data-type="outsource">外包需求 <span class="cnt" id="tabOutsource">0</span></button>
      </div>
      <div class="table-toolbar">
        <div class="batch" id="batchBar" hidden>
          已选 <b id="selCount">0</b> 条
          <button class="btn-link" type="button" id="btnCloseBatch">关闭需求</button>

    function eligibleQuotaRows() {
      return QUOTA.filter(function (q) { return available(q) > 0; });
    }
    function uniquePush(arr, v) { if (v && arr.indexOf(v) < 0) arr.push(v); return arr; }
    function deptList() {
      var out = [];
      eligibleQuotaRows().forEach(function (q) { uniquePush(out, q.org2); });
      return out;
    }
    function groupPairs(dept) {
      var out = [];
      eligibleQuotaRows().forEach(function (q) {
        if (!q.org3) return;
        if (dept && q.org2 !== dept) return;
        uniquePush(out, q.org2 + '::' + q.org3);
      });
      return out;
    }
    function deptOptionsHtml() {
      return deptList().map(function (d) {
        return '<option value="' + esc(d) + '">' + esc(d) + '</option>';
      }).join('');
    }
    function groupOptionsHtml(dept) {
      var html = '<option value="">全部</option>';
      if (dept) {
        groupPairs(dept).forEach(function (v) {
          html += '<option value="' + esc(v) + '">' + esc(v.split('::')[1]) + '</option>';
        });
        return html;
      }
      deptList().forEach(function (d) {
        var pairs = groupPairs(d);
        if (!pairs.length) return;
        html += '<optgroup label="' + esc(d) + '">';
        pairs.forEach(function (v) {
          html += '<option value="' + esc(v) + '">' + esc(v.split('::')[1]) + '</option>';
        });
        html += '</optgroup>';
      });
      return html;
    }
    function quotaOptions(dept, group) {
      var groupDept = group ? group.split('::')[0] : '';
      var groupName = group ? group.split('::')[1] : '';
      return eligibleQuotaRows().filter(function (q) {
        if (dept && q.org2 !== dept) return false;
        if (group && (q.org2 !== groupDept || q.org3 !== groupName)) return false;
        return true;
      }).map(function (q) {
        return '<option value="' + q.id + '">' + esc(q.org1 + ' / ' + q.org2 + (q.org3 ? ' / ' + q.org3 : '') + ' · ' + q.position + ' · ' + q.level) + '</option>';
      }).join('');
    }
    function quotaInfo(q) {
      if (!q) return '<div class="muted" style="grid-column:1/-1">请选择编制明细行后查看缺额</div>';
      return '' +
        '<div><div class="k">组织路径</div><div class="v" style="font-weight:400">' + esc(q.org1 + ' / ' + q.org2 + (q.org3 ? ' / ' + q.org3 : '')) + '</div></div>' +

    function submitNew(status) {
      var q = quotaById($('nmQuota').value);
      var name = $('nmName').value.trim();
      var num = parseInt($('nmNum').value, 10);
      var over = $('nmOver').checked;
      $('errForm').textContent = '';
      $('errNum').textContent = '';
      if (!q) { $('errForm').textContent = '请先选择编制明细行'; return; }
      if (!name) { $('errForm').textContent = '请填写需求名称'; return; }
      if (!num || num < 1) { $('errForm').textContent = '需求人数须为正整数'; return; }
      var avail = available(q);
      if (num > avail && !over) { $('errNum').textContent = '超出可用缺额 ' + (num - avail) + ' 人，可勾选申请超编或调整人数'; return; }
      if (over && !$('nmOverReason').value.trim()) { $('errForm').textContent = '申请超编须填写超编原因'; return; }
      if (!$('nmDue').value) { $('errForm').textContent = '请选择期望到岗日期'; return; }
      var seq = String(DEMANDS.length + 1).padStart(3, '0');
      var d = {
        id: 'RQ20261123' + seq, name: name, org1: q.org1, org2: q.org2, org3: q.org3, position: q.position, level: q.level, cat: q.cat,
        employ: q.employ, loc: q.loc, reason: $('nmReason').value, num: num, arrived: 0, sent: 0, accepted: 0,
        status: status, warning: over ? '超编需求' : '无', due: $('nmDue').value, final: $('nmFinal').value, owner: $('nmOwner').value,
        priority: $('nmPriority').value, quotaId: q.id, created: TODAY, approvedAt: '', closedAt: '', blockers: 0, authorized: [],
        jobs: [], funnel: { resume: 0, screened: 0, interviewing: 0, offer: 0, accepted: 0, joined: 0 },
        logs: [{ t: TODAY + ' 16:20', who: ME, op: status === '草稿' ? '创建' : '提交审批', note: status === '草稿' ? '草稿' : ('需求人数 ' + num + (over ? '（超编申请）' : '')) }]
      };
      hydrateDemand(d);
      d.progress = '新需求，待启动';
      d.alert = computeAlert(d);
      DEMANDS.unshift(d);
      if (status !== '草稿') q.occupied += num;
      closeOverlay();
      render();
      toast(status === '草稿' ? '已保存草稿' : (over ? '已提交超编审批' : '已提交审批'));
    }

        });
      });
      $('fName').addEventListener('input', function () { state.name = this.value.trim(); state.page = 1; renderTable(); });
      [['fQuarter', 'quarter'], ['fCategory', 'category'], ['fFamily', 'family'], ['fRequester', 'requester'], ['fAlert', 'alert'], ['fReason', 'reason'], ['fOrg1', 'org1'], ['fFinal', 'final'], ['fOrg2', 'org2'], ['fOwner', 'owner'], ['fOverdue', 'overdue'], ['fWarn', 'warn'], ['fDueFrom', 'dueFrom'], ['fDueTo', 'dueTo']].forEach(function (pair) {
        $(pair[0]).addEventListener('change', function () { state[pair[1]] = this.value; state.page = 1; render(); });
      });
      $('btnClear').addEventListener('click', function () {
        state.name = ''; state.reason = ''; state.org1 = ''; state.final = ''; state.org2 = ''; state.owner = '';
        state.quarter = ''; state.category = ''; state.family = ''; state.requester = ''; state.alert = '';
        state.dueFrom = ''; state.dueTo = ''; state.overdue = ''; state.warn = ''; state.statuses = []; state.type = 'all'; scope = 'all';
        $('fName').value = ''; ['fQuarter', 'fCategory', 'fFamily', 'fRequester', 'fAlert', 'fReason', 'fOrg1', 'fFinal', 'fOrg2', 'fOwner', 'fOverdue', 'fWarn', 'fDueFrom', 'fDueTo'].forEach(function (id) { $(id).value = ''; });
        Array.prototype.forEach.call($('statusOpts').querySelectorAll('input'), function (cb) { cb.checked = false; });
        updateStatusText();
        state.page = 1;
        render();
      });
      $('stats').addEventListener('click', function (e) {
        var card = e.target.closest('.stat');
        if (!card) return;
        var st = card.getAttribute('data-status');
        var sc = card.getAttribute('data-scope');
        if (sc) { scope = sc; state.statuses = []; }
        else if (st === '进行中') { scope = 'all'; state.statuses = ['待审批', '招聘中']; }
        else { scope = 'all'; state.statuses = [st]; }
        Array.prototype.forEach.call($('statusOpts').querySelectorAll('input'), function (cb) { cb.checked = state.statuses.indexOf(cb.value) >= 0; });
        updateStatusText();
        $('advPanel').hidden = false;
        $('btnAdv').setAttribute('aria-expanded', 'true');
        state.page = 1;
        render();
      });
      $('btnGear').addEventListener('click', function (e) {
        e.stopPropagation();
        $('colsPop').hidden = !$('colsPop').hidden;
        if (!$('colsPop').hidden) renderCols();
      });
      $('btnColsReset').addEventListener('click', function () { visibleCols = defaultCols(); renderCols(); renderTable(); });
      $('overlay').addEventListener('click', function (e) { if (e.target === $('overlay')) closeOverlay(); });
      document.addEventListener('click', function (e) {
        if (!e.target.closest('#statusPop') && !e.target.closest('#btnStatusPop')) $('statusPop').hidden = true;
        if (!e.target.closest('#colsPop') && !e.target.closest('#btnGear')) $('colsPop').hidden = true;
      });
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('overlay').hidden) closeOverlay(); });
    }

    fillSelects();
    bindListEvents();
    window.addEventListener('hashchange', route);
    $('btnCloseTop').disabled = true;
    $('btnAuth').disabled = true;
    route();
  </script>
</body>
</html>

function toMin(t){ var p = t.split(':'); return parseInt(p[0], 10) * 60 + parseInt(p[1], 10); }
function findConflict(date, time, duration, names, excludeId){
  var s = toMin(time), e = s + duration, hit = null;
  DB.interviews.some(function(iv){
    if (iv.id === excludeId || iv.status === '已取消' || iv.date !== date) { return false; }
    var s2 = toMin(iv.time), e2 = s2 + iv.duration;
    if (!(s < e2 && s2 < e)) { return false; }
    var dup = iv.interviewers.filter(function(n){ return names.indexOf(n) > -1; });
    if (!dup.length) { return false; }
    hit = { interview: iv, names: dup };
    return true;
  });
  return hit;
}

var ROUTES = [
  { re: /^\/workbench$/, title: '招聘工作台', render: renderWorkbench },
  { re: /^\/schedule$/, title: '招聘日程', render: renderSchedule, action: { text: '面试列表', act: 'go-interviews' } },
  { re: /^\/interviews$/, title: '面试', render: renderInterviews, action: { text: '安排', act: 'int-new' } },
  { re: /^\/interviews\/new(?:\/([\w-]+))?$/, title: '安排面试', render: renderInterviewForm },
  { re: /^\/interview\/([\w-]+)\/evaluate$/, title: '面试评价', render: renderEvaluate },
  { re: /^\/interview\/([\w-]+)$/, title: '面试详情', render: renderInterviewDetail },
  { re: /^\/candidates$/, title: '应聘者', render: renderCandidates },
  { re: /^\/candidate\/([\w-]+)$/, title: '应聘者详情', render: renderCandidate },
  { re: /^\/positions$/, title: '职位', render: renderPositions, action: { text: '新建', act: 'pos-new' } },
  { re: /^\/position\/([\w-]+)$/, title: '职位详情', render: renderPosition },
  { re: /^\/offers$/, title: 'Offer', render: renderOffers, action: { text: '发起', act: 'offer-new' } },
  { re: /^\/offer\/([\w-]+)$/, title: 'Offer 详情', render: renderOffer },
  { re: /^\/ledger$/, title: '招聘台账', render: renderLedger, action: { text: '导出', act: 'lg-export' } }
];

function render(){
  var path = hashPath(), match = null, params = [];
  for (var i = 0; i < ROUTES.length; i++) {
    var mm = path.match(ROUTES[i].re);
    if (mm) { match = ROUTES[i]; params = mm.slice(1); break; }
  }
  if (!match) { NAV.stack = ['/workbench']; location.hash = '#/workbench'; return; }
  navTitle.textContent = match.title;
  btnBack.hidden = (path === '/workbench' || match === ROUTES[0]);
  if (match.action) {
    navAction.hidden = false;
    navAction.textContent = match.action.text;
    navAction.setAttribute('data-act', match.action.act);
  } else {
    navAction.hidden = true;
    navAction.removeAttribute('data-act');
  }
  state.formDirty = false;
  app.innerHTML = match.render.apply(null, params);
  app.scrollTop = 0;
  closeSheet();
}

window.addEventListener('hashchange', function(){
  var p = hashPath();
  if (p !== NAV.stack[NAV.stack.length - 1]) { NAV.stack.push(p); }

});

ACTIONS['pos-go'] = function(el){ go('/position/' + el.getAttribute('data-id')); };
ACTIONS['pos-edit'] = function(){ toast('请至 Web 端处理'); };
ACTIONS['pos-toggle'] = function(){
  var p = byPos(state.currentPosId);
  var next = p.status === '在招' ? '暂停' : '在招';
  openConfirm({ title: next === '暂停' ? '暂停在招' : '恢复在招', message: next === '暂停' ? '暂停后不再接收新简历与发起新面试，在途流程可继续。' : '恢复后重新接收简历。', okText: '确认' + next, danger: next === '暂停', onOk:function(){
    p.status = next;
    p.logs.unshift('2026-11-23 张勇 ' + next + '在招');
    toast('已' + next + (next === '暂停' ? '' : '在招'));
    render();
  }});
};
ACTIONS['offer-tab'] = function(el){ state.offerTab = el.getAttribute('data-tab'); render(); };
ACTIONS['offer-status'] = function(el){ state.offerStatus = el.getAttribute('data-status'); render(); };
ACTIONS['offer-go'] = function(el){ go('/offer/' + el.getAttribute('data-id')); };
ACTIONS['offer-approve'] = function(el){
  var o = byOffer(el.getAttribute('data-id'));
  openConfirm({ title:'审批通过', message:'通过后进入待发送，由招聘负责人或 HRBP 发送。', okText:'通过', onOk:function(){
    o.status = '待发送'; o.node = '已完成';
    o.chain.forEach(function(n){ if (n.state === '审批中') { n.state = '已通过'; n.time = '11-23 15:40'; } });
    toast('审批已通过'); render();
  }});
};
ACTIONS['offer-reject'] = function(el){
  var o = byOffer(el.getAttribute('data-id'));
  openReasonSheet({ title:'驳回 Offer', label:'驳回原因', options:['薪资超带宽','职级不一致','签字费待确认','其他'], okText:'确认驳回', onOk:function(sel){
    o.status = '待发起'; o.node = '—';
    o.chain.forEach(function(n){ if (n.state === '审批中') { n.state = '已驳回'; n.comment = sel; } });
    toast('已驳回'); render();
  }});
};
ACTIONS['offer-withdraw'] = function(el){
  var o = byOffer(el.getAttribute('data-id'));
  openConfirm({ title:'撤回 Offer', message:'撤回后内容保留，可修改后重新提交。', okText:'撤回', onOk:function(){
    o.status = '待发起'; o.node = '—'; toast('已撤回'); render();
  }});
};
ACTIONS['offer-send'] = function(el){
  var o = byOffer(el.getAttribute('data-id'));
  openSheet('发送 Offer', '<div class="form"><label class="switch"><input type="checkbox" id="chSms" checked>短信</label><label class="switch"><input type="checkbox" id="chMail" checked>邮件</label><label class="switch"><input type="checkbox" id="chInbox">站内信</label><button class="btn btn--primary btn--block" type="button" id="sendOk">确认发送</button></div>');
  document.getElementById('sendOk').onclick = function(){
    if (!document.getElementById('chSms').checked && !document.getElementById('chMail').checked && !document.getElementById('chInbox').checked) { toast('请选择送达渠道'); return; }
    o.status = '已发送'; o.sentAt = '2026-11-23 15:45'; o.node = '已完成';
    closeSheet(); toast('Offer 已发送，有效期至 2026-11-30'); render();
  };
};
ACTIONS['offer-close'] = function(el){
  var o = byOffer(el.getAttribute('data-id'));
  var extra = o.status === '已接受' ? '关闭后将取消对应入职单。' : '';
  openReasonSheet({ title:'关闭 Offer', label:'关闭原因', options:['候选人接受其他 Offer','需求调整','薪资未达成','其他'], okText:'确认关闭', onOk:function(sel){
    o.status = '已关闭'; o.note = (sel + ' ' + extra).trim();
    toast('Offer 已关闭'); render();
  }});
};
ACTIONS['lg-filter-open'] = function(){
  var f = state.ledgerFilter || {};
  var hrs = ['全部'];
  DB.ledger.forEach(function(r){ if (hrs.indexOf(r.hr) < 0) hrs.push(r.hr); });
  openSheet('筛选台账', '<div class="form">'
    + '<div class="form__row"><span class="form__label">招聘季度</span><select class="input" id="lfQuarter">' + opt(['全部','2026Q3','2026Q4','2027Q1'], f.quarter || '全部') + '</select></div>'
    + '<div class="form__row"><span class="form__label">招聘HR</span><select class="input" id="lfHr">' + opt(hrs, f.hr || '全部') + '</select></div>'
    + '<div class="form__row"><span class="form__label">状态</span><select class="input" id="lfStatus">' + opt(['全部','审批中','待发送','已发送','已入职','未发起','已放弃','已拒绝'], f.status || '全部') + '</select></div>'
    + '<div class="form__row"><span class="form__label">岗位类别</span><select class="input" id="lfCategory">' + opt(['全部','关键岗位','S1类岗位','S2类岗位','A类岗位'], f.category || '全部') + '</select></div>'
    + '<div class="form__row"><span class="form__label">放弃原因</span><select class="input" id="lfReason">' + opt(['全部','选择其他平台','薪酬待遇不满足','地理位置','转正周期过长','家里有事','其他'], f.reason || '全部') + '</select></div>'
    + '<div style="display:flex;gap:8px"><button class="btn btn--block" type="button" id="lfClear">重置</button><button class="btn btn--primary btn--block" type="button" id="lfOk">确定</button></div></div>');
  document.getElementById('lfClear').onclick = function(){ state.ledgerFilter = {}; closeSheet(); render(); };
  document.getElementById('lfOk').onclick = function(){
    var map = { quarter:'lfQuarter', hr:'lfHr', status:'lfStatus', category:'lfCategory', reason:'lfReason' };
    var next = {};
    Object.keys(map).forEach(function(k){ var v = document.getElementById(map[k]).value; if (v !== '全部') { next[k] = v; } });
    state.ledgerFilter = next; closeSheet(); render();
  };
};
ACTIONS['lg-filter-clear'] = function(){ state.ledgerFilter = {}; render(); };
ACTIONS['lg-go'] = function(el){
  var name = el.getAttribute('data-name');
  var c = DB.candidates.filter(function(x){ return x.name === name; })[0];
  if (c) { go('/candidate/' + c.id); } else { toast('该候选人仅台账留存'); }
};

render();
})();
</script>
</body>
</html>

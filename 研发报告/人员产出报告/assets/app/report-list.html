<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>研发周报 · 人员产出报告 · App</title>
<!--
  人员产出报告 · 报告列表（App 查阅端 · 仅研发周报 · 静态原型，数据为 Mock）
  页面对象定义：references/mobile-ui.md「报告列表」
  布局流：busy-navbar（返回 + 标题「研发周报」+ 右侧搜索图标，点击展开 SearchBar）
    → 按所属周倒序的周分组卡片流（周标签 + 齐全度徽标；报告卡 = 标题/发报日/来源/版本号）
    → 未入库周灰显「未入库」占位卡（不可点）→ 空态 / 上拉加载提示。
  导航方式：Push（工作台「研发周报」入口进入）；返回 = 导航栏返回 / 手势返回 → 工作台。
  Mock 日期基准：今天 = 2026-10-21（周三）；本周 W43 周中不展示，最晚展示上周 W42（与 Web 同口径，后端 week-index 收口）。
-->
<link rel="stylesheet" href="../../../../../busyming-skills-design/components/mobile/tokens/mobile.css">
<link rel="stylesheet" href="../../../../../busyming-skills-design/docs-site/demos/mobile/css/NavBar.css">
<link rel="stylesheet" href="../../../../../busyming-skills-design/docs-site/demos/mobile/css/SearchBar.css">
<link rel="stylesheet" href="../../../../../busyming-skills-design/docs-site/demos/mobile/css/Tag.css">
<link rel="stylesheet" href="../../../../../busyming-skills-design/docs-site/demos/mobile/css/Button.css">
<link rel="stylesheet" href="../../../../../busyming-skills-design/docs-site/demos/mobile/css/Toast.css">
<link rel="stylesheet" href="../../../../../busyming-skills-design/docs-site/demos/mobile/css/Skeleton.css">
<link rel="stylesheet" href="../../../../../busyming-skills-design/templates/mobile/templates.css">
<style>
/* 页面级扩展类（仅定位与尺寸，色值/字号/圆角全部消费 --busy-* token） */
.tpl-col-gap { display: flex; flex-direction: column; gap: 12px; }
.tpl-skel-line { height: 18px; width: 50%; }
.tpl-skel-block { height: 96px; width: 100%; }
.tpl-load-more { text-align: center; font-size: var(--busy-font-size-xs); padding: 4px 0; }
.tpl-week-head { display: flex; align-items: center; justify-content: space-between; padding: 0 2px; }
.tpl-week-head__label { font-size: var(--busy-font-size-base); }
.tpl-doc-card--link { text-decoration: none; color: inherit; }
.tpl-doc-card__no--clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tpl-doc-card--disabled { opacity: .55; }
.tpl-toast-float { position: fixed; top: 48px; left: 50%; transform: translateX(-50%); z-index: 3000; display: inline-flex; padding: 10px 16px; border-radius: var(--busy-button-radius-large); }
</style>
</head>
<body>
<div class="tpl-app">
  <div class="busy-navbar">
    <div class="busy-navbar__bar">
      <span class="busy-navbar__side" id="navBack"><svg class="busy-navbar__back" width="20" height="20" viewBox="0 0 20 20" fill="currentColor"><path d="M12.72 4.47a.75.75 0 0 1 0 1.06L8.94 9.5l3.78 3.97a.75.75 0 1 1-1.09 1.03l-4.3-4.5a.75.75 0 0 1 0-1.03l4.3-4.5a.75.75 0 0 1 1.09 0z"/></svg></span>
      <span class="busy-navbar__title">研发周报</span>
      <span class="busy-navbar__side busy-navbar__side--right" id="navSearch"><svg width="20" height="20" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.5"/><path d="M11 11l3.2 3.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></span>
    </div>
  </div>

  <div class="tpl-app__scroll">
    <!-- 搜索（点导航栏搜索图标展开；输入确认 = 标题模糊匹配，跨周分组保留） -->
    <div id="searchWrap" hidden>
      <div class="busy-searchbar">
        <div class="busy-searchbar__row">
          <div class="busy-searchbar__field">
            <span class="busy-searchbar__leading"><svg class="busy-searchbar__search-icon" width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.5"/><path d="M11 11l3.2 3.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></span>
            <input class="busy-searchbar__input" id="searchInput" placeholder="按报告标题搜索">
          </div>
        </div>
      </div>
    </div>

    <!-- 骨架屏（搜索 / 下拉刷新 loading） -->
    <div id="skeleton" hidden class="tpl-col-gap">
      <span class="busy-skeleton busy-skeleton--rect busy-skeleton--animated tpl-skel-line"></span>
      <span class="busy-skeleton busy-skeleton--rect busy-skeleton--animated tpl-skel-block"></span>
      <span class="busy-skeleton busy-skeleton--rect busy-skeleton--animated tpl-skel-line"></span>
      <span class="busy-skeleton busy-skeleton--rect busy-skeleton--animated tpl-skel-block"></span>
    </div>

    <div id="groupList" class="tpl-col-gap"></div>

    <div class="tpl-empty" id="emptyState" hidden>
      <div class="tpl-empty__icon">☁</div>
      <div class="tpl-empty__desc">该条件下暂无报告<br>可调整搜索关键词</div>
    </div>

    <div class="u-muted tpl-load-more" id="loadMore">上拉加载更早周次 · 下拉可刷新（Mock）</div>
  </div>
</div>

<script>
/* ================= Mock 数据（App 仅研发周报；周索引口径与 Web 一致） ================= */
var WEEKS = [
  { key: 'w42', label: '第 42 周 · 10-12~10-18', badge: '1/1', badgeCls: 'busy-tag--success', report: { title: '研发周报 · 2026 年第 42 周（10-12 ~ 10-18）', date: '2026-10-18', source: '服务端生成', ver: 'v2' } },
  { key: 'w41', label: '第 41 周 · 10-05~10-11', badge: '1/1', badgeCls: 'busy-tag--success', report: { title: '研发周报 · 2026 年第 41 周（10-05 ~ 10-11）', date: '2026-10-11', source: '服务端生成', ver: 'v1' } },
  { key: 'w40', label: '第 40 周 · 09-28~10-04', badge: '0/1', badgeCls: 'busy-tag--warning', report: null },
  { key: 'w39', label: '第 39 周 · 09-21~09-27', badge: '1/1', badgeCls: 'busy-tag--success', report: { title: '研发周报 · 2026 年第 39 周（09-21 ~ 09-27）', date: '2026-09-27', source: '手动补传', ver: 'v3' } }
];

function toast(text) {
  var el = document.createElement('div');
  el.className = 'busy-toast tpl-toast-float';
  el.textContent = text;
  document.body.appendChild(el);
  setTimeout(function () { el.remove(); }, 1800);
}

function render(kw) {
  var list = document.getElementById('groupList');
  var html = '';
  var hit = 0;
  WEEKS.forEach(function (w) {
    var showReport = w.report && (!kw || w.report.title.indexOf(kw) >= 0);
    var showMissing = !w.report && !kw; /* 搜索时未入库占位卡不参与匹配 */
    if (!showReport && !showMissing) return;
    hit++;
    html += '<div class="tpl-week-head">' +
      '<span class="u-strong tpl-week-head__label">' + w.label + '</span>' +
      '<span class="busy-tag ' + w.badgeCls + ' busy-tag--tint"><span class="busy-tag__content">' + w.badge + '</span></span></div>';
    if (w.report) {
      var r = w.report;
      html += '<a class="tpl-doc-card tpl-doc-card--link" href="report-detail.html">' +
        '<div class="tpl-doc-card__head"><span class="tpl-doc-card__no tpl-doc-card__no--clamp">' + r.title + '</span></div>' +
        '<div class="tpl-doc-card__body">' +
          '<div><div class="tpl-doc-card__label">发报日</div><div class="tpl-doc-card__value u-mono">' + r.date + '</div></div>' +
          '<div><div class="tpl-doc-card__label">版本号</div><div class="tpl-doc-card__value u-mono">' + r.ver + '</div></div>' +
        '</div>' +
        '<div class="tpl-doc-card__foot"><span>来源：' + r.source + '</span><b>查看 ›</b></div>' +
      '</a>';
    } else {
      /* 未入库周：灰显占位卡，不可点（App 端不提供立即生成/补传） */
      html += '<div class="tpl-doc-card tpl-doc-card--disabled">' +
        '<div class="tpl-doc-card__head"><span class="tpl-doc-card__no u-muted">研发周报</span><span class="busy-tag busy-tag--default"><span class="busy-tag__content">未入库</span></span></div>' +
        '<div class="tpl-doc-card__foot"><span>该周报告未入库，请在 Web 端处理</span></div>' +
      '</div>';
    }
  });
  list.innerHTML = html;
  document.getElementById('emptyState').hidden = hit > 0;
}

/* 搜索：确认输入 → 骨架屏 → 结果刷新 */
var searchTimer = null;
document.getElementById('navSearch').addEventListener('click', function () {
  var w = document.getElementById('searchWrap');
  w.hidden = !w.hidden;
  if (!w.hidden) document.getElementById('searchInput').focus();
});
document.getElementById('searchInput').addEventListener('keydown', function (e) {
  if (e.key !== 'Enter') return;
  document.getElementById('skeleton').hidden = false;
  document.getElementById('groupList').hidden = true;
  var kw = this.value.trim();
  clearTimeout(searchTimer);
  searchTimer = setTimeout(function () {
    document.getElementById('skeleton').hidden = true;
    document.getElementById('groupList').hidden = false;
    render(kw);
  }, 400);
});

/* 返回工作台（Push 来源页；原型以 toast 声明去向） */
document.getElementById('navBack').addEventListener('click', function () { toast('返回工作台（Mock）'); });

render('');
</script>
</body>
</html>

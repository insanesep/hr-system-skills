      '<h2>功能进展追踪</h2>' +

      '<p>功能排期月历视图上线后首周点击 1,240 次，活跃 38 人；文档一致性报告入口零点击，需确认入口可见性。</p>' +

      '<ul><li>总调用 3,860 次 · 使用人数 22 · 被用工具 41/58（零调用 17 个）· 成功率 98.2% · 平均耗时 320ms</li><li>调用量 TOP：功能排期、研发周报、错误日志报表</li></ul>' +

    1: '<h1>研发周报 - 2026-10-11</h1>' +
      '<blockquote>统计区间：2026-10-05（周一）~ 2026-10-11（周日）</blockquote>' +
      '<div class="ac-alert ac-alert--info">v1 为服务端生成初版；因人员署名归一口径修正，已由手动补传生成 v2，本版本仅作留痕。</div>' +
      '<h2>统计概览</h2>' +
      '<ul><li>总提交数: 51</li><li>参与人数: 7</li><li>涉及仓库: 9</li><li>排期任务: 24 个（完成 15 个）</li><li>Qoder 团队总用量: 136,800 Credits</li></ul>' +

  var mdBody = $('#mdBody'), outlineList = $('#outlineList'), drawerList = $('#drawerOutlineList');
  function buildOutline() {
    var heads = $$('h2, h3', mdBody);
    var html = heads.map(function (h, i) {
      var id = 'h-' + i;
      h.id = id;
      var cls = h.tagName === 'H3' ? 'ac-anchor__link ac-anchor__link--child' : 'ac-anchor__link';
      return '<li><a class="' + cls + '" href="#' + id + '" data-anchor="' + id + '">' + h.textContent + '</a></li>';
    }).join('');
    outlineList.innerHTML = html;
    drawerList.innerHTML = html;
  }
  function activateAnchor(id) {
    $$('.ac-anchor__link').forEach(function (a) {
      a.classList.toggle('ac-anchor__link--active', a.getAttribute('data-anchor') === id);
    });
  }
  document.addEventListener('click', function (e) {
    var a = e.target.closest('[data-anchor]');
    if (!a) return;
    e.preventDefault();
    var target = document.getElementById(a.getAttribute('data-anchor'));
    if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    activateAnchor(a.getAttribute('data-anchor'));
    closeDrawer();
  });
  window.addEventListener('scroll', function () {
    var heads = $$('h2, h3', mdBody), current = heads[0];
    heads.forEach(function (h) { if (h.getBoundingClientRect().top <= 96) current = h; });
    if (current) activateAnchor(current.id);
  }, { passive: true });

  /* ── 版本切换：正文整体替换 + URL ?v=N ── */
  var verPopup = $('#verPopup'), currentVer = 2;

    if (!e.target.closest('#verSelect')) verPopup.hidden = true;
  });
  verPopup.addEventListener('click', function (e) {
    var opt = e.target.closest('[data-version]');
    if (!opt) return;
    var v = opt.getAttribute('data-version');
    verPopup.hidden = true;
    if (Number(v) === currentVer) return;
    currentVer = Number(v);
    mdBody.innerHTML = BODIES[v];
    $('#metaSource').textContent = META[v].source;
    $('#metaSize').textContent = META[v].size;

    outlineSide.hidden = !wide;
    outlineBtn.hidden = wide;
    if (wide) closeDrawer();
  }
  function closeDrawer() { drawer.classList.remove('is-open'); drawer.hidden = true; }

  mdBody.innerHTML = BODIES[initVer === '1' ? '1' : '2'];

<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>文档一致性报告 · 报告列表 · App 原型</title>
<!--
  文档一致性报告 · 报告列表（App 查阅端原型）
  页面描述真源：../../references/mobile-ui.md#报告列表 ｜ 页面类型 list（分组卡片流）
  整页范例：busyming-skills-design/mobile/templates/list.html ｜ DOM 依据：skeletons/app/list-page.tsx.tpl
  结构：ac-nav-bar（返回 + 标题 + 搜索图标）→ 搜索栏（点图标展开）→ 项目筛选 chip 组 → 周分组卡片流（齐全度徽标）→ 加载更多
  本周行仅周日当天起展示（演示基准日 2026-10-18 周日）；未入库项灰显占位卡不可点；下拉刷新/上拉加载以 proto-bar 演示与「加载更多」承载。
  项目集合为虚构演示数据（真源=报告项目配置生效数据）。
-->
<link rel="stylesheet" href="../../../../../busyming-skills-design/mobile/styles/design-system.css" />
</head>
<body>
<section class="tpl-page">
<div class="tpl-panel">
<div class="app-phone">
  <div class="app-phone__status"><span>09:41</span><span>5G · 100%</span></div>
  <div class="app-screen">
    <header class="ac-nav-bar" data-ac="AcNavBar">
      <span class="ac-nav-bar__side" role="button" tabindex="0" aria-label="返回工作台"><span class="ac-icon" data-icon="back"></span></span>
      <strong class="ac-nav-bar__title">文档一致性报告</strong>
      <span class="ac-nav-bar__side" role="button" tabindex="0" aria-label="搜索" id="searchToggle"><span class="ac-icon" data-icon="search"></span></span>
    </header>
    <div class="app-screen__content app-screen__content--flush">
      <!-- 搜索栏：点导航栏搜索图标展开，按标题模糊匹配 -->
      <div class="ac-search-bar" data-ac="AcSearchBar" id="searchBar" hidden>
        <span class="ac-input" data-ac="AcInput"><input class="ac-input__inner" id="searchInput" placeholder="按报告标题模糊搜索" autocomplete="off" /></span>
        <span class="ac-search-bar__clear" role="button" tabindex="0" id="searchCancel">取消</span>
      </div>
      <!-- 项目筛选 chip 组（单选，切换即刷新） -->
      <div class="tpl-filter-chips" id="projChips">
        <span class="tpl-filter-chips__chip is-active" data-proj="">全部</span>
        <span class="tpl-filter-chips__chip" data-proj="llhm">零食很忙</span>
        <span class="tpl-filter-chips__chip" data-proj="zym">赵一鸣零食</span>
      </div>
      <div class="app-stack" id="cardHost" style="padding:var(--ac-space-3)"></div>
      <div class="ac-load-more" data-ac="AcLoadMore" id="loadMore">加载更多</div>
    </div>
  </div>
</div>
</div>

<!-- 原型页间互联与三态演示（非 App 真实 UI） -->
<nav class="proto-bar">
  <b>报告列表</b> ·
  <a class="ac-link" href="report-detail.html">报告详情</a>
  ｜三态演示：
  <a class="ac-link" href="#" data-demo="normal" onclick="return false">正常</a> ·
  <a class="ac-link" href="#" data-demo="skeleton" onclick="return false">骨架</a> ·
  <a class="ac-link" href="#" data-demo="empty" onclick="return false">空态</a> ·
  <a class="ac-link" href="#" data-demo="error" onclick="return false">错误</a>
</nav>
</section>

<script src="../../../../../busyming-skills-design/mobile/styles/runtime.js"></script>
<script>
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
function toast(text, type) {
  const layer = document.createElement('div');
  layer.className = 'ac-toast-layer';
  layer.innerHTML = `<div class="ac-toast" data-ac="AcToast" data-type="${type || 'success'}" role="status"><span class="ac-toast__text">${esc(text)}</span></div>`;
  document.body.appendChild(layer);
  setTimeout(() => layer.remove(), 2600);
}

/* ==================== 演示数据（虚构，基准日 2026-10-18） ==================== */
const PROJ = { llhm: ['primary', '零食很忙'], zym: ['warning', '赵一鸣零食'] };
const WEEKS = [
  { label: '第 42 周', range: '10-12~10-18', full: false, items: [
    { proj: 'llhm', title: '一致性检查报告（零食很忙） - 2026-10-18', date: '10-18', src: '服务端生成', ver: 'v1' },
    { proj: 'zym', missing: true },
  ]},
  { label: '第 41 周', range: '10-05~10-11', full: true, items: [
    { proj: 'llhm', title: '一致性检查报告（零食很忙） - 2026-10-11', date: '10-11', src: '服务端生成', ver: 'v1' },
    { proj: 'zym', title: '一致性检查报告（赵一鸣零食） - 2026-10-11', date: '10-11', src: '手动补传', ver: 'v2' },
  ]},
  { label: '第 40 周', range: '09-28~10-04', full: true, items: [
    { proj: 'llhm', title: '一致性检查报告（零食很忙） - 2026-10-04', date: '10-04', src: '服务端生成', ver: 'v1' },
    { proj: 'zym', title: '一致性检查报告（赵一鸣零食） - 2026-10-04', date: '10-04', src: '推送上报', ver: 'v1' },
  ]},
];

const S = { proj: '', kw: '' };

function cardHtml(it) {
  if (it.missing) {
    return `<div class="tpl-doc-card" aria-disabled="true">
      <div class="tpl-doc-card__head"><span class="ac-tag ac-tag--outline">${PROJ[it.proj][1]}</span><span class="ac-tag ac-tag--outline">未入库</span></div>
      <div class="tpl-doc-card__body"><div><div class="tpl-doc-card__label">报告标题</div><div class="tpl-doc-card__value u-muted">本周期报告未入库，请在 Web 端立即生成或补传</div></div></div>
    </div>`;
  }
  return `<div class="tpl-doc-card" role="button" tabindex="0" data-go="report-detail.html">
    <div class="tpl-doc-card__head"><span class="ac-tag ac-tag--${PROJ[it.proj][0]}">${PROJ[it.proj][1]}</span><span class="mono u-muted">${it.ver}</span></div>
    <div class="tpl-doc-card__body">
      <div><div class="tpl-doc-card__label">报告标题</div><div class="tpl-doc-card__value"><span class="ac-ellipsis" data-ac="AcEllipsis"><span class="ac-ellipsis__text">${esc(it.title)}</span></span></div></div>
      <div><div class="tpl-doc-card__label">发报日</div><div class="tpl-doc-card__value mono">${it.date}</div></div>
      <div><div class="tpl-doc-card__label">来源</div><div class="tpl-doc-card__value">${it.src}</div></div>
      <div><div class="tpl-doc-card__label">版本号</div><div class="tpl-doc-card__value mono">${it.ver}</div></div>
    </div>
  </div>`;
}
function groupHtml(w) {
  const badge = w.full
    ? `<span class="ac-tag ac-tag--success">${w.items.length}/${w.items.length}</span>`
    : `<span class="ac-tag ac-tag--warning">${w.items.filter((i) => !i.missing).length}/${w.items.length}</span>`;
  const items = w.items
    .filter((it) => (!S.proj || it.proj === S.proj) && (!S.kw || it.missing || it.title.includes(S.kw)))
    .map(cardHtml).join('');
  if (!items) return '';
  return `<div class="tpl-list-group-header"><span class="tpl-list-group-header__title">${w.label}</span><span class="tpl-list-group-header__range">${w.range}</span>${badge}</div>${items}`;
}
function emptyHtml() {
  return `<div class="ac-empty" data-ac="AcEmpty"><div class="ac-empty__visual"></div><div class="ac-empty__title">该条件下暂无报告</div></div>`;
}
function skeletonHtml() {
  return Array.from({ length: 3 }).map(() => `<div class="tpl-doc-card"><div class="ac-skeleton"><div class="ac-skeleton--line ac-skeleton--line-sm"></div><div class="ac-skeleton--line"></div><div class="ac-skeleton--line ac-skeleton--line-sm"></div></div></div>`).join('');
}
function render() {
  const host = $('#cardHost');
  const html = WEEKS.map(groupHtml).join('');
  host.innerHTML = html || emptyHtml();
  $('#loadMore').textContent = html ? '加载更多' : '';
}
function renderWithSkeleton() {
  $('#cardHost').innerHTML = skeletonHtml();
  $('#loadMore').textContent = '';
  setTimeout(render, 300);
}

/* ==================== 事件 ==================== */
/* 搜索图标 → 展开搜索栏；取消 → 收起并清空 */
$('#searchToggle').addEventListener('click', () => {
  $('#searchBar').hidden = false;
  $('#searchInput').focus();
});
$('#searchCancel').addEventListener('click', () => {
  $('#searchBar').hidden = true;
  $('#searchInput').value = '';
  S.kw = '';
  renderWithSkeleton();
});
$('#searchInput').addEventListener('input', () => { S.kw = $('#searchInput').value.trim(); render(); });

/* 项目 chip 单选：切换即骨架屏刷新 */
$('#projChips').addEventListener('click', (e) => {
  const chip = e.target.closest('.tpl-filter-chips__chip');
  if (!chip) return;
  $$('#projChips .tpl-filter-chips__chip').forEach((c) => c.classList.remove('is-active'));
  chip.classList.add('is-active');
  S.proj = chip.getAttribute('data-proj');
  renderWithSkeleton();
});

/* 卡片跳转详情（未入库占位卡无 data-go，不可点） */
$('#cardHost').addEventListener('click', (e) => {
  if (e.target.closest('[data-retry]')) { renderWithSkeleton(); return; }
  const card = e.target.closest('[data-go]');
  if (card) location.href = card.getAttribute('data-go');
});

/* 上拉加载更多（原型以按钮承载手势） */
$('#loadMore').addEventListener('click', () => {
  $('#loadMore').textContent = '没有更多了';
});

/* 三态演示（原型专用）；下拉刷新以「正常」重载演示 */
document.querySelector('.proto-bar').addEventListener('click', (e) => {
  const a = e.target.closest('[data-demo]');
  if (!a) return;
  const d = a.getAttribute('data-demo');
  if (d === 'skeleton') { $('#cardHost').innerHTML = skeletonHtml(); $('#loadMore').textContent = ''; }
  else if (d === 'empty') { $('#cardHost').innerHTML = emptyHtml(); $('#loadMore').textContent = ''; }
  else if (d === 'error') {
    $('#cardHost').innerHTML = `<div class="ac-empty" data-ac="AcEmpty"><div class="ac-empty__visual"></div><div class="ac-empty__title">加载失败</div><div class="ac-empty__description"><a class="ac-link" href="#" onclick="return false" data-retry>点击重试</a></div></div>`;
    $('#loadMore').textContent = '';
  } else renderWithSkeleton();
});

render();
</script>
</body>
</html>

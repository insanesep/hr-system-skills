<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>文档一致性报告 · App</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../../../../../busyming-skills-design/assets/runtime/prototype/mobile-tokens.css">
<link rel="stylesheet" href="../prototype.css">
</head>
<body>
<svg class="sr-only" aria-hidden="true"><defs>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6.1 8a7 7 0 0 1 11.4-2L20 8M4 16l2.5 2a7 7 0 0 0 11.4-2"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
  <symbol id="i-report" viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 12h7M9 16h7"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
  <symbol id="i-empty" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5M8 10.5h5"/></symbol>
</defs></svg>
<div class="reading-progress" aria-hidden="true"><div class="reading-progress-bar" id="readingProgress"></div></div>
<div class="mobile-shell">
  <header class="mobile-nav">
    <button class="icon-btn" id="navBack" type="button" aria-label="返回工作台"><svg class="svg-icon"><use href="#i-back"/></svg></button>
    <div class="mobile-nav-title">文档一致性报告</div>
    <button class="icon-btn" id="navRefresh" type="button" aria-label="刷新报告"><svg class="svg-icon"><use href="#i-refresh"/></svg></button>
  </header>
  <main class="mobile-content">
    <div class="mobile-load-end" id="pullIndicator" hidden>继续下拉刷新</div>
    <section class="mobile-summary" aria-label="本周入库情况">
      <div class="mobile-summary-icon"><svg class="svg-icon"><use href="#i-report"/></svg></div>
      <div><div class="mobile-summary-title">本周已入库 1/2</div><div class="mobile-summary-copy">产研平台待补，可在 Web 管理端生成或补传</div></div>
    </section>
    <div class="mobile-search">
      <svg class="svg-icon"><use href="#i-search"/></svg>
      <input class="input" id="searchInput" type="search" placeholder="搜索报告标题" aria-label="搜索报告标题">
      <button class="icon-btn mobile-search-clear" id="searchClear" type="button" aria-label="清除搜索" hidden><svg class="svg-icon"><use href="#i-x"/></svg></button>
    </div>
    <div class="chip-row" id="projectChips" aria-label="项目筛选">
      <button class="chip active" type="button" data-project="" aria-pressed="true">全部项目</button>
      <button class="chip" type="button" data-project="store" aria-pressed="false">门店要货</button>
      <button class="chip" type="button" data-project="devops" aria-pressed="false">产研平台</button>
    </div>
    <div id="listSkeleton" hidden>
      <div class="skeleton skeleton-line" style="width:45%;margin-left:0"></div><div class="skeleton" style="height:142px"></div>
      <div class="skeleton skeleton-line" style="width:38%;margin-left:0"></div><div class="skeleton" style="height:142px"></div>
    </div>
    <div id="reportList"></div>
    <div class="empty-state" id="emptyState" hidden>
      <div class="empty-icon"><svg class="svg-icon"><use href="#i-empty"/></svg></div>
      <div class="empty-title">没有找到匹配的报告</div>
      <p class="empty-copy">换个关键词，或切换到全部项目再试试。</p>
      <button class="btn" id="emptyReset" type="button">清除筛选</button>
    </div>
    <button class="btn mobile-load" id="loadMore" type="button">加载更早周次</button>
    <div class="mobile-load-end" id="loadEnd" hidden>已加载全部周次</div>
  </main>
</div>
<div class="toast-stack" id="toastHost" aria-live="polite"></div>
<script src="../prototype.js"></script>
<script>
(function () {
  var UI = ReportUI;
  var PROJECTS = { store: '门店要货', devops: '产研平台' };
  var weeks = [
    { label: '第 42 周 · 10-12 ~ 10-18', items: [
      { project: 'devops', report: null },
      { project: 'store', report: { title: '一致性检查报告（门店要货）', date: '2026-10-18', source: '服务端生成', ver: 'v2' } }
    ] },
    { label: '第 41 周 · 10-05 ~ 10-11', items: [
      { project: 'devops', report: { title: '一致性检查报告（产研平台）', date: '2026-10-11', source: '服务端生成', ver: 'v1' } },
      { project: 'store', report: { title: '一致性检查报告（门店要货）', date: '2026-10-11', source: '推送上报', ver: 'v1' } }
    ] }
  ];
  var olderWeeks = [
    { label: '第 40 周 · 09-28 ~ 10-04', items: [
      { project: 'devops', report: null },
      { project: 'store', report: { title: '一致性检查报告（门店要货）', date: '2026-10-04', source: '手动补传', ver: 'v1' } }
    ] }
  ];
  var state = { project: '', kw: '', loadedOld: false };
  var searchTimer = null;

  function esc(value) { return UI.escapeHtml(value); }
  function cardHtml(item) {
    var report = item.report;
    if (!report) {
      return '<article class="mobile-card missing"><div class="mobile-card-top"><span class="badge badge-neutral badge-plain">' + esc(PROJECTS[item.project]) + ' · ' + esc(item.project) + '</span><span class="badge badge-warning">未入库</span></div><div class="mobile-card-title">该周报告尚未归档</div><div class="mobile-card-footer"><span>请在 Web 管理端处理</span><span>不可查看</span></div></article>';
    }
    return '<a class="mobile-card" href="report-detail.html"><div class="mobile-card-top"><span class="badge badge-info badge-plain">' + esc(PROJECTS[item.project]) + ' · ' + esc(item.project) + '</span><span class="badge badge-success">已入库</span></div><div class="mobile-card-title">' + esc(report.title) + '</div><div class="mobile-card-meta"><span class="mono">' + esc(report.date) + '</span><span>·</span><span>' + esc(report.source) + '</span></div><div class="mobile-card-footer"><span>当前版本 <span class="mono">' + esc(report.ver) + '</span></span><span class="mobile-card-action">阅读报告<svg class="svg-icon" style="width:15px;height:15px"><use href="#i-chevron"/></svg></span></div></a>';
  }
  function render() {
    var source = state.loadedOld ? weeks.concat(olderWeeks) : weeks;
    var html = source.map(function (week) {
      var items = week.items.filter(function (item) {
        if (state.project && item.project !== state.project) return false;
        if (state.kw && (!item.report || item.report.title.toLowerCase().indexOf(state.kw.toLowerCase()) === -1)) return false;
        return true;
      });
      if (!items.length) return '';
      var available = week.items.filter(function (item) { return item.report; }).length;
      var total = week.items.length;
      return '<section class="mobile-week"><div class="mobile-week-head"><div><div class="mobile-week-title">' + esc(week.label) + '</div><div class="mobile-week-count">' + available + '/' + total + ' 份已入库</div></div><span class="badge ' + (available === total ? 'badge-success' : 'badge-warning') + '">' + (available === total ? '已齐全' : '待补 ' + (total - available)) + '</span></div>' + items.map(cardHtml).join('') + '</section>';
    }).join('');
    document.getElementById('reportList').innerHTML = html;
    document.getElementById('emptyState').hidden = !!html;
    document.getElementById('loadMore').hidden = state.loadedOld || !html;
    document.getElementById('loadEnd').hidden = !state.loadedOld || !html;
  }
  function showLoading(callback) {
    document.getElementById('listSkeleton').hidden = false;
    document.getElementById('reportList').hidden = true;
    document.getElementById('emptyState').hidden = true;
    window.setTimeout(function () {
      document.getElementById('listSkeleton').hidden = true;
      document.getElementById('reportList').hidden = false;
      callback();
    }, 280);
  }
  document.getElementById('searchInput').addEventListener('input', function () {
    var value = this.value;
    document.getElementById('searchClear').hidden = !value;
    window.clearTimeout(searchTimer);
    searchTimer = window.setTimeout(function () { state.kw = value.trim(); render(); }, 220);
  });
  document.getElementById('searchInput').addEventListener('keydown', function (event) { if (event.key === 'Enter') this.blur(); });
  document.getElementById('searchClear').addEventListener('click', function () {
    document.getElementById('searchInput').value = '';
    this.hidden = true;
    state.kw = '';
    render();
    document.getElementById('searchInput').focus();
  });
  document.getElementById('projectChips').addEventListener('click', function (event) {
    var chip = event.target.closest('[data-project]');
    if (!chip) return;
    state.project = chip.getAttribute('data-project');
    document.querySelectorAll('[data-project]').forEach(function (item) {
      var active = item === chip;
      item.classList.toggle('active', active);
      item.setAttribute('aria-pressed', active ? 'true' : 'false');
    });
    showLoading(render);
  });
  document.getElementById('emptyReset').addEventListener('click', function () {
    state.project = '';
    state.kw = '';
    document.getElementById('searchInput').value = '';
    document.getElementById('searchClear').hidden = true;
    document.querySelectorAll('[data-project]').forEach(function (item) {
      var active = !item.getAttribute('data-project');
      item.classList.toggle('active', active);
      item.setAttribute('aria-pressed', active ? 'true' : 'false');
    });
    render();
  });
  document.getElementById('loadMore').addEventListener('click', function () {
    var button = this;
    UI.setLoading(button, true);
    button.textContent = '正在加载更早周次';
    window.setTimeout(function () {
      state.loadedOld = true;
      UI.setLoading(button, false);
      button.textContent = '加载更早周次';
      render();
    }, 450);
  });
  document.getElementById('navRefresh').addEventListener('click', function () {
    var button = this;
    UI.setLoading(button, true);
    showLoading(function () { UI.setLoading(button, false); render(); UI.toast('报告列表已更新'); });
  });
  document.getElementById('navBack').addEventListener('click', function () { UI.toast('返回工作台（原型演示）'); });
  var pullStart = null;
  document.addEventListener('touchstart', function (event) { if (window.scrollY <= 0 && event.touches.length === 1) pullStart = event.touches[0].clientY; }, { passive: true });
  document.addEventListener('touchmove', function (event) {
    if (pullStart === null || window.scrollY > 0) return;
    var distance = event.touches[0].clientY - pullStart;
    var indicator = document.getElementById('pullIndicator');
    indicator.hidden = distance < 18;
    if (distance >= 18) indicator.textContent = distance > 70 ? '松开即可刷新' : '继续下拉刷新';
  }, { passive: true });
  document.addEventListener('touchend', function (event) {
    if (pullStart === null) return;
    var distance = event.changedTouches[0].clientY - pullStart;
    document.getElementById('pullIndicator').hidden = true;
    pullStart = null;
    if (distance > 70 && window.scrollY <= 0) document.getElementById('navRefresh').click();
  }, { passive: true });
  document.addEventListener('click', function (event) {
    if (event.target.closest('a[href="report-detail.html"]')) UI.saveState('consistency-mobile-list', { project: state.project, kw: state.kw, loadedOld: state.loadedOld, scroll: window.scrollY });
  });
  window.addEventListener('scroll', function () {
    var max = document.documentElement.scrollHeight - window.innerHeight;
    document.getElementById('readingProgress').style.width = (max > 0 ? Math.min(100, window.scrollY / max * 100) : 0) + '%';
  }, { passive: true });
  var saved = UI.readState('consistency-mobile-list');
  if (saved) {
    state.project = saved.project || '';
    state.kw = saved.kw || '';
    state.loadedOld = !!saved.loadedOld;
    document.getElementById('searchInput').value = state.kw;
    document.getElementById('searchClear').hidden = !state.kw;
    document.querySelectorAll('[data-project]').forEach(function (item) {
      var active = item.getAttribute('data-project') === state.project;
      item.classList.toggle('active', active);
      item.setAttribute('aria-pressed', active ? 'true' : 'false');
    });
    window.setTimeout(function () { window.scrollTo(0, saved.scroll || 0); }, 0);
    sessionStorage.removeItem('consistency-mobile-list');
  }
  render();
})();
</script>
</body>
</html>

    .gap-markdown-viewer__content blockquote p:last-child { margin-bottom: 0; }

    .gap-markdown-viewer__trend.is-down { color: var(--busy-color-danger); }
    .gap-markdown-viewer__content hr { margin: 32px 0 16px; border: 0; border-top: 1px solid var(--busy-border-color-lighter); }

    .gap-markdown-viewer__content table { width: 100%; min-width: 560px; border-collapse: separate; border-spacing: 0; font-size: var(--busy-font-size-base); }
    .gap-markdown-viewer__content th { padding: 10px 12px; border-bottom: 1px solid var(--busy-border-color); background: var(--busy-fill-color-light); color: var(--busy-text-primary); font-weight: 600; text-align: left; word-break: keep-all; }

    .gap-markdown-viewer__loading { position: absolute; inset: 0; z-index: 2; display: flex; align-items: flex-start; justify-content: center; min-height: 240px; padding-top: 64px; background: var(--busy-bg-color-overlay); color: var(--busy-text-secondary); font-size: var(--busy-font-size-small); }

  </style>

  <script src="../../../../../busyming-skills-design/shared/prototype/web/native.js"></script>
  <script>
    (function () {
      'use strict';
      var $ = function (id) { return document.getElementById(id); };
      var SCOPES = [
        { value: '_all', type: '全部', name: '全部项目组', key: '_all' },
        { value: 'devhub-web', type: '项目', name: '研发门户', reportName: '研发门户', key: 'devhub-web' },
        { value: 'devops', type: '域', name: '产研', reportName: '产研', key: 'devops' },
        { value: 'feature-schedule', type: '项目', name: '功能排期管理', reportName: '功能排期管理', key: 'feature-schedule' },
        { value: 'member-output', type: '项目', name: '人员产出报告', reportName: '人员产出报告', key: 'member-output' },
        { value: 'report-center', type: '项目', name: '研发报告', reportName: '研发报告', key: 'report-center' }
      ];
      var PROJECT_GROUPS = SCOPES.filter(function (scope) { return scope.value !== '_all'; }).sort(function (a, b) { return a.key.localeCompare(b.key); });
      var WEEKS = [
        { id: 'W44', label: '2026 年第 44 周（10-26 ~ 11-01）', short: '第 44 周', start: '2026-10-26', end: '2026-11-01', archived: { '_all': ['服务端生成', 3] } },
        { id: 'W43', label: '2026 年第 43 周（10-19 ~ 10-25）', short: '第 43 周', start: '2026-10-19', end: '2026-10-25', archived: { '_all': ['服务端生成', 2] } },
        { id: 'W42', label: '2026 年第 42 周（10-12 ~ 10-18）', short: '第 42 周', start: '2026-10-12', end: '2026-10-18', archived: { '_all': ['服务端生成', 1] } },
        { id: 'W41', label: '2026 年第 41 周（10-05 ~ 10-11）', short: '第 41 周', start: '2026-10-05', end: '2026-10-11', archived: { '_all': ['服务端生成', 1] } },
        { id: 'W40', label: '2026 年第 40 周（09-28 ~ 10-04）', short: '第 40 周', start: '2026-09-28', end: '2026-10-04', archived: { '_all': ['服务端生成', 1] } },
        { id: 'W39', label: '2026 年第 39 周（09-21 ~ 09-27）', short: '第 39 周', start: '2026-09-21', end: '2026-09-27', archived: { '_all': ['服务端生成', 1] } },
        { id: 'W38', label: '2026 年第 38 周（09-14 ~ 09-20）', short: '第 38 周', start: '2026-09-14', end: '2026-09-20', archived: { '_all': ['服务端生成', 1] } }
      ];
      try { WEEKS = JSON.parse(sessionStorage.getItem('projectProgressReportWeeks') || 'null') || WEEKS; } catch (ignore) {}
      function averagePerRequest(credits, requests) { return requests > 0 ? (credits / requests).toFixed(1) + ' Credits/次' : '—'; }
      function newContributorNames(id, role, names) {
        return names.filter(function (name) {
          var value = id + ':' + role + ':' + name, hash = 0;
          for (var index = 0; index < value.length; index++) hash = (hash * 31 + value.charCodeAt(index)) % 997;
          return hash % 3 === 0;
        });
      }
      function metricsFor(id, version) {
        var hash = 0;
        for (var index = 0; index < id.length; index++) hash = (hash * 31 + id.charCodeAt(index)) % 997;
        var total = 18 + hash % 5, doing = hash % 3 + 1, todo = hash % 2, delayed = hash % 3;
        var done = total - doing - todo - delayed, developers = 6 + hash % 4, active = Math.max(1, developers - 1);
        var product = 2 + hash % 2, architecture = 1 + hash % 2, productActive = Math.max(1, product - 1), architectureActive = Math.max(1, architecture - 1);
        var added = 2400 + hash * 37 + version * 100, removed = 700 + hash * 19;
        var productAdded = 320 + hash * 11 + version * 20, productRemoved = 90 + hash * 5;
        var qoderTotal = 12000 + hash * 83, requests = 900 + hash * 13;
        var productQoderTotal = 1800 + hash * 17, productRequests = 120 + hash * 7;
        var architectureQoderTotal = Math.round(qoderTotal / 4), architectureRequests = Math.round(requests / 4);
        return {
          total: total, nonFeature: hash % 4, done: done, delayed: delayed,
          rate: (done * 100 / total).toFixed(1), delayedRate: (delayed * 100 / total).toFixed(1),
          developers: developers, product: product, architecture: architecture, perFeatures: (total / developers).toFixed(1),
          productNames: ['王芳', '陈晨', '周洁'].slice(0, product),
          developerNames: ['李雷', '韩梅', '赵强', '孙磊', '周敏', '吴迪', '郑凯', '林雪', '何俊'].slice(0, developers),
          architectureNames: ['张远', '刘洋'].slice(0, architecture),
          newProductNames: newContributorNames(id, 'product', ['王芳', '陈晨', '周洁'].slice(0, product)),
          newDeveloperNames: newContributorNames(id, 'development', ['李雷', '韩梅', '赵强', '孙磊', '周敏', '吴迪', '郑凯', '林雪', '何俊'].slice(0, developers)),
          newArchitectureNames: newContributorNames(id, 'architecture', ['张远', '刘洋'].slice(0, architecture)),
          commits: 32 + hash % 37 + version, added: added, removed: removed,
          perLines: ((added + removed) / developers).toFixed(1),
          productCommits: 4 + hash % 8 + version, productAdded: productAdded, productRemoved: productRemoved,
          productPerLines: ((productAdded + productRemoved) / product).toFixed(1),
          qoderTotal: qoderTotal, qoderAverage: Math.round(qoderTotal / active),
          requests: requests, requestAverage: (requests / active).toFixed(1), qoderPerRequest: averagePerRequest(qoderTotal, requests),
          productQoderTotal: productQoderTotal, productQoderAverage: Math.round(productQoderTotal / productActive),
          productRequests: productRequests, productRequestAverage: (productRequests / productActive).toFixed(1), productQoderPerRequest: averagePerRequest(productQoderTotal, productRequests),
          architectureQoderTotal: architectureQoderTotal, architectureQoderAverage: Math.round(architectureQoderTotal / architectureActive),
          architectureRequests: architectureRequests, architectureRequestAverage: (architectureRequests / architectureActive).toFixed(1), architectureQoderPerRequest: averagePerRequest(architectureQoderTotal, architectureRequests)
        };
      }
      function aggregateMetrics(version, period) {
        var prefix = period === 'previous' ? 'previous-period:' : '', m = metricsFor(prefix + '_all', version), cards = new Map(), nonFeatures = new Set(), newProducts = new Set(), newDevelopers = new Set(), newArchitectures = new Set();
        PROJECT_GROUPS.forEach(function (group) {
          var current = metricsFor(prefix + group.value, version);
          current.newProductNames.forEach(function (name) { newProducts.add(name); });
          current.newDeveloperNames.forEach(function (name) { newDevelopers.add(name); });
          current.newArchitectureNames.forEach(function (name) { newArchitectures.add(name); });
          for (var index = 0; index < current.total; index++) cards.set(group.key + '-' + index, { done: index < current.done, delayed: index >= current.total - current.delayed });
          for (var other = 0; other < current.nonFeature; other++) nonFeatures.add(group.key + '-other-' + other);
        });
        var entries = Array.from(cards.values());
        m.total = cards.size; m.done = entries.filter(function (card) { return card.done; }).length; m.delayed = entries.filter(function (card) { return card.delayed; }).length; m.nonFeature = nonFeatures.size;
        m.rate = (m.done * 100 / m.total).toFixed(1); m.delayedRate = (m.delayed * 100 / m.total).toFixed(1); m.perFeatures = (m.total / m.developers).toFixed(1);
        m.newProductNames = Array.from(newProducts); m.newDeveloperNames = Array.from(newDevelopers); m.newArchitectureNames = Array.from(newArchitectures);
        return m;
      }
      function isSummaryLabel(value) { return value === '全量汇总' || value === '全量汇总(去重)'; }
      var TEXT_COLUMNS = ['核心进展', '人员明细', '操作', '补充说明'];
      function columnAlign(headers) { return headers.map(function (header, index) { return index > 0 && TEXT_COLUMNS.indexOf(header) < 0 ? 'right' : ''; }); }
      function numberText(value) { return String(value).replace(/[+-]?\d+(?:\.\d+)?/g, function (number) { return number.replace(/\B(?=(\d{3})+(?!\d))/g, ','); }); }
      function formattedRows(headers, rows) {
        var align = columnAlign(headers);
        return rows.map(function (row) { return row.map(function (value, index) { return align[index] ? numberText(value) : value; }); });
      }
      function headerPlan(headers) {
        var groups = [], labels = headers.slice(1);
        var combinations = [
          ['项目组', '产品提交次数', '产品提交行数（新增 / 删除）', '产品人均提交行数', '研发提交次数', '研发提交行数（新增 / 删除）', '研发人均提交行数', '架构提交次数', '架构提交行数（新增 / 删除）', '架构人均提交行数'],
          ['项目组', '产品总使用量（Credits）', '产品人均使用量（Credits）', '产品总请求次数', '产品人均请求次数', '产品平均单次请求 Credits', '研发总使用量（Credits）', '研发人均使用量（Credits）', '研发总请求次数', '研发人均请求次数', '研发平均单次请求 Credits'],
          ['项目组', '架构总使用量（Credits）', '架构人均使用量（Credits）', '架构总请求次数', '架构人均请求次数', '架构平均单次请求 Credits']
        ];
        if (combinations.some(function (combination) { return combination.length === headers.length && combination.every(function (label, index) { return label === headers[index]; }); })) {
          labels = labels.map(function (label) {
            var role = label.match(/^(产品|研发|架构)/)[0], last = groups[groups.length - 1];
            if (last && last.role === role) last.count++; else groups.push({ role: role, count: 1 });
            return label.slice(role.length);
          });
        }
        return { groups: groups, labels: labels };
      }
      function cellHtml(tag, value, align) { return '<' + tag + (align ? ' align="' + align + '"' : '') + '>' + value + '</' + tag + '>'; }
      function tableHtml(headers, sourceRows) {
        var align = columnAlign(headers), rows = formattedRows(headers, sourceRows), plan = headerPlan(headers);
        var hasSummary = rows.length && isSummaryLabel(rows[rows.length - 1][0]), summary = hasSummary ? rows[rows.length - 1] : null, bodyRows = hasSummary ? rows.slice(0, -1) : rows;
        function rowHtml(values) {
          return '<tr>' + values.map(function (value, index) {
            if (headers[index] === '较上期' && /^[↑↓]/.test(value)) value = '<span class="gap-markdown-viewer__trend ' + (value.charAt(0) === '↑' ? 'is-up' : 'is-down') + '">' + value + '</span>';
            return cellHtml('td', value, align[index]);
          }).join('') + '</tr>';
        }
        var head = plan.groups.length
          ? '<tr><th rowspan="2" scope="col">项目组</th>' + plan.groups.map(function (group) { return '<th colspan="' + group.count + '" scope="colgroup">' + group.role + '</th>'; }).join('') + '</tr><tr>' + plan.labels.map(function (label) { return cellHtml('th', label, 'right'); }).join('') + '</tr>'
          : '<tr>' + headers.map(function (header, index) { return cellHtml('th', header, align[index]); }).join('') + '</tr>';
        return '<div class="gap-markdown-viewer__table"><table><thead>' + head + '</thead><tbody>' + bodyRows.map(rowHtml).join('') + '</tbody>' + (hasSummary ? '<tfoot>' + rowHtml(summary) + '</tfoot>' : '') + '</table></div>';
      }
      function tableMarkdown(headers, sourceRows) {
        var align = columnAlign(headers), rows = formattedRows(headers, sourceRows), hasSummary = rows.length && isSummaryLabel(rows[rows.length - 1][0]);
        var summary = hasSummary ? rows[rows.length - 1].map(function (value) { return '**' + value + '**'; }) : null, bodyRows = hasSummary ? rows.slice(0, -1) : rows;
        return '| ' + headers.join(' | ') + ' |\n| ' + align.map(function (value) { return value ? '---:' : '---'; }).join(' | ') + ' |\n' + bodyRows.map(function (values) { return '| ' + values.join(' | ') + ' |'; }).join('\n') + (hasSummary ? '\n| ' + summary.join(' | ') + ' |' : '');
      }
      function comparisonFor(current, previous, unit, digits) {
        var difference = current - previous, arrow = difference > 0 ? '↑' : difference < 0 ? '↓' : '—';
        var value = difference.toFixed(digits), percent = previous === 0 ? (difference === 0 ? '0.0%' : '—') : (difference * 100 / Math.abs(previous)).toFixed(1) + '%';
        if (difference > 0) { value = '+' + value; if (percent !== '—') percent = '+' + percent; }
        var change = arrow + ' ' + value + unit;
        return { change: change, percent: percent, comparison: change + '（' + percent + '）' };
      }
      function overviewCardsFor(version) {
        var m = aggregateMetrics(version), previous = aggregateMetrics(version, 'previous');
        function qoderItem(role, current, before) { return Object.assign({ role: role, value: current + ' Credits' }, comparisonFor(current, before, ' Credits', 0)); }
        function codeItem(role, added, removed, previousAdded, previousRemoved) {
          var add = comparisonFor(added, previousAdded, ' 行', 0), deletion = comparisonFor(removed, previousRemoved, ' 行', 0);
          return { role: role, value: '+' + added + ' / -' + removed, change: '新增 ' + add.change + '；删除 ' + deletion.change, percent: '新增 ' + add.percent + '；删除 ' + deletion.percent, comparison: '新增 ' + add.comparison + '；删除 ' + deletion.comparison };
        }
        return [
          { label: '功能排期（完成率 / 延期率）', note: '完成 ' + m.done + ' / ' + m.total + ' 个功能；延期 ' + m.delayed + ' / ' + m.total + ' 个功能', items: [
            Object.assign({ role: '完成率', value: m.rate + '%' }, comparisonFor(Number(m.rate), Number(previous.rate), ' 个百分点', 1)),
            Object.assign({ role: '延期率', value: m.delayedRate + '%' }, comparisonFor(Number(m.delayedRate), Number(previous.delayedRate), ' 个百分点', 1))
